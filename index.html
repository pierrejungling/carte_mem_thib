t activer les fines de briques en AAM ?", "a": "Broyage fin (cyclogrinding) → augmentation de la surface spécifique → activation des caractéristiques amorphes. Mélange avec GGBFS et solution activatrice (NaOH + silicate de sodium).", "chapter": "Partie 3 — Courard"}, {"id": "p3-294", "section": "23. Innovation : 3D printing & autres", "q": "Tailles d50 des fines de brique étudiées ?", "a": "B1 : d50 = 3,3 µm (très fine). B2 : d50 = 20 µm (fine). B3 : d50 = 190 µm (grossière). La finesse améliore la réactivité.", "chapter": "Partie 3 — Courard"}, {"id": "p3-295", "section": "23. Innovation : 3D printing & autres", "q": "Composition oxydique d'une fine de brique typique ?", "a": "SiO2 : 62,8%. Al2O3 : 10,4%. Fe2O3 : 16,3%. CaO : 1,7%. K2O : 2,1%. Riche en silice (quartz, cristobalite), avec un peu d'amorphicité (~15,9%).", "chapter": "Partie 3 — Courard"}, {"id": "p3-296", "section": "23. Innovation : 3D printing & autres", "q": "Comparaison fines de brique vs GGBFS (CaO) ?", "a": "Fines de brique : 1,7% CaO. GGBFS : 42,9% CaO. Les fines de brique nécessitent un apport de chaux (du clinker ou de la solution AAM) pour réagir.", "chapter": "Partie 3 — Courard"}, {"id": "p3-297", "section": "23. Innovation : 3D printing & autres", "q": "Quels résultats sur AAM avec fines de brique ?", "a": "Hypothèse BLM (fines = précurseur comme GGBFS) : compense le GGBFS, kinetics rapide, Rc à 90 j ≥ GGBFS pur. Hypothèse BL (fines = addition minérale) : Rc diminue avec la teneur en brique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-298", "section": "23. Innovation : 3D printing & autres", "q": "Recommandations européennes pour l'évolution du recyclage ?", "a": "1) Marchés publics avec pourcentages obligatoires de granulats recyclés. 2) Interdire l'enfouissement de matériaux valorisables. 3) Statistiques nationales/régionales fiables sur le CDW.", "chapter": "Partie 3 — Courard"}, {"id": "p3-299", "section": "24. Réactions clés à connaître", "q": "Réaction de décarbonatation du calcaire (production de ciment) ?", "a": "CaCO3 → CaO + CO2. À environ 900°C. Source d'émission de CO2 incompressible dans la production de clinker.", "chapter": "Partie 3 — Courard"}, {"id": "p3-300", "section": "24. Réactions clés à connaître", "q": "Réaction d'hydratation de la chaux vive ?", "a": "CaO + H2O → Ca(OH)2 + 15,5 cal/g. EXOTHERMIQUE. Volume molaire : 16,8 cm³/mol (CaO) → 33,1 cm³/mol (Ca(OH)2). Cause des gonflements.", "chapter": "Partie 3 — Courard"}, {"id": "p3-301", "section": "24. Réactions clés à connaître", "q": "Réaction de carbonatation naturelle (Ca(OH)2) ?", "a": "Ca(OH)2 + CO2 → CaCO3 + H2O. Réaction lente à l'air libre. Importante pour le vieillissement du béton et la maturation des mâchefers.", "chapter": "Partie 3 — Courard"}, {"id": "p3-302", "section": "24. Réactions clés à connaître", "q": "Réaction de carbonatation directe du CaO (mâchefers) ?", "a": "CaO + CO2 → CaCO3. Direct, sans hydratation préalable. Forme la base de la carbonatation accélérée des mâchefers MSWI.", "chapter": "Partie 3 — Courard"}, {"id": "p3-303", "section": "24. Réactions clés à connaître", "q": "Réaction de réduction du fer (haut fourneau) ?", "a": "Fe2O3 + 3 CO → 2 Fe + 3 CO2. Réaction principale du haut fourneau, à très haute température. Le coke fournit le CO réducteur.", "chapter": "Partie 3 — Courard"}, {"id": "p3-304", "section": "24. Réactions clés à connaître", "q": "Réaction du calcin sur la pierre calcaire ?", "a": "CaCO3 + SO3 + H2O → CaSO4·2H2O + CO2. Formation de gypse (croûte noire) sur les monuments calcaires en milieu urbain pollué.", "chapter": "Partie 3 — Courard"}, {"id": "p3-305", "section": "24. Réactions clés à connaître", "q": "Réaction d'hydratation du C3S (cinétique rapide) ?", "a": "C3S + H2O → C-S-H + Ca(OH)2. Formation du gel C-S-H (résistance) + libération de chaux. Phase qui assure la résistance précoce.", "chapter": "Partie 3 — Courard"}, {"id": "p3-306", "section": "24. Réactions clés à connaître", "q": "Réaction d'hydratation du C2S (cinétique lente) ?", "a": "C2S + H2O → C-S-H + Ca(OH)2. Réaction LENTE, libère MOINS de chaleur que C3S. Contribue à la résistance long terme du ciment.", "chapter": "Partie 3 — Courard"}, {"id": "p3-307", "section": "24. Réactions clés à connaître", "q": "Réaction d'oxydation du Si dans le convertisseur LD ?", "a": "Si + O2 → SiO2. Décrasse la fonte en oxydant les impuretés siliceuses, fixées dans la scorie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-308", "section": "24. Réactions clés à connaître", "q": "Réaction d'oxydation du Mn dans le convertisseur LD ?", "a": "2 Mn + O2 → 2 MnO (ou MnO2 selon stoechiométrie). Décarburation du manganèse, présent dans la scorie d'aciérie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-309", "section": "24. Réactions clés à connaître", "q": "Réaction d'oxydation du P dans le convertisseur LD ?", "a": "2 P + 5/2 O2 → P2O5. Puis : P2O5 + 4 CaO → 4CaO·P2O5 (phosphate de calcium). Élimination du phosphore, néfaste pour l'acier.", "chapter": "Partie 3 — Courard"}, {"id": "p3-310", "section": "24. Réactions clés à connaître", "q": "Réaction de désulfuration dans le convertisseur LD ?", "a": "CaO + FeS → CaS + FeO. Fixation du soufre dans la scorie sous forme de sulfure de calcium, libération du fer dans la fonte.", "chapter": "Partie 3 — Courard"}]
;

  // ====== STATE ======
  let progress = {}; // cardId -> { interval, ease, due, reps, lapses }
  let sessionQueue = []; // current study session
  let sessionFilter = null; // { chapter? section? } or null = all
  let currentCardIdx = 0;
  let answerShown = false;
  let activeTab = 'dashboard';
  let browseChapterFilter = 'all';
  let browseSearch = '';
  let sessionDone = 0;
  let sessionTotal = 0;

  const STORAGE_KEY = 'genv003_progress';
  const NOW_MIN = () => Math.floor(Date.now() / 60000); // minutes since epoch
  const NOW_DAY = NOW_MIN; // alias for compatibility

  // ====== STORAGE ======
  async function loadProgress() {
    try {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) {
        progress = JSON.parse(result.value);
      }
    } catch (e) {
      progress = {};
    }
  }
  async function saveProgress() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(progress));
    } catch (e) {
      console.warn('save failed', e);
    }
  }
  async function resetProgress() {
    if (!confirm('Réinitialiser TOUS les progrès ? Cette action est irréversible.')) return;
    progress = {};
    try { await window.storage.delete(STORAGE_KEY); } catch(e) {}
    render();
  }

  // ====== SRS ALGORITHM — fixed intervals in minutes ======
  // rating: 1=Again (<1 min), 2=Hard (1 h), 3=Good (1 day), 4=Easy (2 days)
  // Intervals expressed in minutes
  const INT_AGAIN = 0;     // < 1 min : immediate requeue
  const INT_HARD  = 60;    // 1 hour
  const INT_GOOD  = 1440;  // 1 day
  const INT_EASY  = 2880;  // 2 days

  function gradeCard(cardId, rating) {
    const now = NOW_MIN();
    const p = progress[cardId] || { interval: 0, ease: 2.5, due: now, reps: 0, lapses: 0 };

    if (rating === 1) {
      // Again — lapse, very short interval
      p.lapses++;
      p.reps = 0;
      p.interval = INT_AGAIN;
      p.due = now + INT_AGAIN;
    } else if (rating === 2) {
      // Hard — 1 hour
      p.interval = INT_HARD;
      p.reps++;
      p.due = now + INT_HARD;
    } else if (rating === 3) {
      // Good — 1 day
      p.interval = INT_GOOD;
      p.reps++;
      p.due = now + INT_GOOD;
    } else if (rating === 4) {
      // Easy — 2 days
      p.interval = INT_EASY;
      p.reps++;
      p.due = now + INT_EASY;
    }
    progress[cardId] = p;
    saveProgress();
  }

  function intervalLabel(cardId, rating) {
    // Preview what would happen — fixed intervals
    if (rating === 1) return '< 1 min';
    if (rating === 2) return '1 h';
    if (rating === 3) return '1 j';
    if (rating === 4) return '2 j';
    return '';
  }

  function cardStatus(cardId) {
    const p = progress[cardId];
    if (!p) return 'new';
    if (p.reps < 2 || p.lapses > 0 && p.reps < 2) return 'learning';
    return 'review';
  }

  function isDue(cardId) {
    const p = progress[cardId];
    if (!p) return true; // new cards count as due
    return p.due <= NOW_MIN();
  }

  // ====== DASHBOARD ======
  function renderDashboard() {
    const now = NOW_MIN();
    const totals = { new: 0, learning: 0, review: 0, due: 0, learned: 0 };
    const byChapter = {};

    for (const c of CARDS_RAW) {
      const p = progress[c.id];
      const status = cardStatus(c.id);
      const due = isDue(c.id);

      totals[status]++;
      if (due) totals.due++;
      if (p && p.reps >= 3 && p.lapses === 0) totals.learned++;

      if (!byChapter[c.chapter]) {
        byChapter[c.chapter] = { total: 0, new: 0, due: 0, ok: 0 };
      }
      byChapter[c.chapter].total++;
      if (!p) byChapter[c.chapter].new++;
      else if (due) byChapter[c.chapter].due++;
      else byChapter[c.chapter].ok++;
    }

    const v = document.getElementById('view-dashboard');
    v.innerHTML = `
      <div class="dashboard-stats">
        <div class="stat">
          <div class="stat-label">À réviser</div>
          <div class="stat-value due">${totals.due}</div>
        </div>
        <div class="stat">
          <div class="stat-label">En cours</div>
          <div class="stat-value">${totals.learning}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Maîtrisées</div>
          <div class="stat-value learned">${totals.learned}</div>
        </div>
      </div>

      <div class="study-cta">
        <div>
          <h2>Session d'étude</h2>
          <p>${totals.due > 0 ? `${totals.due} cartes à réviser maintenant` : 'Aucune carte due — tout est à jour ✦'}</p>
        </div>
        <button class="btn-primary" id="start-all-btn" ${totals.due === 0 ? 'disabled' : ''}>
          ${totals.due > 0 ? 'Étudier maintenant' : 'Rien à étudier'}
        </button>
      </div>

      <div class="chapters-section">
        <h3>Par chapitre</h3>
        ${Object.entries(byChapter).map(([chap, c]) => {
          const done = c.total - c.new - c.due;
          const pct = Math.round((done / c.total) * 100);
          return `
            <div class="chapter-card" data-chapter="${escapeHtml(chap)}">
              <div class="chapter-card-header">
                <div class="chapter-card-title">${escapeHtml(chap)}</div>
                <div class="chapter-card-counts">
                  <span class="new">${c.new} nouv.</span>
                  <span class="due">${c.due} dues</span>
                  <span class="ok">${c.ok} ok</span>
                </div>
              </div>
              <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('')}
      </div>

      <button class="reset-btn" id="reset-btn">Réinitialiser tous les progrès</button>
    `;

    const startBtn = document.getElementById('start-all-btn');
    if (startBtn) startBtn.onclick = () => startSession(null);
    document.querySelectorAll('.chapter-card').forEach(el => {
      el.onclick = () => {
        const chap = el.getAttribute('data-chapter');
        startSession({ chapter: chap });
      };
    });
    document.getElementById('reset-btn').onclick = resetProgress;
  }

  // ====== SESSION / STUDY ======
  function startSession(filter) {
    sessionFilter = filter;
    answerShown = false;

    // Build queue: due cards + some new cards, filtered
    let pool = CARDS_RAW.filter(c => {
      if (filter && filter.chapter && c.chapter !== filter.chapter) return false;
      return isDue(c.id);
    });

    // If chapter and nothing due in that chapter, take all new+due for chapter
    if (pool.length === 0 && filter && filter.chapter) {
      pool = CARDS_RAW.filter(c => c.chapter === filter.chapter);
    }

    // Shuffle
    pool = pool.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    sessionQueue = pool;
    sessionTotal = pool.length;
    sessionDone = 0;
    currentCardIdx = 0;
    activeTab = 'study';
    if (sessionQueue.length === 0) {
      alert('Aucune carte disponible pour cette sélection.');
      return;
    }
    render();
  }

  function endSession() {
    activeTab = 'dashboard';
    render();
  }

  function renderStudy() {
    const v = document.getElementById('view-study');

    if (sessionQueue.length === 0) {
      v.innerHTML = `
        <div class="session-end">
          <div class="icon">✦</div>
          <h2>Session terminée</h2>
          <p>${sessionDone} carte${sessionDone > 1 ? 's' : ''} étudiée${sessionDone > 1 ? 's' : ''} dans cette session.</p>
          <button class="btn-primary" id="back-dash">Retour au tableau de bord</button>
        </div>
      `;
      document.getElementById('back-dash').onclick = endSession;
      return;
    }

    const card = sessionQueue[0];
    const remaining = sessionQueue.length;

    v.innerHTML = `
      <div class="study-toolbar">
        <div class="study-meta">
          <span class="count">${remaining}</span> restante${remaining > 1 ? 's' : ''}
          ${sessionFilter && sessionFilter.chapter ? ` · ${escapeHtml(sessionFilter.chapter)}` : ''}
        </div>
        <button class="btn-secondary" id="quit-session">Quitter</button>
      </div>

      <div class="flashcard">
        <div class="flashcard-section">${escapeHtml(card.section)}</div>
        <div class="flashcard-question">${escapeHtml(card.q)}</div>
        ${answerShown ? `
          <hr class="flashcard-divider">
          <div class="flashcard-answer">${escapeHtml(card.a)}</div>
        ` : ''}
        ${!answerShown ? `
          <button class="show-answer-btn" id="show-answer">
            Afficher la réponse <span class="shortcut">(Espace)</span>
          </button>
        ` : ''}
      </div>

      ${answerShown ? `
        <div class="rate-buttons">
          <button class="rate-btn again" data-rating="1">
            <div class="label">À revoir</div>
            <div class="interval">${intervalLabel(card.id, 1)}</div>
            <div class="shortcut">[1]</div>
          </button>
          <button class="rate-btn hard" data-rating="2">
            <div class="label">Difficile</div>
            <div class="interval">${intervalLabel(card.id, 2)}</div>
            <div class="shortcut">[2]</div>
          </button>
          <button class="rate-btn good" data-rating="3">
            <div class="label">Correct</div>
            <div class="interval">${intervalLabel(card.id, 3)}</div>
            <div class="shortcut">[3]</div>
          </button>
          <button class="rate-btn easy" data-rating="4">
            <div class="label">Facile</div>
            <div class="interval">${intervalLabel(card.id, 4)}</div>
            <div class="shortcut">[4]</div>
          </button>
        </div>
      ` : ''}
    `;

    if (!answerShown) {
      document.getElementById('show-answer').onclick = () => {
        answerShown = true;
        renderStudy();
      };
    } else {
      document.querySelectorAll('.rate-btn').forEach(btn => {
        btn.onclick = () => handleRating(parseInt(btn.getAttribute('data-rating'), 10));
      });
    }
    document.getElementById('quit-session').onclick = endSession;
  }

  function handleRating(rating) {
    const card = sessionQueue[0];
    gradeCard(card.id, rating);
    // Remove from queue (or requeue if "Again")
    sessionQueue.shift();
    if (rating === 1) {
      // Requeue at end for re-study this session
      sessionQueue.push(card);
    } else {
      sessionDone++;
    }
    answerShown = false;
    renderStudy();
  }

  // ====== BROWSE VIEW ======
  function renderBrowse() {
    const v = document.getElementById('view-browse');
    const chapters = ['all', ...new Set(CARDS_RAW.map(c => c.chapter))];

    const filtered = CARDS_RAW.filter(c => {
      if (browseChapterFilter !== 'all' && c.chapter !== browseChapterFilter) return false;
      if (browseSearch) {
        const s = browseSearch.toLowerCase();
        if (!c.q.toLowerCase().includes(s) && !c.a.toLowerCase().includes(s) && !c.section.toLowerCase().includes(s)) {
          return false;
        }
      }
      return true;
    });

    v.innerHTML = `
      <input type="text" class="search-input" placeholder="Rechercher dans les questions et réponses..." value="${escapeHtml(browseSearch)}" id="search-input">
      <div class="browse-filters">
        ${chapters.map(ch => `
          <button class="filter-btn ${browseChapterFilter === ch ? 'active' : ''}" data-chap="${escapeHtml(ch)}">
            ${ch === 'all' ? 'Tous' : escapeHtml(ch)}
          </button>
        `).join('')}
      </div>
      <div class="study-meta" style="margin-bottom: 12px;">${filtered.length} carte${filtered.length > 1 ? 's' : ''}</div>
      <div id="browse-list">
        ${filtered.map(c => {
          const status = cardStatus(c.id);
          const statusLabel = status === 'new' ? 'Nouveau' : status === 'learning' ? 'En cours' : 'Maîtrisé';
          return `
            <div class="browse-card" data-card-id="${c.id}">
              <div class="browse-card-header">
                <span class="browse-card-section">${escapeHtml(c.chapter)} · ${escapeHtml(c.section)}</span>
                <span class="browse-card-status ${status}">${statusLabel}</span>
              </div>
              <div class="browse-card-q">${escapeHtml(c.q)}</div>
              <div class="browse-card-a" style="display:none;">${escapeHtml(c.a)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    const searchInput = document.getElementById('search-input');
    searchInput.oninput = (e) => {
      browseSearch = e.target.value;
      renderBrowse();
      // Restore focus
      const el = document.getElementById('search-input');
      if (el) { el.focus(); el.setSelectionRange(browseSearch.length, browseSearch.length); }
    };

    document.querySelectorAll('.filter-btn').forEach(b => {
      b.onclick = () => {
        browseChapterFilter = b.getAttribute('data-chap');
        renderBrowse();
      };
    });

    document.querySelectorAll('.browse-card').forEach(c => {
      c.onclick = () => {
        const ans = c.querySelector('.browse-card-a');
        ans.style.display = ans.style.display === 'none' ? 'block' : 'none';
      };
    });
  }

  // ====== MAIN RENDER ======
  function render() {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.getAttribute('data-tab') === activeTab);
    });
    document.getElementById('view-dashboard').style.display = activeTab === 'dashboard' ? 'block' : 'none';
    document.getElementById('view-study').style.display = activeTab === 'study' ? 'block' : 'none';
    document.getElementById('view-browse').style.display = activeTab === 'browse' ? 'block' : 'none';

    if (activeTab === 'dashboard') renderDashboard();
    else if (activeTab === 'study') renderStudy();
    else if (activeTab === 'browse') renderBrowse();
  }

  // ====== UTILS ======
  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  // ====== KEYBOARD ======
  document.addEventListener('keydown', (e) => {
    if (activeTab !== 'study') return;
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (!answerShown) {
        answerShown = true;
        renderStudy();
      }
    } else if (answerShown && ['Digit1','Digit2','Digit3','Digit4'].includes(e.code)) {
      e.preventDefault();
      handleRating(parseInt(e.code.replace('Digit', ''), 10));
    }
  });

  // ====== INIT ======
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      activeTab = t.getAttribute('data-tab');
      render();
    };
  });

  (async () => {
    await loadProgress();
    render();
  })();

})();
</script>
</body>
</html>
