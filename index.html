<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matières premières · Flashcards</title>
</head>
<body>
<style>
  :root {
    --bg: #0f1419;
    --bg-card: #1a2028;
    --bg-elev: #232b35;
    --border: #2d3742;
    --text: #e8eef5;
    --text-dim: #8a96a6;
    --text-muted: #5a6573;
    --accent: #d4a574;
    --accent-soft: rgba(212, 165, 116, 0.12);
    --green: #7ec488;
    --orange: #e0b25a;
    --red: #e07b6b;
    --blue: #6ba8d4;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    --font-display: 'Fraunces', 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, .app-root {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app-root {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  /* ---- HEADER ---- */
  .header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .header h1 .accent { color: var(--accent); font-style: italic; }
  .header .sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .header .code {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
  }

  /* ---- TABS ---- */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-card);
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 9px 12px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.15s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ---- VIEWS ---- */
  .view { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- DASHBOARD ---- */
  .dashboard-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
  }
  .stat-value.due { color: var(--orange); }
  .stat-value.learned { color: var(--green); }

  .study-cta {
    background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .study-cta h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .study-cta p {
    font-size: 14px;
    color: var(--text-dim);
  }
  .btn-primary {
    background: var(--accent);
    color: #1a1410;
    border: none;
    padding: 11px 24px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
    white-space: nowrap;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary:hover { background: var(--bg-elev); border-color: var(--text-muted); }

  /* ---- CHAPTERS LIST ---- */
  .chapters-section h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  .chapter-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chapter-card:hover { border-color: var(--accent); background: var(--bg-elev); }
  .chapter-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .chapter-card-title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 17px;
    color: var(--text);
  }
  .chapter-card-counts {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .chapter-card-counts .due { color: var(--orange); }
  .chapter-card-counts .new { color: var(--blue); }
  .chapter-card-counts .ok { color: var(--green); }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--accent), var(--green));
    transition: width 0.3s ease;
  }

  /* ---- STUDY VIEW (FLASHCARD) ---- */
  .study-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .study-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .study-meta .count { color: var(--accent); font-weight: 600; }

  .flashcard {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    position: relative;
  }
  .flashcard-section {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .flashcard-section::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
  .flashcard-question {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 24px;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: 24px;
    letter-spacing: -0.01em;
  }
  .flashcard-divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 8px 0 24px;
  }
  .flashcard-answer {
    font-size: 16px;
    line-height: 1.65;
    color: var(--text);
    flex-grow: 1;
    animation: revealAnswer 0.35s ease;
  }
  @keyframes revealAnswer {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .show-answer-btn {
    display: block;
    margin: 24px auto 0;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 11px 28px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .show-answer-btn:hover { border-color: var(--accent); color: var(--accent); }
  .show-answer-btn .shortcut {
    color: var(--text-muted);
    font-size: 12px;
    margin-left: 8px;
    font-family: var(--font-mono);
  }

  .rate-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    animation: revealAnswer 0.35s ease;
  }
  .rate-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
    color: var(--text);
    text-align: center;
  }
  .rate-btn:hover { transform: translateY(-1px); }
  .rate-btn .label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .rate-btn .interval {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }
  .rate-btn .shortcut {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 4px;
    opacity: 0.6;
  }
  .rate-btn.again { border-color: rgba(224, 123, 107, 0.4); }
  .rate-btn.again .label { color: var(--red); }
  .rate-btn.again:hover { background: rgba(224, 123, 107, 0.08); border-color: var(--red); }
  .rate-btn.hard { border-color: rgba(224, 178, 90, 0.4); }
  .rate-btn.hard .label { color: var(--orange); }
  .rate-btn.hard:hover { background: rgba(224, 178, 90, 0.08); border-color: var(--orange); }
  .rate-btn.good { border-color: rgba(126, 196, 136, 0.4); }
  .rate-btn.good .label { color: var(--green); }
  .rate-btn.good:hover { background: rgba(126, 196, 136, 0.08); border-color: var(--green); }
  .rate-btn.easy { border-color: rgba(107, 168, 212, 0.4); }
  .rate-btn.easy .label { color: var(--blue); }
  .rate-btn.easy:hover { background: rgba(107, 168, 212, 0.08); border-color: var(--blue); }

  /* ---- BROWSE VIEW ---- */
  .browse-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
  }
  .filter-btn:hover { color: var(--text); }
  .filter-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .browse-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .browse-card:hover { border-color: var(--text-muted); }
  .browse-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .browse-card-section {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .browse-card-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .browse-card-status.new { background: rgba(107, 168, 212, 0.1); color: var(--blue); }
  .browse-card-status.learning { background: rgba(224, 178, 90, 0.1); color: var(--orange); }
  .browse-card-status.review { background: rgba(126, 196, 136, 0.1); color: var(--green); }
  .browse-card-q {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 15px;
    color: var(--text);
  }
  .browse-card-a {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    line-height: 1.55;
  }

  /* ---- SETTINGS / FOOTER ---- */
  .session-end {
    text-align: center;
    padding: 48px 20px;
  }
  .session-end .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .session-end h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .session-end p {
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .help-bar {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
  }
  .help-bar kbd {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    margin-top: 12px;
  }
  .reset-btn:hover { color: var(--red); border-color: var(--red); }

  /* Mobile */
  @media (max-width: 600px) {
    .app-root { padding: 16px 12px 32px; }
    .header h1 { font-size: 22px; }
    .dashboard-stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { padding: 10px; }
    .stat-value { font-size: 22px; }
    .flashcard { padding: 22px 18px; }
    .flashcard-question { font-size: 19px; }
    .rate-buttons { grid-template-columns: repeat(2, 1fr); }
    .study-cta { padding: 16px; }
  }
</style>

<div class="app-root">
  <header class="header">
    <h1>Matières premières <span class="accent">·</span> Flashcards</h1>
    <div class="sub">Conception durable & économie circulaire</div>
    <div class="code">GENV003-1 · Pirard · Léonard · Courard</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="dashboard">Tableau de bord</button>
    <button class="tab" data-tab="browse">Parcourir</button>
  </div>

  <div id="view-dashboard" class="view"></div>
  <div id="view-study" class="view" style="display:none;"></div>
  <div id="view-browse" class="view" style="display:none;"></div>

  <div class="help-bar">
    <kbd>Espace</kbd> retourner la carte &nbsp;·&nbsp;
    <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd>/<kbd>4</kbd> noter &nbsp;·&nbsp;
    progrès sauvegardés automatiquement
  </div>
</div>

<script>
(function() {
  'use strict';

  // ====== DATA (748 cartes) ======
  const CARDS_RAW = [{"id": "p1-1", "section": "1. Technologie & innovation", "q": "Comment a évolué la chaîne de valeur derrière les couleurs (ex: rouge) dans l'histoire ?", "a": "Préhistoire : ocre naturel local (oxyde de fer). 15e siècle : pigments minéraux/animaux importés (cinabre HgS d'Espagne). Aujourd'hui : luminophores rouges Y2O3:Eu3+ totalement synthétiques, extraits en Chine (bastnäsite). La chaîne de valeur est devenue extrêmement longue et technologique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-2", "section": "1. Technologie & innovation", "q": "Qu'est-ce que l'hypermatérialisation ?", "a": "Phénomène de complexification croissante des technologies, qui utilisent de plus en plus de matières premières différentes. Chaque produit moderne cache une très longue chaîne de valeur (extraction, transport, transformation).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-3", "section": "1. Technologie & innovation", "q": "Quel compromis caractérise l'hypermatérialisation ?", "a": "On optimise la FONCTIONNALITÉ d'un produit, mais cela se fait au prix d'une AUGMENTATION de l'extraction de ressources et d'une DIMINUTION de la recyclabilité.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-4", "section": "1. Technologie & innovation", "q": "Avant la Seconde Guerre Mondiale, quelle était la logique dominante de conception des produits ?", "a": "Logique de puissance et de performance, sans aucune contrainte environnementale (ex: secteur du transport). On optimisait les fonctions au détriment des ressources et de la recyclabilité.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-5", "section": "1. Technologie & innovation", "q": "Combien de métaux différents utilisait-on au 17e siècle (époque de Vermeer) ?", "a": "7 métaux seulement. Énergie utilisée : 100% renouvelable. Main d'œuvre : 3-4 personnes par jour pour fabriquer un objet.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-6", "section": "1. Technologie & innovation", "q": "Combien de métaux différents utilise-t-on aujourd'hui dans nos technologies ?", "a": "91 métaux différents. Énergie utilisée : > 80% non renouvelable. Main d'œuvre équivalente : 400 personnes par jour mobilisées indirectement pour un objet moderne.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-7", "section": "1. Technologie & innovation", "q": "Quelle était la composition d'une machine à café dans les années 1970 ?", "a": "Essentiellement des tubes en cuivre, un matériau 100% recyclable. Conception simple, démontable, durable.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-8", "section": "1. Technologie & innovation", "q": "Quel est le problème de recyclage des machines à café modernes à capsules ?", "a": "Les capsules à usage unique combinent plusieurs matériaux (plastique + aluminium + composés organiques). Ce mélange rend le recyclage très difficile.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-9", "section": "1. Technologie & innovation", "q": "Quel est l'ordre chronologique d'évolution des ampoules ?", "a": "Incandescence → Halogène → Fluocompacte → LED.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-10", "section": "1. Technologie & innovation", "q": "Pourquoi le tungstène des anciennes ampoules à incandescence n'a-t-il pas été recyclé malgré sa simplicité ?", "a": "Le recyclage était techniquement faisable mais pas économiquement avantageux. Les quantités étaient faibles et le coût de collecte trop élevé.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-11", "section": "1. Technologie & innovation", "q": "Les LED durent-elles vraiment plus longtemps que les ampoules à incandescence ?", "a": "Pas nécessairement. Elles sont plus efficaces énergétiquement, mais leur durée de vie réelle n'est pas toujours supérieure et elles posent de gros problèmes de fin de vie (composants électroniques complexes).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-12", "section": "1. Technologie & innovation", "q": "Pourquoi les LED sont-elles difficiles à recycler ?", "a": "Elles contiennent de nombreux composants électroniques complexes (semi-conducteurs, terres rares, métaux précieux en très petites quantités) qui sont coûteux et techniquement difficiles à séparer.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-13", "section": "1. Technologie & innovation", "q": "En quoi consiste le paradoxe du progrès technique en matière de recyclage ?", "a": "Le temps nécessaire pour développer des méthodes de recyclage adaptées est souvent plus long que le cycle de renouvellement technologique. Les technologies deviennent obsolètes AVANT que des solutions de recyclage efficaces aient été mises en place.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-14", "section": "1. Technologie & innovation", "q": "Qu'est-ce que l'effet rebond ?", "a": "Phénomène paradoxal où une amélioration de l'efficacité d'un produit (ex: voiture moins gourmande) incite à l'utiliser davantage (rouler plus loin/souvent), ce qui annule partiellement ou totalement les gains environnementaux attendus.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-15", "section": "1. Technologie & innovation", "q": "Donne un exemple concret d'effet rebond.", "a": "Une voiture qui consomme moins de carburant pousse à rouler plus souvent ou plus loin. Le gain énergétique au km est annulé par l'augmentation des km parcourus.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-16", "section": "1. Technologie & innovation", "q": "Quel a été le poids d'une Mini en 1959 ?", "a": "600 kg.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-17", "section": "1. Technologie & innovation", "q": "Quel est le poids approximatif d'une Mini en 2019 ?", "a": "1440 kg, soit plus du double du modèle original (600 kg en 1959).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-18", "section": "1. Technologie & innovation", "q": "Quel est le poids du Tesla Cybertruck (2025) et le poids de sa batterie ?", "a": "3100 kg au total, dont 700 kg rien que pour la batterie.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-19", "section": "1. Technologie & innovation", "q": "Pourquoi les voitures modernes sont-elles devenues plus lourdes ?", "a": "Ajout de fonctions de sécurité (airbags, structures renforcées), efficacité moteur, et nombreuses fonctions secondaires (électronique, confort). Effet rebond : les gains d'efficacité sont annulés par une surconsommation de matériaux.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-20", "section": "1. Technologie & innovation", "q": "Évolution du poids moyen d'une voiture entre 2012 et 2023 ?", "a": "Passé de 1204 kg (2012) à 1256 kg (2023). Les voitures électriques et hybrides sont particulièrement lourdes à cause des batteries.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-21", "section": "1. Technologie & innovation", "q": "Donne un exemple comparant le poids d'une Mini essence vs électrique.", "a": "Mini essence (2023) : ~1250 kg. Mini électrique (2023) : ~1430 kg. Audi e-tron Quattro : 2515 kg. Tesla Model X : 2455 kg.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-22", "section": "1. Technologie & innovation", "q": "Quelle est l'attitude générale à adopter face à la durabilité selon Pirard (THINK wide / ACT sustainably) ?", "a": "Penser à toute la chaîne de valeur (THINK wide) et agir en symbiose avec la planète, ses habitants et les générations futures (ACT sustainably).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-23", "section": "1. Technologie & innovation", "q": "Comment définit-on le développement durable (Rapport Brundtland) ?", "a": "Un développement qui répond aux besoins du présent sans compromettre la capacité des générations futures à répondre aux leurs. Deux concepts clés : la notion de 'besoins' (surtout des plus défavorisés) et les limites imposées par l'environnement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-24", "section": "2. Consommation & déchets", "q": "Depuis la période préindustrielle, par combien la consommation d'énergie a-t-elle été multipliée ?", "a": "x100. Principalement grâce à l'abondance et l'accessibilité du pétrole.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-25", "section": "2. Consommation & déchets", "q": "Pour revenir à une consommation d'énergie 'correcte' (soutenable), par combien faudrait-il diviser notre consommation actuelle ?", "a": "Par 3. C'est l'ordre de grandeur de la réduction nécessaire pour rester dans les limites planétaires.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-26", "section": "2. Consommation & déchets", "q": "Quelle est l'extraction annuelle mondiale totale de matières premières ?", "a": "Environ 100 Gt/an (gigatonnes par an). En 50 ans, la population a doublé et la consommation a triplé.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-27", "section": "2. Consommation & déchets", "q": "Quelles sont les 5 grandes catégories de matières extraites mondialement ?", "a": "Matériaux de construction, minéraux industriels, minerais métalliques, combustibles fossiles, biomasse.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-28", "section": "2. Consommation & déchets", "q": "Quelles matières représentent le plus gros volume extrait mondialement ?", "a": "Les matériaux de construction (sable, graviers, ciment), suivis des argiles et des métaux.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-29", "section": "2. Consommation & déchets", "q": "Quelles sont les 4 principales ressources extraites en valeur de marché ?", "a": "Pétrole, gaz naturel, charbon, minéraux industriels.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-30", "section": "2. Consommation & déchets", "q": "L'or est-il une ressource importante en volume ou en valeur ?", "a": "L'or est l'un des plus gros marchés en capitalisation, mais il est peu utile fonctionnellement (essentiellement financier et symbolique).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-31", "section": "2. Consommation & déchets", "q": "Quelle est la production mondiale annuelle d'acier en 2024 ?", "a": "Environ 2,2 Gt/an (2100 millions de tonnes).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-32", "section": "2. Consommation & déchets", "q": "Comment la consommation d'acier est-elle répartie dans le monde par habitant ?", "a": "Très inégalement : ~1 t/personne/an en Corée du Sud, ~400 kg/pers/an en Europe de l'Ouest, ~30 kg/pers/an en Afrique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-33", "section": "2. Consommation & déchets", "q": "Quelle est la production annuelle mondiale d'aluminium ?", "a": "72 Mt/an. Production très énergivore (électrolyse). Consommation : 42 kg/hab/an en Corée, 9 kg en moyenne mondiale, 2 kg en Afrique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-34", "section": "2. Consommation & déchets", "q": "Quelle est la production annuelle mondiale de cuivre ?", "a": "Environ 26 Mt/an. Consommation : 19 kg/hab/an à Taïwan, 3,3 kg en moyenne mondiale, 0,3 kg en Inde.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-35", "section": "2. Consommation & déchets", "q": "Quelle proportion du cuivre mondial est raffinée en Chine ?", "a": "80% du cuivre mondial est raffiné en Chine. Le cuivre est très dispersé et présent dans de nombreuses filières (électronique, câbles, transformateurs).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-36", "section": "2. Consommation & déchets", "q": "Que signifie 'génération BIC' selon Pirard ?", "a": "Buy - Ignore - Chuck (Acheter - Ignorer - Jeter). Caractérise notre modèle linéaire 'take-make-dispose' qui s'oppose à l'économie circulaire.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-37", "section": "2. Consommation & déchets", "q": "Qu'est-ce que le modèle économique linéaire (TAKE-MAKE-DISPOSE) ?", "a": "On EXTRAIT les ressources, on PRODUIT des biens, on JETTE en fin de vie. Modèle dominant actuellement, à l'opposé de l'économie circulaire.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-38", "section": "2. Consommation & déchets", "q": "Quelle est la définition européenne d'un déchet ?", "a": "Toute substance ou objet dont le détenteur se défait, a l'intention de se défaire, ou est obligé de se défaire en vertu de la législation nationale (Directive cadre déchets UE / UNEP).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-39", "section": "2. Consommation & déchets", "q": "Quelle est la quantité de déchets totale circulant en Europe par an ?", "a": "Environ 8 milliards de tonnes (circulation totale des matériaux en UE).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-40", "section": "2. Consommation & déchets", "q": "Quelle quantité de déchets par habitant générait-on en Europe en 2022 ?", "a": "5 tonnes/habitant/an (tous types confondus, hors minéraux de construction).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-41", "section": "2. Consommation & déchets", "q": "Quel pourcentage des déchets européens était recyclé vs mis en décharge en 2022 ?", "a": "40,8% recyclés et 30,2% mis en décharge. Le reste est valorisé énergétiquement ou autre.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-42", "section": "2. Consommation & déchets", "q": "Combien de kg de déchets ménagers par habitant en Belgique par an ?", "a": "Environ 505 kg/hab/an dans l'UE-27. En Belgique : 5 Mt/an pour la population (~10 millions).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-43", "section": "2. Consommation & déchets", "q": "Comment se répartissent les déchets ménagers en Belgique (catégories) ?", "a": "26% collecte sélective (PMC, verre...), 26% déchets résiduels, 17% inertes, 10% déchets verts, 10% encombrants, et autres fractions.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-44", "section": "2. Consommation & déchets", "q": "Qu'est-ce que la Convention de Bâle ?", "a": "Convention signée en 1989, en vigueur depuis 1992. Contrôle les mouvements transfrontaliers de déchets dangereux et leur élimination (toxique, explosif, inflammable, corrosif).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-45", "section": "2. Consommation & déchets", "q": "Qu'est-ce que le Basel Ban Amendment ?", "a": "Amendement signé en 1995, pas encore en vigueur. Interdirait l'exportation de déchets dangereux des pays développés vers les pays en développement, même pour recyclage.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-46", "section": "2. Consommation & déchets", "q": "Quelle pratique controversée échappe à la Convention de Bâle ?", "a": "Le démantèlement de navires en Asie (ship-breaking), notamment en Inde, au Bangladesh et au Pakistan, qui contourne souvent les règles.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-47", "section": "2. Consommation & déchets", "q": "Quelles sont les 4 conditions pour qu'un déchet cesse d'être un déchet (end-of-waste) ?", "a": "1) Il existe une utilisation spécifique pour ce matériau. 2) Il existe un marché ou une demande. 3) Il respecte les normes techniques et juridiques applicables. 4) Il ne présente pas de danger pour la santé ou l'environnement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-48", "section": "2. Consommation & déchets", "q": "Qu'est-ce que le C&D Waste (CDW) ?", "a": "Construction & Demolition Waste : déchets générés par les activités de construction, rénovation et démolition de bâtiments, infrastructures, etc.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-49", "section": "2. Consommation & déchets", "q": "Quelle est la production annuelle de CDW en Belgique ?", "a": "Environ 20 Mt/an, soit 1,1 à 2 tonnes par habitant.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-50", "section": "2. Consommation & déchets", "q": "Comment varie la production de CDW par habitant en Europe ?", "a": "Belgique : 1,1-2 t/cap. Luxembourg : 5,9 t/cap. Pologne : 0,11 t/cap. Différences énormes selon la dynamique de construction.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-51", "section": "2. Consommation & déchets", "q": "Qu'est-ce que le HDI et pourquoi est-il pertinent ?", "a": "Human Development Index. Combine le PIB, l'espérance de vie et l'éducation. Plus le HDI d'un pays est élevé, plus sa consommation matérielle augmente (relation quasi linéaire).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-52", "section": "2. Consommation & déchets", "q": "Comment se compare la quantité de déchets entre 1998 et 2023 ?", "a": "Quantité totale similaire : ~550 kg/personne/an. MAIS en 1998 : 70% étaient enfouis et 30% recyclés. En 2023 : tendance inversée.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-53", "section": "2. Consommation & déchets", "q": "Qu'est-ce qu'un 'déchet ultime' ?", "a": "Produit en fin de cycle de vie sans aucune possibilité de revalorisation. Destiné à l'enfouissement définitif.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-54", "section": "2. Consommation & déchets", "q": "Que représentent les déchets ménagers vs industriels en valeur ?", "a": "Les ménagers sont faibles en volume mais visibles. Les industriels (extraction, transformation) représentent la grande majorité des flux de matière.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-55", "section": "2. Consommation & déchets", "q": "Que contient le 'Mineral Baby' (consommation cumulée sur une vie) ?", "a": "35 t acier, 27 t ciment, 10 t phosphates, 7 t argiles, 450 kg cuivre, 78 g or, 250 t charbon, 200 000 L pétrole.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-56", "section": "2. Consommation & déchets", "q": "Pourquoi le concept de 'Mineral Baby' est-il intéressant ?", "a": "Il illustre la consommation matérielle énorme cachée derrière une vie 'normale' dans les pays développés. Aide à visualiser notre empreinte matière.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-57", "section": "2. Consommation & déchets", "q": "Quel est le rendement global de conversion des ressources en fonctions utiles ?", "a": "Seulement 10-30%. Les pertes ont lieu à chaque étape : extraction, production, transport, usage et fin de vie.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-58", "section": "2. Consommation & déchets", "q": "Quelle proportion peut représenter les stériles miniers dans la masse totale déplacée ?", "a": "Jusqu'à 90% de la masse déplacée. Pour extraire 1 t de métal utile, on peut déplacer 10 fois plus de roche stérile.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-59", "section": "2. Consommation & déchets", "q": "Qu'est-ce que les 'end-of-life products' (urban mine) en Belgique ?", "a": "Produits en fin de vie : > 30 kg/personne/an. Inclut les véhicules hors d'usage (~15 kg/pers/an) et les déchets électriques/électroniques WEEE (~10 kg/pers/an).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-60", "section": "3. Métaux & transition énergétique", "q": "Quelles sont les émissions mondiales annuelles de gaz à effet de serre (GES) ?", "a": "Environ 50 Gt CO2-équivalent par an.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-61", "section": "3. Métaux & transition énergétique", "q": "Quels sont les principaux secteurs contributeurs aux émissions de GES ?", "a": "L'énergie (transports, bâtiments, industrie), l'agriculture, et l'industrie (chimie, ciment).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-62", "section": "3. Métaux & transition énergétique", "q": "Quels sont les gaz à effet de serre les plus puissants en GWP ?", "a": "Le méthane (CH4) et la vapeur d'eau ont des effets très importants. Le CO2 est le plus abondant en volume mais moins puissant par molécule.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-63", "section": "3. Métaux & transition énergétique", "q": "Quelle part des émissions mondiales représente le secteur du ciment ?", "a": "5 à 8%.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-64", "section": "3. Métaux & transition énergétique", "q": "Quelle part des émissions mondiales représente la sidérurgie (acier) ?", "a": "6 à 8%.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-65", "section": "3. Métaux & transition énergétique", "q": "Quelle part représentent l'extraction et la fabrication industrielle ?", "a": "Environ 10% des émissions mondiales de GES.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-66", "section": "3. Métaux & transition énergétique", "q": "Quelle part représente l'aviation dans les émissions mondiales ?", "a": "Moins de 2% des émissions mondiales de GES.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-67", "section": "3. Métaux & transition énergétique", "q": "Quelle est la réaction chimique de calcination du calcaire (production de chaux) ?", "a": "CaCO3 → CaO + CO2. Réaction faite à 800-900°C dans un four rotatif (typiquement 70 m de long, 750 t/jour).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-68", "section": "3. Métaux & transition énergétique", "q": "Combien de CO2 émet 1 tonne de chaux (CaO) produite ?", "a": "Environ 1 tonne de CO2 par tonne de CaO. 68% sont des émissions inévitables (liées à la décarbonatation), 32% évitables (chauffage).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-69", "section": "3. Métaux & transition énergétique", "q": "Pourquoi la chaux (CaO) est-elle essentielle industriellement ?", "a": "Utilisée dans une grande variété d'industries : ciment, acier, chimie, verre, alimentaire, traitement des eaux.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-70", "section": "3. Métaux & transition énergétique", "q": "Quelle est la réaction classique de réduction du minerai de fer (haut fourneau) ?", "a": "2 Fe2O3 + 3 C → 4 Fe + 3 CO2. À haute température (>1450°C).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-71", "section": "3. Métaux & transition énergétique", "q": "Combien de CO2 émet 1 tonne d'acier produite par voie classique ?", "a": "Environ 1,9 tonnes de CO2 par tonne d'acier. Procédé très énergivore.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-72", "section": "3. Métaux & transition énergétique", "q": "Quelle alternative décarbonée existe pour la réduction du fer ?", "a": "Réduction par hydrogène : Fe2O3 + 3 H2 → 2 Fe + 3 H2O. À condition d'utiliser de l'hydrogène vert (électrolyse de l'eau avec électricité renouvelable).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-73", "section": "3. Métaux & transition énergétique", "q": "Quelle est l'énergie nécessaire pour produire 1 t de fer par électrolyse directe ?", "a": "Environ 3,6 MWh/tonne de fer, en utilisant de l'électricité verte.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-74", "section": "3. Métaux & transition énergétique", "q": "Pourquoi le haut fourneau historique a-t-il causé une déforestation massive en Europe ?", "a": "Il utilisait du charbon de bois (charcoal) comme réducteur. Pour produire 1 t de fer, il fallait des m³ de bois → déforestation massive. Buffon (1783) jugeait déjà cela non durable.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-75", "section": "3. Métaux & transition énergétique", "q": "Quelles sont les technologies dominantes en photovoltaïque ?", "a": "Silicium monocristallin (15-25% d'efficacité), polycristallin (12-17%), amorphe (6-8%). Alternatives : CdTe, CIGS, GaAs, pérovskites (MAPI).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-76", "section": "3. Métaux & transition énergétique", "q": "Quelle est l'efficacité quantique typique des cellules photovoltaïques en silicium ?", "a": "12-17% pour le polycristallin, jusqu'à 25% pour le monocristallin (mono-Si).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-77", "section": "3. Métaux & transition énergétique", "q": "Quelle pureté de silicium est nécessaire pour les panneaux solaires ?", "a": "De 6N à 9N, soit 99,999999% (9 fois 9). Nécessite un raffinage extrême.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-78", "section": "3. Métaux & transition énergétique", "q": "Quelle est l'énergie grise du silicium photovoltaïque ?", "a": "> 800 MJ/kg. La production de Si photovoltaïque consomme environ 40 fois plus d'énergie que la production d'acier.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-79", "section": "3. Métaux & transition énergétique", "q": "Quels métaux sont nécessaires pour les panneaux solaires ?", "a": "Si (silicium), Ag (argent), Te (tellure), In (indium), Ga (gallium), Cd (cadmium).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-80", "section": "3. Métaux & transition énergétique", "q": "Quelle est la situation actuelle du recyclage du silicium photovoltaïque ?", "a": "Très peu de Si photovoltaïque est recyclé à ce jour. Filière encore peu développée.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-81", "section": "3. Métaux & transition énergétique", "q": "Qu'est-ce que l'EROI (Energy Return on Energy Invested) ?", "a": "Mesure l'énergie collectée par rapport à l'énergie investie pour produire la technologie. Un EROI élevé signifie un bon retour énergétique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-82", "section": "3. Métaux & transition énergétique", "q": "Quels sont les composants principaux d'une éolienne 2 MW (durée de vie 25 ans) ?", "a": "840 t de béton (base) + 300 t d'acier (mât) + 25 t de composites (pales) + 4 t de cuivre (génératrice) + jusqu'à 400 kg de néodyme (Nd) dans les aimants permanents.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-83", "section": "3. Métaux & transition énergétique", "q": "Quels sont les aimants permanents typiques des éoliennes modernes ?", "a": "Aimants Nd2Fe14B (néodyme-fer-bore). Nécessitent du Nd et du Dy (dysprosium), deux terres rares principalement chinoises.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-84", "section": "3. Métaux & transition énergétique", "q": "Quel composant des éoliennes est aujourd'hui non recyclable ?", "a": "Les pales en composites (fibres de verre/carbone + résine époxy). Trop hétérogènes pour être recyclées efficacement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-85", "section": "3. Métaux & transition énergétique", "q": "Quels métaux sont critiques pour l'éolien ?", "a": "Néodyme (Nd), dysprosium (Dy), cuivre (Cu), acier, composites.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-86", "section": "3. Métaux & transition énergétique", "q": "Quels métaux critiques sont nécessaires aux batteries ?", "a": "Lithium (Li), cobalt (Co), nickel (Ni), cuivre (Cu).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-87", "section": "3. Métaux & transition énergétique", "q": "Quel est le 'coût matière' du cuivre en termes de résidus miniers ?", "a": "1 tonne de cuivre génère jusqu'à 250 tonnes de résidus miniers (tailings). Teneur typique du minerai < 0,5%.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-88", "section": "3. Métaux & transition énergétique", "q": "Combien de cuivre extrait-on par an et combien de minerai est nécessaire ?", "a": "22-26 Mt/an de cuivre extrait. Nécessite environ 5,5 Gt de minerai (teneur moyenne très faible, < 0,5%).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-89", "section": "3. Métaux & transition énergétique", "q": "Quelles quantités de cuivre par usage retrouve-t-on dans nos sociétés ?", "a": "Approximativement : 4 t pour l'électronique, 1 t en câbles, 1,4 t dans les transformateurs (par usage type/secteur).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-90", "section": "3. Métaux & transition énergétique", "q": "Quelles sont les centrales solaires belges ou européennes citées en exemple ?", "a": "Centrale Meuse (France) : 152 MWp, 364 000 modules photovoltaïques. Le scénario SDS de l'Accord de Paris prévoit 1400 t de tellure à produire d'ici 2040 (contre 400 t/an actuellement).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-91", "section": "3. Métaux & transition énergétique", "q": "Combien de foyers une éolienne offshore peut-elle alimenter ?", "a": "Par exemple, le parc Norther (Belgique) alimente environ 400 000 foyers.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-92", "section": "3. Métaux & transition énergétique", "q": "Quel est le paradoxe central des énergies renouvelables ?", "a": "Elles réduisent les émissions à l'usage, MAIS exigent beaucoup plus d'extraction et de traitement de métaux. La transition crée de nouvelles dépendances géopolitiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-93", "section": "3. Métaux & transition énergétique", "q": "Donne un exemple chiffré du coût matière de la transition.", "a": "Pour 1 t de cuivre (essentiel à l'électrification), on génère jusqu'à 250 t de résidus miniers. Multiplié par l'explosion de la demande, cela crée d'énormes impacts.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-94", "section": "3. Métaux & transition énergétique", "q": "Comment passe-t-on d'une dépendance au pétrole à une 'addiction' aux métaux ?", "a": "La transition énergétique remplace les hydrocarbures par des technologies électrifiées intensives en métaux (batteries, moteurs, câbles, panneaux). On change de dépendance, pas on s'en libère.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-95", "section": "4. Géopolitique des ressources", "q": "Quelle est la population mondiale actuelle utilisée comme référence dans le cours ?", "a": "Environ 7,3 milliards d'habitants. Pression croissante sur les ressources non renouvelables (métaux et minéraux).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-96", "section": "4. Géopolitique des ressources", "q": "Pourquoi dit-on que 'ressource = pouvoir' ?", "a": "Les pays détenteurs de métaux critiques peuvent influencer l'économie mondiale et imposer leurs standards (économiques, environnementaux) à leurs partenaires commerciaux.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-97", "section": "4. Géopolitique des ressources", "q": "Que consomme et que produit l'UE en métaux ?", "a": "L'UE consomme environ 20% des métaux extraits mondialement, mais en produit moins de 5%. Forte dépendance aux importations.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-98", "section": "4. Géopolitique des ressources", "q": "Que s'est-il passé en 2009 concernant les terres rares ?", "a": "La Chine a brutalement limité ses exportations de terres rares, révélant la vulnérabilité européenne et déclenchant une prise de conscience mondiale.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-99", "section": "4. Géopolitique des ressources", "q": "Pourquoi l'UE a-t-elle fermé certains de ses propres gisements ?", "a": "Pour des raisons d'anomalies radioactives ou de normes environnementales strictes (ex: Norvège, Suède). Résultat : les métaux sont extraits et transformés ailleurs (souvent en Chine), déplaçant les impacts.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-100", "section": "4. Géopolitique des ressources", "q": "Quelle proportion du cuivre mondial vient du Chili et du Pérou ?", "a": "Environ 40% du cuivre mondial. Mais il est ensuite raffiné à plus de 80% en Chine.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-101", "section": "4. Géopolitique des ressources", "q": "Quels sont les 4 piliers d'une société moderne selon Pirard ?", "a": "Ciment, acier, plastique et engrais. Tous nécessitent de grandes quantités de matières premières et émettent beaucoup de CO2.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-102", "section": "4. Géopolitique des ressources", "q": "Quels sont les pays fondateurs des BRICS et leurs nouveaux membres ?", "a": "BRICS : Brésil, Russie, Inde, Chine, Afrique du Sud. BRICS+ : ajout récent de l'Iran, l'Arabie Saoudite et d'autres.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-103", "section": "4. Géopolitique des ressources", "q": "Qu'envisagent les BRICS+ en matière monétaire ?", "a": "Création d'une monnaie alternative au dollar, appelée 'UNIT'. Indexée non sur une banque centrale mais sur des paniers de ressources naturelles (pétrole, or, métaux rares).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-104", "section": "4. Géopolitique des ressources", "q": "Quels seraient les effets potentiels d'une monnaie BRICS+ indexée sur les ressources ?", "a": "1) Renforcer leur indépendance financière vis-à-vis de l'Occident. 2) Reconfigurer les chaînes d'approvisionnement globales. 3) Rendre l'accès aux ressources plus géopolitiquement instable.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-105", "section": "4. Géopolitique des ressources", "q": "Que signifie NIMCO ?", "a": "Not In My Continent. Illustre la dépendance de l'Europe vis-à-vis des ressources critiques extraites/transformées ailleurs (surtout en Chine). On veut consommer sans extraire chez nous.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-106", "section": "4. Géopolitique des ressources", "q": "Que dit le rapport Draghi de septembre 2024 ?", "a": "Il souligne les vulnérabilités industrielles européennes : dépendance à un nombre limité de fournisseurs (surtout la Chine) pour les matières premières critiques, alors que la demande explose avec la transition énergétique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-107", "section": "4. Géopolitique des ressources", "q": "Qu'est-ce que le 'nationalisme des ressources' ?", "a": "Stratégie où les pays riches en ressources nationalisent les mines, modifient leurs régimes miniers ou manipulent les prix pour exercer un levier politique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-108", "section": "4. Géopolitique des ressources", "q": "Donne des exemples récents de nationalisme des ressources.", "a": "Mexique : nationalisation du lithium. Chine : restrictions à l'exportation de terres rares (2009, 2023), gallium/germanium (2023), antimoine (2024), tellure/bismuth/tungstène (2025).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-109", "section": "4. Géopolitique des ressources", "q": "Qu'est-ce que la CECA ?", "a": "Communauté Européenne du Charbon et de l'Acier. Créée après la 2GM (1951). A intégré les industries du charbon et de l'acier en Europe. C'est la base de l'UE et de l'Euro.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-110", "section": "4. Géopolitique des ressources", "q": "Quels sont des exemples de zones de conflits liées aux ressources ?", "a": "Cachemire, Sahara Occidental, certaines régions d'Afrique centrale. Les zones riches en ressources sont des points de tension géopolitique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-111", "section": "4. Géopolitique des ressources", "q": "Pourquoi les USA dépendent-ils fortement des importations de métaux ?", "a": "Pour des raisons similaires à l'UE : normes environnementales, désindustrialisation, externalisation. Cela pousse à former de nouvelles alliances (cf. friend-shoring).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-112", "section": "4. Géopolitique des ressources", "q": "Quels sont les taux moyens de recyclage des grands métaux en Europe ?", "a": "Acier : 55%. Aluminium : 45%. Cuivre : ~50%. Métaux spécialisés (terres rares, indium...) : souvent <1%.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-113", "section": "4. Géopolitique des ressources", "q": "Quelle est la durée moyenne pour ouvrir une mine aux États-Unis ?", "a": "Environ 29 ans (permis + construction). Au monde entier : 10-20 ans avant de produire.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-114", "section": "4. Géopolitique des ressources", "q": "Pourquoi la longueur des procédures minières est-elle un problème pour la transition ?", "a": "La demande en métaux pour la transition explose maintenant, mais les nouvelles mines mettent 10-29 ans à entrer en production. Décalage temporel énorme.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-115", "section": "4. Géopolitique des ressources", "q": "Quels sont les 3 leviers pour répondre à la demande future en métaux ?", "a": "1) Augmenter l'extraction primaire. 2) Améliorer le recyclage. 3) Réduire la consommation. Aucun seul ne suffit, il faut les actionner ensemble.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-116", "section": "4. Géopolitique des ressources", "q": "Pourquoi le recyclage seul ne peut-il pas couvrir la demande future ?", "a": "1) Collecte incomplète. 2) Procédés de faible qualité. 3) Pertes transfrontalières. 4) Pertes dissipatives (corrosion, usure, miniaturisation). 5) Limites thermodynamiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-117", "section": "4. Géopolitique des ressources", "q": "Quelles sont les prévisions sur le cuivre et le lithium ?", "a": "Les projections de production (projets existants + annoncés) ne suffiront PAS à répondre à la demande, même dans le scénario optimiste de neutralité carbone en 2050.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-118", "section": "4. Géopolitique des ressources", "q": "Qu'est-ce que le Global Resources Outlook 2024 ?", "a": "Rapport international qui suit l'évolution de l'utilisation des ressources matérielles mondiales (matériaux de construction, minerais métalliques, combustibles fossiles, biomasse).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-119", "section": "5. Criticité", "q": "Quels sont les 2 facteurs combinés qui rendent un métal 'critique' ?", "a": "1) Importance économique élevée (essentiel au fonctionnement de secteurs clés). 2) Risque d'approvisionnement élevé (production concentrée, instabilité politique, faible recyclage, coproduction difficile).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-120", "section": "5. Criticité", "q": "Pourquoi la criticité d'un métal est-elle évolutive ?", "a": "Elle dépend des usages émergents (ex: batteries → Li devient critique), des tensions commerciales (taxes, embargos) et de la vulnérabilité des chaînes d'approvisionnement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-121", "section": "5. Criticité", "q": "Quelle est la formule de l'Importance Économique (EI) selon l'UE ?", "a": "EI = (10/Qmax) × Σ (As × Qs × SIei). As = part du métal dans le secteur s, Qs = VAB du secteur s, Qmax = plus grande VAB, SIei = indice de substituabilité.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-122", "section": "5. Criticité", "q": "Que mesure le HHI dans l'analyse de criticité ?", "a": "Herfindahl-Hirschman Index : mesure la concentration géographique de la production d'un métal. Pondéré par un indice de gouvernance (WGI) des pays producteurs.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-123", "section": "5. Criticité", "q": "Pourquoi l'or n'est-il pas considéré comme critique malgré sa rareté ?", "a": "Bien que rare, il n'est pas indispensable au fonctionnement des systèmes économiques essentiels. Il a surtout un rôle financier et symbolique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-124", "section": "5. Criticité", "q": "Quelle est la différence entre métal CRITIQUE et métal STRATÉGIQUE ?", "a": "Critique = haute importance économique + haut risque d'approvisionnement (ex: terres rares). Stratégique = indispensable à la transition énergétique, même si l'approvisionnement est sûr (ex: cuivre).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-125", "section": "5. Criticité", "q": "Combien d'éléments composent les terres rares (REE) ?", "a": "17 éléments situés sur la dernière ligne du tableau périodique (lanthanides + Y + Sc).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-126", "section": "5. Criticité", "q": "Les terres rares sont-elles vraiment 'rares' ?", "a": "Non. Elles ne sont pas particulièrement rares dans la croûte, mais elles sont TRÈS DISPERSÉES et chimiquement très difficiles à séparer entre elles. Cela rend l'extraction coûteuse.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-127", "section": "5. Criticité", "q": "Quelle part de la production mondiale de terres rares la Chine contrôle-t-elle ?", "a": "Plus de 80% de la production mondiale. Quasi-monopole, ce qui en fait un fort levier géopolitique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-128", "section": "5. Criticité", "q": "Cite quelques autres métaux critiques selon l'UE.", "a": "Antimoine, tellure, gallium, tungstène (technologies de pointe). Germanium (coproduit du charbon/zinc, fibre optique). Niobium (un seul gisement majeur au Brésil, aciers haute performance).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-129", "section": "5. Criticité", "q": "Qu'est-ce que le Critical Raw Materials Act (UE, 2024) ?", "a": "Politique européenne visant à sécuriser l'approvisionnement en matières premières critiques. Liste de plus de 30 éléments classés critiques ET/OU stratégiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-130", "section": "5. Criticité", "q": "Quels objectifs chiffrés vise le Critical Raw Materials Act ?", "a": "Augmenter l'extraction européenne, transformer plus en Europe, augmenter le taux de recyclage, diversifier les fournisseurs. Réduire la dépendance à un seul pays (Chine principalement).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-131", "section": "5. Criticité", "q": "Quelles solutions existent pour réduire la criticité d'un métal ?", "a": "1) Explorer pour découvrir de nouvelles sources. 2) Technologies de substitution (remplacer par un métal plus abondant). 3) Améliorer le recyclage. 4) Politiques industrielles et législatives (Critical Raw Materials Act).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-132", "section": "5. Criticité", "q": "Qu'est-ce que le modèle ROC (Ressource, Objet, Composant) ?", "a": "Grille d'analyse systémique des flux de matériaux et d'énergie en économie circulaire. Évalue un matériau (ressource), ses usages (objet) et ses intégrations (composants), notamment dans le bâtiment.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-133", "section": "6. Économie circulaire & ressources", "q": "Quelle est la définition de l'économie circulaire (citation Pirard) ?", "a": "L'art d'administrer un 'assez' par une gestion prudente et sage, afin d'obtenir le meilleur retour en utilisant le moins de ressources possibles.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-134", "section": "6. Économie circulaire & ressources", "q": "Quelle est l'origine étymologique commune entre économie et écologie ?", "a": "Le grec 'oikos' = la maison. Économie = gérer les ressources de la maison. Écologie = comprendre le fonctionnement des systèmes naturels. L'économie circulaire fait le pont.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-135", "section": "6. Économie circulaire & ressources", "q": "Quelles sont les 3 sphères de la 'Spherical Economy' ?", "a": "1) Géosphère (minerais, roches, fossiles, eaux profondes). 2) Biosphère (ressources vivantes : forêts, sols, faune, flore). 3) Anthroposphère (objets fabriqués par l'humain — stock pour urban mining).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-136", "section": "6. Économie circulaire & ressources", "q": "Que comprend la biosphère ?", "a": "Tous les êtres vivants. C'est la sphère qui nous nourrit et nous entoure biologiquement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-137", "section": "6. Économie circulaire & ressources", "q": "Que comprend la géosphère ?", "a": "Les roches sous nos pieds, tous les matériaux non vivants qui ne poussent pas. Base de notre approvisionnement en minéraux et métaux.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-138", "section": "6. Économie circulaire & ressources", "q": "Que comprend l'atmosphère ?", "a": "Enveloppe gazeuse qui entoure la Terre. Source d'oxygène et régulatrice du climat.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-139", "section": "6. Économie circulaire & ressources", "q": "Pourquoi est-il frappant que les ODD (SDG) ne mentionnent presque jamais les métaux ?", "a": "Les Objectifs de Développement Durable comptent des milliers de pages, mais ils omettent presque totalement les métaux et minéraux, alors qu'ils sont essentiels à la transition énergétique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-140", "section": "6. Économie circulaire & ressources", "q": "Quel est l'élément le plus abondant à l'échelle de la Terre ?", "a": "Le fer (Fe), surtout dans le noyau terrestre.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-141", "section": "6. Économie circulaire & ressources", "q": "Quelle est la répartition entre croûte océanique et croûte continentale ?", "a": "Croûte océanique : 60% de la surface terrestre. Croûte continentale : 40%.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-142", "section": "6. Économie circulaire & ressources", "q": "À quelle profondeur typique se trouvent les gisements exploitables ?", "a": "La plupart à moins de 300 m de profondeur, bien que des explorations plus profondes existent (jusqu'à ~5 km en théorie).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-143", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un minéral ?", "a": "Élément ou composé chimique, généralement cristallin, formé par des processus géologiques (ex: quartz, pyrite, calcite).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-144", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'une roche ?", "a": "Assemblage naturel de minéraux (ex: granite, basalte, calcaire).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-145", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un minerai (ore) ?", "a": "Roche contenant une quantité suffisante de minéraux valorisables pour être exploitée de manière économiquement rentable. Définition évolutive selon les prix du marché, technos, coûts énergétiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-146", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que la gangue ?", "a": "Partie inutile du minerai. Constitue un déchet (tailings) lors de l'extraction.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-147", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement (deposit) ?", "a": "Site géologique contenant une quantité et une qualité suffisantes de minerai pour justifier une exploitation économique.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-148", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que le 'cut-off grade' (teneur de coupure) ?", "a": "Teneur minimale d'un métal dans une roche pour que l'exploitation soit économiquement viable. Évolue avec le marché, les technos d'extraction et les coûts énergétiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-149", "section": "6. Économie circulaire & ressources", "q": "Donne des exemples de concentration moyenne d'éléments dans la croûte.", "a": "Fer : ~4% (40 000 ppm). Cuivre : 40 ppm. Or : ~1 ppb (1 milliardième). Plus la concentration moyenne est faible, plus l'exploitation est énergivore.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-150", "section": "6. Économie circulaire & ressources", "q": "Quelle est la teneur typique d'un minerai de fer ?", "a": "Environ 58% (580‰) de fer. Très enrichi par rapport à la croûte moyenne (4%).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-151", "section": "6. Économie circulaire & ressources", "q": "Quelle est la teneur typique d'un minerai d'or ?", "a": "Environ 0,0001% (1 gramme par tonne, soit 1 ppm). Énormément de roche à traiter pour récupérer peu d'or.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-152", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que les RESSOURCES ULTIMES ?", "a": "Quantité totale d'un métal présente dans la portion exploitable de la croûte terrestre (environ 5 km de profondeur). C'est le potentiel théorique maximal.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-153", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que les RESSOURCES GLOBALES ?", "a": "Quantité totale de minerai identifiée par l'exploration géologique, avec des niveaux de confiance variables. Ce qu'on peut raisonnablement aller extraire.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-154", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que les RÉSERVES ?", "a": "Sous-ensemble des ressources ayant fait l'objet d'études de faisabilité complètes et exploitables dans un cadre économique actuel. Ce qui pourrait être exploité demain.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-155", "section": "6. Économie circulaire & ressources", "q": "Donne un exemple chiffré illustrant ressources ultimes vs réserves (zinc).", "a": "Ressources ultimes Zn : ~198 Tt à 9 km. Ressources globales extractibles : 25-66 Gt à 5 km. Ressources identifiées : 633 Mt (Mudd 2017). Réserves : 250 Mt (USGS 2021). Réserves actuelles : 13 Mt (USGS 2021).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-156", "section": "6. Économie circulaire & ressources", "q": "Quelles sont les 4 étapes du cycle de vie d'un projet minier ?", "a": "1) Exploration. 2) Développement (études techniques, économiques, environnementales — jusqu'à 10 ans). 3) Extraction. 4) Restauration (réhabilitation du site).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-157", "section": "6. Économie circulaire & ressources", "q": "Combien d'années peut durer la phase de développement d'une mine ?", "a": "Jusqu'à 10 ans rien que pour les études techniques, économiques et environnementales avant le début de l'extraction.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-158", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M1 (magmatique) et quel métal y trouve-t-on ?", "a": "Formé par cristallisation fractionnée dans des intrusions mafiques/ultramafiques. Couches riches en chromite (Cr) dans les complexes stratifiés.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-159", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M2 (lié au granite) et quels métaux y trouve-t-on ?", "a": "Métaux concentrés dans les dernières phases de cristallisation des granites riches en fluides hydrothermaux. Souvent en veines de quartz. Métaux : Tungstène (W), Étain (Sn).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-160", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M3 (hydrothermal volcanique) et quels métaux y trouve-t-on ?", "a": "Formé autour de systèmes volcaniques actifs ou fossiles : porphyres cuprifères et VMS (Volcanogenic Massive Sulphide). Métal principal : Cuivre (Cu).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-161", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M4 (saumures profondes) et quels métaux y trouve-t-on ?", "a": "Métaux précipités à partir de fluides salins (saumures chaudes) dans des bassins sédimentaires profonds ou contextes de rift. Métaux : Plomb (Pb), Zinc (Zn).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-162", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M5 (eaux de surface) et quel métal y trouve-t-on ?", "a": "Formations ferrifères rubanées (BIFs - Banded Iron Formations) ou précipitation directe à partir d'eaux riches en oxygène. Dépôts anciens lacustres/marins. Métal : Fer (Fe).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-163", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M6 (sédimentaire) et quels métaux y trouve-t-on ?", "a": "Concentration de minéraux lourds par gravité ou diagénèse en milieux marins peu profonds/lacustres (plages, rivières). Métaux : Titane (Ti), Zinc (Zn). Ex : sphalérite type Mississippi Valley.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-164", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce qu'un gisement M7 (altération tropicale) et quels métaux y trouve-t-on ?", "a": "Altération intense de roches en climat tropical humide (latérites). Aluminium concentré sous forme de bauxite. Métaux : Aluminium (Al), Gallium (Ga).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-165", "section": "6. Économie circulaire & ressources", "q": "Qu'est-ce que l'urban mining ?", "a": "Extraction des métaux à partir des produits usagés circulant dans nos villes (déchets électroniques, voitures, infrastructures). Concept central de l'économie circulaire.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-166", "section": "7. Lifecycle Thinking & circularité", "q": "Pourquoi la circularité parfaite est-elle physiquement impossible ?", "a": "Même avec un rendement de 95% par opération de recyclage, après 4 opérations on ne récupère plus que 81%. Après 3 cycles complets, environ 54%. Pertes inévitables à chaque cycle.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-167", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que les 2 boucles du 'papillon circulaire' (Ellen MacArthur) ?", "a": "1) Cycle technique : fabrication, usage, maintenance, reconditionnement, recyclage. 2) Cycle biologique : compostage, biodégradation, retour à la nature.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-168", "section": "7. Lifecycle Thinking & circularité", "q": "Quels sont les 4 leviers de circularité (Feed/Redesign/Slow down/Close the loop) ?", "a": "1) Feed the loop : recycler les matières secondaires. 2) Redesign the loop : concevoir réparable/recyclable. 3) Slow down the loop : ralentir l'obsolescence. 4) Close the loop : améliorer tri/traitement/réintégration.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-169", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que la logique S-A-M ?", "a": "Slow the loop (allonger la durée de vie des objets). Alter the loop (repenser la conception, réduire la complexité). Make the loop circular (boucle fermée par tri, collecte, réintégration).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-170", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que l'overburden ?", "a": "Roches stériles déplacées pour accéder au minerai mais non utilisées. Type de déchet minier en surface.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-171", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que les tailings ?", "a": "Résidus miniers issus du traitement du minerai (broyage, flottation). Souvent toxiques (sulfures, métaux lourds). Stockés dans de grands bassins.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-172", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que le NEW SCRAP ?", "a": "Déchets de production industrielle : chutes, copeaux, rebuts AVANT utilisation par le consommateur. Plus facile à collecter et recycler.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-173", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que le OLD SCRAP ?", "a": "Déchets en fin de vie : objets usés ou obsolètes APRÈS utilisation par le consommateur. Plus difficile à collecter et recycler (dispersion).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-174", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que la 'dissipative use' (usage dissipatif) ?", "a": "Matériaux dispersés et non récupérables après usage : ex. additifs dans les peintures, métaux dans les engrais, anti-corrosion. Une fois utilisés, on ne peut plus les rassembler.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-175", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que le 'hoarding' (thésaurisation) ?", "a": "Accumulation d'objets inutilisés mais non jetés : ex. smartphones gardés dans les tiroirs. Empêche la matière de revenir dans le cycle de recyclage.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-176", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que le 'stewardship material' ?", "a": "Gouvernance sur le devenir des matières extraites — qui en est responsable tout au long du cycle de vie. Notion de responsabilité étendue.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-177", "section": "7. Lifecycle Thinking & circularité", "q": "Quelle est la hiérarchie de la gestion des déchets (pyramide européenne) ?", "a": "Prévenir > Réutiliser > Recycler > Valoriser énergétiquement > Éliminer. Cette pyramide oriente toutes les politiques publiques.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-178", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que la sobriété, premier levier d'impact ?", "a": "Réduire à la source. Repose sur : design durable (objets robustes/réparables), droit à la réparation (directive UE), usages partagés (leasing, économie de la fonctionnalité).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-179", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'apporte la réutilisation par rapport au recyclage ?", "a": "La réutilisation évite TOUTE dépense énergétique liée à la refabrication. C'est donc beaucoup plus efficace que le recyclage. Nécessite l'accès aux pièces détachées et des Repair Cafés.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-180", "section": "7. Lifecycle Thinking & circularité", "q": "Qu'est-ce que le 'droit à la réparation' ?", "a": "Directive européenne en cours visant à obliger les fabricants à rendre leurs produits plus réparables (pièces détachées disponibles, documentation, accès aux composants).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-181", "section": "7. Lifecycle Thinking & circularité", "q": "Quelles technologies sont citées pour le tri avancé des matériaux ?", "a": "Capteurs LIBS (Laser-Induced Breakdown Spectroscopy), rayons X, tri multi-capteurs, tri robotisé. Centre de recherche cité : GeMMe (ULiège).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-182", "section": "8. Recyclage", "q": "Quelle est la définition rigoureuse du recyclage ?", "a": "Processus par lequel un produit en fin de vie permet de récupérer des matériaux pouvant réintégrer la chaîne de valeur sous forme de matières premières secondaires.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-183", "section": "8. Recyclage", "q": "Le recyclage signifie-t-il un retour direct à l'usage initial ?", "a": "Non. Les matériaux sont souvent réintégrés loin en amont dans le cycle de production (refonte, purification, reformulation), pas nécessairement pour le même produit.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-184", "section": "8. Recyclage", "q": "Qu'appelle-t-on 'matières premières secondaires' ?", "a": "Matériaux obtenus à partir du recyclage, qui réintègrent le cycle de production en remplacement de matières premières vierges (primaires).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-185", "section": "8. Recyclage", "q": "Qu'est-ce que le recyclage FONCTIONNEL ?", "a": "Le matériau récupéré est réutilisé pour le MÊME usage, sans perte significative de propriétés. Exemple : canette d'aluminium → nouvelle canette.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-186", "section": "8. Recyclage", "q": "Qu'est-ce que le recyclage NON FONCTIONNEL ?", "a": "Le matériau récupéré est utilisé pour un autre usage que celui d'origine, avec une dégradation. Exemple : brique cassée → matériau de remplissage pour terrain de tennis.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-187", "section": "8. Recyclage", "q": "Qu'est-ce que le DOWNCYCLING ?", "a": "Forme de recyclage avec PERTE de qualité. Exemple : acier inoxydable → acier de construction ordinaire. Le matériau recyclé ne peut plus rivaliser avec la matière vierge.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-188", "section": "8. Recyclage", "q": "Qu'est-ce que l'UPCYCLING ?", "a": "Valorisation avec AMÉLIORATION du matériau ou création d'un produit de plus grande valeur. Exemple : briques anciennes réutilisées en design architectural. Encore peu fréquent.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-189", "section": "8. Recyclage", "q": "Quels sont les 2 indicateurs clés du recyclage en Europe ?", "a": "EOL-RIR (End-of-Life Recycling Input Rate) et EOL-RR (End-of-Life Recycling Rate). Ils mesurent des choses différentes.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-190", "section": "8. Recyclage", "q": "Définis précisément l'EOL-RIR.", "a": "End-of-Life Recycling Input Rate. Pourcentage de matières premières SECONDAIRES (recyclage en fin de vie) dans la production totale d'un métal. = flux production secondaire (UE) / (flux importés + flux production primaire UE).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-191", "section": "8. Recyclage", "q": "Définis précisément l'EOL-RR.", "a": "End-of-Life Recycling Rate. Pourcentage du matériau effectivement COLLECTÉ pour recyclage parmi tout celui disponible en fin de vie. = volume scrap collecté/recyclé / volume total scrap disponible à la collecte.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-192", "section": "8. Recyclage", "q": "Pourquoi les indicateurs EOL-RIR et EOL-RR sont-ils délicats à interpréter ?", "a": "Ils sont encore en développement. Leur interprétation dépend fortement du périmètre géographique, temporel et sectoriel retenu. Comparer deux pays nécessite la même méthodologie.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-193", "section": "8. Recyclage", "q": "Quel est l'EOL-RR du zinc en Chine vs en Europe ?", "a": "Chine : 16%. Europe : 57%. L'écart est dû à des systèmes de collecte et de traitement bien plus développés en Europe.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-194", "section": "8. Recyclage", "q": "Quels principes guident le 'design pour la circularité' ?", "a": "Durabilité (objets robustes, simples, intemporels), maintenance (accès aux composants, documentation), démontage (éviter colles/soudures permanentes), recyclage (limiter les mélanges non séparables).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-195", "section": "9. Voiture & mine urbaine", "q": "Qu'appelle-t-on la 'mine urbaine' ?", "a": "Accumulation de matériaux présents dans les déchets urbains et les produits jetés. La voiture en fin de vie en fait partie : réserve précieuse de métaux récupérables.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-196", "section": "9. Voiture & mine urbaine", "q": "Quelles sont les 3 directives européennes principales sur le recyclage ?", "a": "1) BATTERIES : > 65% recyclage en poids (90%+ pour Co, Cu, Ni). 2) ÉQUIPEMENTS ÉLECTRONIQUES (WEEE) : objectifs variables. 3) VHU (véhicules hors d'usage) : 95% de recyclage du poids total.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-197", "section": "9. Voiture & mine urbaine", "q": "Quel est l'objectif de recyclage pour les véhicules hors d'usage (VHU) ?", "a": "95% du poids total du véhicule doit être recyclé (directive ELV - End of Life Vehicles).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-198", "section": "9. Voiture & mine urbaine", "q": "Quel est l'objectif de recyclage pour les batteries selon la directive UE ?", "a": "Plus de 65% du poids total recyclé. Avec un objectif spécifique de récupération de matières premières critiques : 90%+ pour Co (cobalt), Cu (cuivre), Ni (nickel).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-199", "section": "9. Voiture & mine urbaine", "q": "Qu'est-ce que la REP / EPR ?", "a": "Responsabilité Élargie du Producteur (Extended Producer Responsibility). Le producteur est responsable de la fin de vie du produit. Mise en œuvre via Bebat (batteries), Recupel (électronique)... Taxe payée à l'achat.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-200", "section": "9. Voiture & mine urbaine", "q": "Quelle est la différence entre 'gisement' et 'flux collecté' pour les VHU ?", "a": "Gisement = ensemble des matériaux théoriquement disponibles. Flux collecté = partie effectivement récupérée pour recyclage.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-201", "section": "9. Voiture & mine urbaine", "q": "Quelle proportion des VHU est actuellement effectivement collectée ?", "a": "Seulement environ 10% des véhicules hors d'usage théoriques. Le reste disparaît (export informel, abandon, marché parallèle).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-202", "section": "9. Voiture & mine urbaine", "q": "Quels sont les types de batteries présentes dans les voitures (thermiques, hybrides, électriques) ?", "a": "TOUS les types de véhicules (thermiques, hybrides, électriques) comportent une batterie au plomb. Les hybrides/électriques ont en plus des batteries Li-ion.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-203", "section": "9. Voiture & mine urbaine", "q": "Comment allège-t-on les véhicules thermiques modernes ?", "a": "Remplacement de l'acier par des alliages d'aluminium. MAIS ces alliages sont plus difficiles à recycler que l'acier (problèmes de mélanges/contaminations).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-204", "section": "9. Voiture & mine urbaine", "q": "Quelles matières premières critiques sont contenues dans les voitures hybrides et électriques ?", "a": "Lithium (Li), cuivre (Cu), cobalt (Co), nickel (Ni), terres rares (Nd, Dy pour les moteurs), et autres.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-205", "section": "9. Voiture & mine urbaine", "q": "Quelles sont les 4 grandes étapes du traitement d'une voiture en fin de vie ?", "a": "1) Dépollution. 2) Démantèlement. 3) Broyage (shredding). 4) Post-shredding treatment (séparation magnétique, courants de Foucault, flottation, tri densimétrique).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-206", "section": "9. Voiture & mine urbaine", "q": "Que comprend l'étape de DÉPOLLUTION d'une voiture ?", "a": "Retrait des matériaux dangereux (obligation légale) : liquides (huile, frigorigènes), batteries et accumulateurs, pneus (filière spécifique), airbags.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-207", "section": "9. Voiture & min
