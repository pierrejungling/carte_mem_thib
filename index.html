e urbaine", "q": "Que comprend l'étape de DÉMANTÈLEMENT d'une voiture ?", "a": "Récupération des composants à VALEUR MARCHANDE : pièces de seconde main, composants à forte valeur (électronique, pots catalytiques avec Pt/Pd/Rh, compresseurs au cuivre), composants problématiques pour la suite (câbles électriques).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-208", "section": "9. Voiture & mine urbaine", "q": "Pourquoi le démantèlement manuel reste-t-il économiquement intéressant ?", "a": "Les cartes mères d'ordinateur peuvent contenir 90 g/t d'or vs 4 g/t après broyage mélangé. La séparation manuelle préserve une valeur intrinsèque énorme.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-209", "section": "9. Voiture & mine urbaine", "q": "Que se passe-t-il pendant le broyage (shredding) d'un véhicule ?", "a": "Le broyeur est équipé d'un courant d'air qui sépare une fraction LÉGÈRE (LASR : Light Automotive Shredder Residue — plastiques, textiles, mousses, fils de cuivre) et une fraction LOURDE (métaux ferreux/non-ferreux, plastiques, verre, caoutchouc).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-210", "section": "9. Voiture & mine urbaine", "q": "Que signifie ASR et quelle proportion représente-t-il ?", "a": "Automotive Shredder Residue. Représente environ 23% du véhicule dépollué (les 77% restants étant la fraction ferreuse principale).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-211", "section": "9. Voiture & mine urbaine", "q": "Comment fonctionne la séparation par courants de Foucault (Eddy current) ?", "a": "Champ magnétique dynamique généré par un rotor magnétique à haute vitesse. Des courants induits dans les métaux conducteurs non ferreux (Al, Cu) créent un champ opposé qui les REPOUSSE. Les non-conducteurs (plastiques) tombent par gravité.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-212", "section": "9. Voiture & mine urbaine", "q": "Quelles techniques de séparation sont appliquées à l'ASR ?", "a": "Séparation magnétique, classification granulométrique, courants de Foucault, séparations gravimétriques (tables vibrantes, spirales), milieu dense, tri par capteurs (sensor-based), flottation.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-213", "section": "9. Voiture & mine urbaine", "q": "Qu'est-ce que le ZORBA ?", "a": "Résidus non ferreux issus du broyage automobile (mélange Al, Cu, Zn, laiton, PCBs...). Triés avec des capteurs de couleur, rayons X (XRT), reconnaissance de formes 3D, LIBS.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-214", "section": "9. Voiture & mine urbaine", "q": "Quel exemple de tri robotisé est cité à l'ULiège ?", "a": "Le projet Pick-It au centre GeMMe (ULiège). Tri robotisé de ZORBA avec bras robotiques ou éjection pneumatique, basé sur des capteurs multiples (couleur, 3D, X-Ray, LIBS).", "chapter": "Partie 1 — Pirard"}, {"id": "p1-215", "section": "9. Voiture & mine urbaine", "q": "Comment se calcule le TAUX DE RECYCLAGE GLOBAL d'une voiture ?", "a": "En multipliant les rendements de chaque étape du processus (collecte × dépollution × démantèlement × broyage × tri post-broyage). Chaque maillon faible réduit le total.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-216", "section": "9. Voiture & mine urbaine", "q": "Pourquoi est-ce un problème que le poids des voitures augmente ?", "a": "Plus de matériaux extraits par véhicule, plus de matériaux à recycler en fin de vie, plus d'énergie pour la fabrication et l'usage. Effet rebond de la sécurité et de l'électrification.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-217", "section": "9. Voiture & mine urbaine", "q": "Quelles sont les valeurs récupérables dans les pots catalytiques automobiles ?", "a": "Métaux du groupe du platine : platine (Pt), palladium (Pd), rhodium (Rh). Très précieux et systématiquement récupérés lors du démantèlement.", "chapter": "Partie 1 — Pirard"}, {"id": "p1-218", "section": "9. Voiture & mine urbaine", "q": "Pourquoi enlever les câbles électriques avant le broyage ?", "a": "Ils créent des problèmes en aval du broyage (enchevêtrements, qualité du tri, contamination). Mieux vaut les retirer manuellement pour préserver la qualité du flux.", "chapter": "Partie 1 — Pirard"}, {"id": "p2-1", "section": "1. Contexte (Léonard)", "q": "Combien d'Objectifs de Développement Durable (ODD) l'ONU a-t-elle adoptés et pour quelle échéance ?", "a": "17 ODD à atteindre d'ici 2030. Ils couvrent les enjeux sociaux, environnementaux et économiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-2", "section": "1. Contexte (Léonard)", "q": "Quel est l'objectif principal du European Green Deal ?", "a": "Faire de l'Europe le premier continent climatiquement neutre d'ici 2050 (zéro émission nette de gaz à effet de serre).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-3", "section": "1. Contexte (Léonard)", "q": "Cite 2 objectifs concrets du European Green Deal pour l'industrie.", "a": "1) Mobiliser l'industrie vers une économie circulaire et plus propre. 2) Atteindre zéro émission nette de GES.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-4", "section": "1. Contexte (Léonard)", "q": "Que fait la directive EPBD ?", "a": "Energy Performance of Buildings Directive. Impose le calcul du GWP (Global Warming Potential) sur tout le cycle de vie d'un bâtiment. Obligation de certificat de performance énergétique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-5", "section": "1. Contexte (Léonard)", "q": "Que doivent publier les États membres dans le cadre de l'EPBD ?", "a": "Une feuille de route (roadmap) pour atteindre les objectifs de performance énergétique des bâtiments.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-6", "section": "1. Contexte (Léonard)", "q": "Qu'est-ce que TOTEM ?", "a": "Outil belge qui évalue l'impact environnemental des matériaux de construction. Acronyme : Tool to Optimise the Total Environmental impact of Materials.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-7", "section": "1. Contexte (Léonard)", "q": "Que vaut 1 kg de CH4 en kg CO2-éq selon le GWP-100 ?", "a": "29,8 kg CO2-éq.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-8", "section": "1. Contexte (Léonard)", "q": "Que vaut 1 kg de N2O en kg CO2-éq selon le GWP-100 ?", "a": "273 kg CO2-éq.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-9", "section": "1. Contexte (Léonard)", "q": "Que signifie GWP-100 ?", "a": "Global Warming Potential sur 100 ans. Facteur d'équivalence permettant d'agréger les différents GES en kg CO2-éq.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-10", "section": "1. Contexte (Léonard)", "q": "Qu'est-ce que le greenwashing ?", "a": "Pratique commerciale visant à donner une image écologique trompeuse à un produit ou une entreprise. Combattu par les labels certifiés (ex : passeports digitaux, scanners Decathlon).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-11", "section": "1. Contexte (Léonard)", "q": "Cite les 4 limites scientifiques de l'empreinte carbone.", "a": "1) Réduit l'impact à un seul critère (climat). 2) Agrège tous les GES via GWP-100 (masque la diversité). 3) Peut conduire à des arbitrages contre-productifs. 4) Repose souvent sur des hypothèses peu transparentes.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-12", "section": "1. Contexte (Léonard)", "q": "Pourquoi le GWP-100 peut-il masquer la réalité ?", "a": "Il agrège les GES en une seule valeur, ce qui efface les différences de temps de résidence dans l'atmosphère et de puissance radiative entre les gaz.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-13", "section": "1. Contexte (Léonard)", "q": "Qu'est-ce que la neutralité carbone et quelle est sa principale ambiguïté ?", "a": "Objectif politique consistant à équilibrer émissions et absorptions de GES. Ambiguïté : les méthodes de compensation (plantations, crédits carbone) sont contestées scientifiquement.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-14", "section": "1. Contexte (Léonard)", "q": "Pourquoi parle-t-on de 2 'obsessions actuelles' en matière d'environnement ?", "a": "1) Empreinte carbone (indicateur principal d'impact). 2) Neutralité carbone (objectif politique). Toutes deux centrées sur le CO2, au détriment des autres impacts environnementaux.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-15", "section": "1. Contexte (Léonard)", "q": "Pourquoi faut-il utiliser des méthodes multicritères et multi-étapes ?", "a": "Pour avoir une vision complète des impacts environnementaux. L'empreinte carbone seule masque les autres enjeux (toxicité, biodiversité, eau, ressources). L'ACV répond à ce besoin.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-16", "section": "1. Contexte (Léonard)", "q": "Pourquoi parle-t-on de 'kg CO2-éq' au lieu de simplement 'kg CO2' ?", "a": "Pour comparer les différents GES sur une base commune. Chaque gaz a un facteur GWP qui ramène son effet à l'équivalent CO2.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-17", "section": "1. Contexte (Léonard)", "q": "Donne un exemple de label/outil anti-greenwashing.", "a": "Le passeport numérique du produit (Digital Product Passport — initiative UE) ou les scanners en magasin (ex : Decathlon) qui donnent des infos vérifiées sur matériaux, recyclabilité, origine.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-18", "section": "1. Contexte (Léonard)", "q": "Pourquoi les entreprises ne déclarent-elles parfois que leur Scope 1 ?", "a": "Parce qu'elles ne regardent que ce qu'elles maîtrisent. Elles achètent de la chaleur/électricité avec un impact, mais le minimisent en disant que ce n'est pas leur Scope 1.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-19", "section": "2. GHG Footprint Methods", "q": "Qu'est-ce que le GHG Protocol ?", "a": "Méthode internationale de référence pour comptabiliser les émissions de gaz à effet de serre d'une organisation sur toute sa chaîne de valeur.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-20", "section": "2. GHG Footprint Methods", "q": "Quand a été créé le GHG Protocol ?", "a": "1998. Standard international pour calculer les émissions sur la chaîne de valeur d'une organisation.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-21", "section": "2. GHG Footprint Methods", "q": "Quand le Scope 3 a-t-il été introduit dans le GHG Protocol ?", "a": "En 2011. Initialement, seuls les Scopes 1 et 2 étaient couverts.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-22", "section": "2. GHG Footprint Methods", "q": "Quelle est la définition du Scope 1 ?", "a": "Émissions DIRECTES liées aux ressources détenues par l'organisation : combustion dans installations internes, flotte de véhicules de l'entreprise.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-23", "section": "2. GHG Footprint Methods", "q": "Quelle est la définition du Scope 2 ?", "a": "Émissions INDIRECTES liées à l'énergie achetée : électricité, chauffage, vapeur, refroidissement.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-24", "section": "2. GHG Footprint Methods", "q": "Quelle est la définition du Scope 3 ?", "a": "Toutes les AUTRES émissions indirectes : matières premières, transport, déplacements professionnels, usage du produit par le consommateur, traitement en fin de vie, investissements.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-25", "section": "2. GHG Footprint Methods", "q": "Donne 3 exemples concrets d'émissions de Scope 3.", "a": "1) Extraction des matières premières. 2) Transport amont/aval. 3) Usage du produit par le consommateur (ou : déplacements professionnels, fin de vie, investissements).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-26", "section": "2. GHG Footprint Methods", "q": "Qu'est-ce que la norme ISO 14064 ?", "a": "Norme internationale publiée en 2006 et révisée en 2018. Permet de quantifier, vérifier et déclarer les émissions de GES. Inclut les scopes 1, 2 et 3.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-27", "section": "2. GHG Footprint Methods", "q": "Quelle exigence particulière a la norme ISO 14064 ?", "a": "Elle exige une revue critique externe obligatoire — c'est ce qui en fait un cadre certifié, applicable aux grandes entreprises/institutions.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-28", "section": "2. GHG Footprint Methods", "q": "Qu'est-ce que le Bilan Carbone® ?", "a": "Outil développé par l'ADEME (France) entre 2000 et 2003 avec J.-M. Jancovici. Évalue les GES émis ou captés sur 1 an par une organisation ou un territoire.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-29", "section": "2. GHG Footprint Methods", "q": "Quand a été déposée la marque Bilan Carbone® ?", "a": "En 2004.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-30", "section": "2. GHG Footprint Methods", "q": "Le Bilan Carbone® utilise-t-il les scopes du GHG Protocol ?", "a": "Non. Il structure les émissions par CATÉGORIES (déplacements, achats, immobilisations…) et non par scopes.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-31", "section": "2. GHG Footprint Methods", "q": "Le Bilan Carbone® est-il un outil de comparaison entre entreprises ?", "a": "NON. C'est un outil interne d'amélioration continue et de sensibilisation. Pas conçu pour comparer entre entreprises ou produits.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-32", "section": "2. GHG Footprint Methods", "q": "Cite les 6 objectifs d'un bilan carbone.", "a": "1) Structurer la politique environnementale. 2) Identifier des actions de réduction. 3) Évaluer la vulnérabilité face au climat. 4) Servir d'exemple. 5) Répondre aux régulations. 6) Impliquer employés/partenaires.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-33", "section": "2. GHG Footprint Methods", "q": "Quelle directive européenne intègre désormais le bilan carbone dans les marchés publics ?", "a": "La directive européenne sur les marchés publics (2014/24/EU). Un bon bilan carbone est devenu un avantage dans les appels d'offres publics.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-34", "section": "2. GHG Footprint Methods", "q": "Quelle est la différence entre Corporate Carbon Footprint (CCF) et Product Carbon Footprint (PCF) ?", "a": "CCF : GES d'une organisation ou d'un territoire sur 1 AN. PCF : GES d'un produit sur tout son CYCLE DE VIE. Le PCF est une application partielle de l'ACV focalisée uniquement sur le climat.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-35", "section": "2. GHG Footprint Methods", "q": "Pourquoi peut-on confondre PCF et structuration par scopes ?", "a": "Certains PCF sont exprimés selon les scopes du GHG Protocol, alors que les scopes ont été pensés pour les organisations, pas pour les produits.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-36", "section": "2. GHG Footprint Methods", "q": "Quelle est la différence clé entre empreinte carbone et ACV ?", "a": "Empreinte carbone = MONO-critère (climat uniquement). ACV = MULTI-critères ET multi-étapes (vision holistique).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-37", "section": "2. GHG Footprint Methods", "q": "Comment comparer GHG Protocol, Bilan Carbone, ISO 14064 et PCF en termes de critères ?", "a": "Tous sont MONO-critère (climat). GHG Protocol et ISO 14064 : structuration par Scopes. Bilan Carbone : par catégories. PCF : par cycle de vie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-38", "section": "2. GHG Footprint Methods", "q": "Pourquoi l'empreinte carbone d'un produit (PCF) ne reflète-t-elle pas l'impact global ?", "a": "Elle ne couvre qu'un seul indicateur (climat). Elle ignore la toxicité, l'usage de l'eau, l'épuisement des ressources, l'acidification, l'eutrophisation, la biodiversité.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-39", "section": "2. GHG Footprint Methods", "q": "Pourquoi le Scope 3 est-il souvent le plus important en volume ?", "a": "Il couvre toute la chaîne de valeur amont/aval (matières premières, transport, usage, fin de vie). Pour beaucoup d'entreprises, il représente 80%+ du total.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-40", "section": "2. GHG Footprint Methods", "q": "Qui finance ou maintient le GHG Protocol ?", "a": "Initiative du World Resources Institute (WRI) et du World Business Council for Sustainable Development (WBCSD). Standard international de référence.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-41", "section": "2. GHG Footprint Methods", "q": "Le Bilan Carbone® et le GHG Protocol couvrent-ils les mêmes GES ?", "a": "Tous deux couvrent les 7 GES du Protocole de Kyoto (CO2, CH4, N2O, HFC, PFC, SF6, NF3). Mais leur structuration est différente (catégories vs scopes).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-42", "section": "2. GHG Footprint Methods", "q": "Quelle est la principale critique faite aux méthodes mono-critères comme le GHG Protocol ?", "a": "Elles ne couvrent que le climat. Elles peuvent conduire à des arbitrages contre-productifs en ignorant les autres impacts (eau, biodiversité, toxicité).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-43", "section": "3. ACV / LCA", "q": "Quelles normes encadrent l'ACV ?", "a": "ISO 14040 (principes et cadre) et ISO 14044 (exigences et lignes directrices).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-44", "section": "3. ACV / LCA", "q": "Définition de l'ACV selon ISO 14040/44 ?", "a": "Évaluation des impacts environnementaux d'un produit, service ou procédé depuis l'extraction des matières premières jusqu'à sa fin de vie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-45", "section": "3. ACV / LCA", "q": "Quelles étapes du cycle de vie sont incluses dans une ACV ?", "a": "Extraction des matières premières, production, transport, distribution, usage, maintenance, réutilisation/recyclage, élimination finale.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-46", "section": "3. ACV / LCA", "q": "Cradle to grave : que couvre ce périmètre ?", "a": "De l'extraction des matières premières (berceau) à l'élimination finale (tombe). Périmètre le plus complet.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-47", "section": "3. ACV / LCA", "q": "Cradle to gate : que couvre ce périmètre ?", "a": "De l'extraction (berceau) à la sortie d'usine (porte). N'inclut pas l'usage ni la fin de vie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-48", "section": "3. ACV / LCA", "q": "Cradle to cradle : que couvre ce périmètre ?", "a": "Boucle fermée : extraction → utilisation → recyclage → réintégration dans la production. Approche circulaire idéale.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-49", "section": "3. ACV / LCA", "q": "Cite les 4 phases d'une ACV.", "a": "1) Définition des objectifs et du champ (Goal & Scope). 2) Inventaire du cycle de vie (LCI). 3) Évaluation des impacts (LCIA). 4) Interprétation des résultats.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-50", "section": "3. ACV / LCA", "q": "Que fait-on dans la phase 'Goal & Scope' d'une ACV ?", "a": "On définit à quoi servira l'étude, quelles frontières du système sont considérées, l'unité fonctionnelle, les hypothèses.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-51", "section": "3. ACV / LCA", "q": "Que fait-on dans la phase LCI (Life Cycle Inventory) ?", "a": "Collecte des données sur les intrants (matières, énergie) et extrants (émissions, déchets) pour chaque étape du cycle de vie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-52", "section": "3. ACV / LCA", "q": "Que fait-on dans la phase LCIA (Life Cycle Impact Assessment) ?", "a": "Transformation des flux (LCI) en indicateurs d'impact environnemental (changement climatique, acidification, etc.).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-53", "section": "3. ACV / LCA", "q": "Que fait-on dans la phase d'interprétation d'une ACV ?", "a": "Analyse des résultats, recommandations, identification des limites et incertitudes, choix d'amélioration.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-54", "section": "3. ACV / LCA", "q": "Qu'est-ce que le Life Cycle Thinking (LCT) ?", "a": "Approche QUALITATIVE. Étude rapide permettant d'identifier les étapes clés d'un cycle de vie sans chiffrage. Utile pour orienter la réflexion.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-55", "section": "3. ACV / LCA", "q": "ACV simplifiée vs ACV détaillée ?", "a": "Simplifiée : screening avec bases de données génériques, approximation rapide. Détaillée : inventaire complet avec données spécifiques (site, produit, procédé), prise en compte des impacts majeurs, adaptée aux décisions critiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-56", "section": "3. ACV / LCA", "q": "ACV attributionnelle vs conséquentielle ?", "a": "Attributionnelle : décrit l'état actuel du système, attribue une part des impacts à chaque produit. Conséquentielle : évalue l'impact d'un CHANGEMENT (remplacement de matériau, changement de fournisseur). Sert aux décisions stratégiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-57", "section": "3. ACV / LCA", "q": "Cite 6 indicateurs d'impact courants en ACV.", "a": "1) Changement climatique. 2) Acidification. 3) Eutrophisation. 4) Toxicité. 5) Usage de l'eau. 6) Consommation de ressources abiotiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-58", "section": "3. ACV / LCA", "q": "Qu'est-ce que l'unité fonctionnelle en ACV ?", "a": "Mesure de la performance fonctionnelle du produit/service étudié. Sert de référence pour comparer (ex : 1 m² de mur isolé pendant 50 ans).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-59", "section": "3. ACV / LCA", "q": "Qu'est-ce qu'un PCR ?", "a": "Product Category Rules. Règles méthodologiques spécifiques à une catégorie de produit. Définissent comment réaliser l'ACV pour garantir la comparabilité. Au sommet de la hiérarchie normative des déclarations environnementales.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-60", "section": "3. ACV / LCA", "q": "Pourquoi les PCR sont-ils nécessaires ?", "a": "Pour garantir que deux EPD/ACV d'une même catégorie de produit soient COMPARABLES. Sans règles communes, chaque fabricant ferait des choix méthodologiques différents.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-61", "section": "3. ACV / LCA", "q": "Cite les 4 limites de l'ACV.", "a": "1) Outil d'aide à la décision, pas de décision en soi. 2) Couvre seulement l'environnemental (pas l'éco ni le social). 3) Fiable seulement si transparente. 4) Souvent nécessite une validation externe par expert indépendant.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-62", "section": "3. ACV / LCA", "q": "Pourquoi une ACV nécessite-t-elle parfois une validation externe ?", "a": "Pour les ACV comparatives ou déclaratives (EPD), une revue critique par un expert indépendant est nécessaire pour garantir la crédibilité.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-63", "section": "3. ACV / LCA", "q": "L'ACV couvre-t-elle les impacts économiques et sociaux ?", "a": "Non. Elle couvre uniquement l'environnemental. Pour les autres dimensions, il faut compléter avec une LCC (Life Cycle Costing) et une S-LCA (Social LCA).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-64", "section": "3. ACV / LCA", "q": "Pourquoi parle-t-on de 'cradle to cradle' (du berceau au berceau) ?", "a": "Concept popularisé par McDonough & Braungart. Vise une circularité totale : aucun déchet, tout matériau redevient ressource. Idéal de l'économie circulaire.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-65", "section": "3. ACV / LCA", "q": "Que représente l'acidification comme indicateur ACV ?", "a": "Augmentation de l'acidité des sols, des eaux et de l'atmosphère due aux émissions de SOx, NOx, NH3. Cause les pluies acides, dégrade les écosystèmes.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-66", "section": "3. ACV / LCA", "q": "Que représente l'eutrophisation comme indicateur ACV ?", "a": "Enrichissement excessif des milieux aquatiques en nutriments (N, P). Cause des proliférations d'algues, déoxygénation et mort des écosystèmes.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-67", "section": "3. ACV / LCA", "q": "Que sont les 'ressources abiotiques' en ACV ?", "a": "Ressources non vivantes : minéraux, métaux, combustibles fossiles. Indicateur d'épuisement des ressources naturelles non renouvelables.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-68", "section": "3. ACV / LCA", "q": "Pourquoi l'ACV est-elle ITÉRATIVE ?", "a": "Les 4 phases ne sont pas séquentielles strictes. L'interprétation peut renvoyer à redéfinir les objectifs, l'inventaire ou les impacts. Processus en boucle.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-69", "section": "3. ACV / LCA", "q": "Quel est l'usage typique d'une ACV simplifiée ?", "a": "Screening rapide en début de projet pour identifier les hotspots environnementaux et orienter la conception. Pas suffisant pour les communications publiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-70", "section": "4. Éco-conception", "q": "Donne la définition de l'éco-conception.", "a": "Intégrer l'environnement dès la phase de conception d'un produit ou service. Approche d'éco-innovation visant à réduire les impacts environnementaux sur tout le cycle de vie tout en maintenant la performance fonctionnelle.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-71", "section": "4. Éco-conception", "q": "Qu'est-ce qu'une approche multi-étapes en éco-conception ?", "a": "Elle considère TOUTES les étapes du cycle de vie : extraction des matières premières, production, distribution, utilisation, fin de vie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-72", "section": "4. Éco-conception", "q": "Qu'est-ce qu'une approche multi-impacts en éco-conception ?", "a": "Elle prend en compte plusieurs types d'impacts environnementaux : changement climatique, épuisement des ressources, pollution de l'eau, acidification, etc.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-73", "section": "4. Éco-conception", "q": "L'éco-conception est-elle préventive ou curative ?", "a": "PRÉVENTIVE. Vise à anticiper et limiter les impacts dès la conception, plutôt que de les corriger en aval.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-74", "section": "4. Éco-conception", "q": "Pourquoi est-il crucial d'agir dès la phase de conception ?", "a": "C'est à la conception qu'on peut le plus agir sur l'impact environnemental. Les bons choix doivent être posés dès le départ — c'est la phase la plus impactante.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-75", "section": "4. Éco-conception", "q": "Quelles sont les normes encadrant l'éco-conception ?", "a": "ISO 14062 et AFNOR FD X30-310.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-76", "section": "4. Éco-conception", "q": "Quel est le lien entre éco-conception et chimie verte ?", "a": "L'éco-conception rejoint les principes de la chimie verte (ou chimie durable), qui visent à rendre l'industrie chimique plus respectueuse de l'environnement.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-77", "section": "4. Éco-conception", "q": "Cite 4 des 12 principes de la chimie verte.", "a": "1) Prévention de la pollution. 2) Économie des atomes (maximiser le rendement matière). 3) Synthèses moins dangereuses. 4) Conception de produits chimiques moins toxiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-78", "section": "4. Éco-conception", "q": "Cite encore 4 principes de la chimie verte (5 à 8).", "a": "5) Limiter l'utilisation de solvants. 6) Minimiser la consommation d'énergie. 7) Utiliser des ressources renouvelables. 8) Réduire le nombre de dérivés.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-79", "section": "4. Éco-conception", "q": "Cite les 4 derniers principes de la chimie verte (9 à 12).", "a": "9) Préférence pour les processus catalytiques. 10) Conception de produits pour une dégradation finale. 11) Surveillance/contrôle des réactions en temps réel. 12) Chimie fondamentalement plus sûre (prévention des accidents).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-80", "section": "4. Éco-conception", "q": "Quelle est la méthode classique en 4 étapes pour faire de l'éco-conception ?", "a": "1) Définir l'objectif (améliorer existant ou éco-concevoir nouveau). 2) Considérer le cycle de vie (unité fonctionnelle, étapes). 3) Identifier les sources d'impact (flux entrants/sortants). 4) Suggérer des pistes d'amélioration.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-81", "section": "4. Éco-conception", "q": "Cite 4 stratégies typiques d'éco-conception.", "a": "1) Réduire les ressources (matériaux, énergie). 2) Allonger la durée de vie. 3) Favoriser la réparabilité et le recyclage. 4) Limiter les impacts dès la conception.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-82", "section": "4. Éco-conception", "q": "Qu'apporte l'éco-conception par rapport à une démarche corrective ?", "a": "Elle évite la création de l'impact plutôt que de le compenser après. Plus efficace techniquement et économiquement à long terme.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-83", "section": "4. Éco-conception", "q": "Pourquoi parle-t-on d'éco-INNOVATION et pas seulement d'éco-conception ?", "a": "L'éco-conception est une démarche d'éco-innovation : elle ne consiste pas juste à 'verdir' un produit existant, mais à repenser les solutions techniques pour réduire les impacts.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-84", "section": "4. Éco-conception", "q": "Quels gains attendus d'une démarche d'éco-conception ?", "a": "Réduction de l'impact environnemental, économies de matières/énergie, accès à des marchés (clauses environnementales publiques), image de marque, anticipation des régulations futures.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-85", "section": "4. Éco-conception", "q": "Donne 3 exemples de stratégies de réduction des ressources.", "a": "1) Allègement (moins de matière par produit). 2) Substitution par matériaux renouvelables/recyclés. 3) Suppression de composants superflus.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-86", "section": "4. Éco-conception", "q": "Comment 'allonger la durée de vie' contribue-t-il à l'éco-conception ?", "a": "Plus un produit dure, plus son impact environnemental est amorti sur une longue période d'usage. Évite la fabrication de remplacements.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-87", "section": "5. EPD", "q": "Que signifie EPD ?", "a": "Environmental Product Declaration (Déclaration Environnementale de Produit). Déclaration environnementale de type III selon ISO 14025.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-88", "section": "5. EPD", "q": "Sur quoi se base une EPD ?", "a": "Sur une ACV vérifiée. L'EPD est l'application normalisée d'une ACV à des fins de communication.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-89", "section": "5. EPD", "q": "Les EPD sont-elles obligatoires ou volontaires ?", "a": "Volontaires. Mais de plus en plus utilisées pour la transparence environnementale et de plus en plus exigées dans les marchés publics.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-90", "section": "5. EPD", "q": "Quel type d'écolabel correspond à l'Écolabel européen ou Nordic Swan ?", "a": "Type I (ISO 14024). Certification officielle par un organisme tiers selon des critères multiples. Basée sur le cycle de vie mais simplifiée.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-91", "section": "5. EPD", "q": "Cite 3 exemples d'écolabels de Type I.", "a": "Écolabel européen (Fleur), Nordic Swan, Blue Angel.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-92", "section": "5. EPD", "q": "Qu'est-ce qu'un label de Type II selon ISO 14021 ?", "a": "Déclaration environnementale AUTO-déclarée par le fabricant. NON vérifiée par un tiers. Ex : '100% recyclable', 'sans COV'.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-93", "section": "5. EPD", "q": "Quel est le risque principal des labels de Type II ?", "a": "Le greenwashing : pas de vérification externe, donc affirmations potentiellement trompeuses.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-94", "section": "5. EPD", "q": "Qu'est-ce qu'un label de Type III selon ISO 14025 ?", "a": "EPD : déclaration environnementale basée sur une ACV complète, VÉRIFIÉE selon des PCR. Plus transparent et rigoureux que les Types I et II.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-95", "section": "5. EPD", "q": "Quelle est la norme EPD pour le secteur du bâtiment ?", "a": "EN 15804+A2. Définit le PCR (Product Category Rules) pour les produits de construction.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-96", "section": "5. EPD", "q": "Cite 4 bases de données EPD.", "a": "INIES (France), B-EPD (Belgique), IBU (Allemagne), Environdec (international, Suède). TOTEM (Belgique) utilise les EPD de B-EPD.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-97", "section": "5. EPD", "q": "Cite 4 outils logiciels pour réaliser des ACV.", "a": "SimaPro, OpenLCA, One Click LCA, Ecoinvent. Aussi : INIES, TOTEM, Environdec.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-98", "section": "5. EPD", "q": "Pourquoi l'EPD peut-elle être difficile pour les PME ?", "a": "Réaliser une ACV complète est complexe et coûteux. Nécessite des compétences, des outils, des données spécifiques, et une revue critique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-99", "section": "5. EPD", "q": "Quels sont les avantages d'avoir une EPD ?", "a": "1) Argument pour répondre aux clauses environnementales des marchés publics. 2) Demande des clients. 3) Conforme à la Green Claims Directive. 4) Inclusion dans B-EPD pour utilisation dans TOTEM.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-100", "section": "5. EPD", "q": "Comment se classent les 3 types d'écolabels selon leur rigueur ?", "a": "Type II (auto-déclaré, peu fiable) < Type I (certifié par tiers, multi-critères simplifiés) < Type III / EPD (ACV complète + PCR + vérification).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-101", "section": "5. EPD", "q": "Qu'est-ce que la Green Claims Directive ?", "a": "Directive européenne récente qui encadre les allégations environnementales des entreprises. Les EPD sont des moyens conformes pour prouver ces allégations.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-102", "section": "5. EPD", "q": "Qu'est-ce que le Nordic Swan ?", "a": "Écolabel officiel des pays nordiques (Type I, ISO 14024). Critères stricts sur tout le cycle de vie. Un des plus exigeants au monde.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-103", "section": "5. EPD", "q": "Qu'est-ce que le Blue Angel ?", "a": "Premier écolabel mondial, créé en 1978 en Allemagne. Écolabel Type I. Couvre une grande variété de produits et services.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-104", "section": "5. EPD", "q": "TOTEM est-il une base EPD ou un outil d'ACV ?", "a": "C'est UN OUTIL belge qui s'appuie sur les EPD de la base B-EPD pour optimiser l'impact environnemental TOTAL des matériaux de construction d'un bâtiment.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-105", "section": "5. EPD", "q": "Comment l'EPD facilite-t-elle les marchés publics ?", "a": "Permet de répondre objectivement aux clauses environnementales des appels d'offres (Directive UE 2014/24/EU sur les marchés publics).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-106", "section": "6. Étude de cas plastiques", "q": "Production mondiale 2019 : ciment / acier / plastiques / ammoniac ?", "a": "Ciment : 4,5 Gt. Acier : 1,8 Gt. Plastiques : 370 Mt. Ammoniac : 150 Mt.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-107", "section": "6. Étude de cas plastiques", "q": "Quelle part de l'énergie primaire mondiale est consommée par ces 4 matériaux (ciment, acier, plastiques, ammoniac) ?", "a": "17% de l'énergie primaire mondiale. Et ~25% des émissions de CO2 mondiales (Vaclav Smil).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-108", "section": "6. Étude de cas plastiques", "q": "Production mondiale de plastiques en 2023 ?", "a": "400,3 Mt. Plus de la moitié de cette production a eu lieu depuis l'an 2000.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-109", "section": "6. Étude de cas plastiques", "q": "Quelle part des déchets plastiques est recyclée à l'échelle historique mondiale ?", "a": "Moins de 10%. Vaste problème écologique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-110", "section": "6. Étude de cas plastiques", "q": "Part des plastiques d'origine fossile dans le monde et en Europe ?", "a": "90,4% origine fossile dans le monde. 79,4% en Europe (l'Europe a un peu plus de plastiques biosourcés/recyclés que la moyenne mondiale).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-111", "section": "6. Étude de cas plastiques", "q": "Quels sont les 4 principaux secteurs utilisateurs de plastiques ?", "a": "1) Emballages. 2) Bâtiment et travaux publics. 3) Textiles. 4) Biens de consommation.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-112", "section": "6. Étude de cas plastiques", "q": "Place de la Belgique dans la production européenne de plastique ?", "a": "2e producteur européen avec 14% de la production, juste après l'Allemagne.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-113", "section": "6. Étude de cas plastiques", "q": "Différence thermoplastiques vs thermodurcissables ?", "a": "Thermoplastiques : RÉVERSIBLES, peuvent fondre puis se resolidifier (PE, PP, PS, PET, PVC). Thermodurcissables : IRRÉVERSIBLES, durcissent de façon permanente (PUR, époxy, urée-formaldéhyde).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-114", "section": "6. Étude de cas plastiques", "q": "Cite 5 thermoplastiques principaux.", "a": "PE (polyéthylène), PP (polypropylène), PS (polystyrène), PET (polyéthylène téréphtalate), PVC (polychlorure de vinyle).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-115", "section": "6. Étude de cas plastiques", "q": "Cite 3 thermodurcissables.", "a": "PUR (polyuréthanes), résines époxy, résines urée-formaldéhyde (ex : meubles MDF). Aussi : polyesters, vinylesters, phénoliques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-116", "section": "6. Étude de cas plastiques", "q": "Polyaddition vs polycondensation ?", "a": "Polyaddition : réaction SANS sous-produit, A + B → AB (ex : PE, PS). Polycondensation : réaction AVEC libération d'un coproduit (souvent H2O), A + B → AB + H2O (ex : nylon, polyester).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-117", "section": "6. Étude de cas plastiques", "q": "Qu'est-ce qu'une oléfine ?", "a": "Hydrocarbure insaturé avec au moins une double liaison C=C. Exemples : éthylène, propylène, butadiène. Obtenues par vapocraquage du pétrole/gaz naturel.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-118", "section": "6. Étude de cas plastiques", "q": "Qu'est-ce que le vapocraquage (steam cracking) ?", "a": "Procédé thermique qui casse les longues chaînes d'hydrocarbures (pétrole, gaz naturel) pour produire des molécules plus petites et réactives (oléfines, aromatiques).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-119", "section": "6. Étude de cas plastiques", "q": "Quelle est l'évolution de la production mondiale d'éthylène ?", "a": "111 Mt en 2009 → 146 Mt en 2016 → 201 Mt en 2020 → ~300 Mt en 2025. La plus grande des 'briques de base' de la chimie.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-120", "section": "6. Étude de cas plastiques", "q": "À quoi sert principalement l'éthylène ?", "a": "C'est l'oléfine la plus simple et le plus utilisé. Sert à fabriquer : PE, PVC (avec Cl), PS (via éthylbenzène), PET (via éthylène glycol).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-121", "section": "6. Étude de cas plastiques", "q": "PVC : matières premières et procédé ?", "a": "Éthylène + chlore (issu de l'électrolyse du NaCl). Co-produits valorisés : NaOH (chimie) et H2 (énergie). Acteur belge majeur : Inovyn.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-122", "section": "6. Étude de cas plastiques", "q": "Quel est le bénéfice de la production de PVC pour la chimie ?", "a": "L'électrolyse du NaCl produit simultanément le chlore (pour PVC) et 2 co-produits valorisables : NaOH (soude caustique, chimie) et H2 (énergie). Triple valorisation.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-123", "section": "6. Étude de cas plastiques", "q": "Polystyrène (PS) : étapes de fabrication ?", "a": "1) Éthylène + benzène → éthylbenzène. 2) Déshydrogénation de l'éthylbenzène → styrène. 3) Polymérisation du styrène → polystyrène.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-124", "section": "6. Étude de cas plastiques", "q": "PET : matières premières et procédé ?", "a": "Estérification entre éthylène glycol (issu de l'oxyde d'éthylène) et acide téréphtalique (issu du paraxylène).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-125", "section": "6. Étude de cas plastiques", "q": "Comment obtient-on l'éthylène glycol pour le PET ?", "a": "L'éthylène est oxydé en oxyde d'éthylène, qui est ensuite hydrolysé en éthylène glycol.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-126", "section": "6. Étude de cas plastiques", "q": "Comment obtient-on l'acide téréphtalique pour le PET ?", "a": "Oxydation du paraxylène (un des composants des BTX, obtenu par reformage catalytique).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-127", "section": "6. Étude de cas plastiques", "q": "Propylène : production et usage principal ?", "a": "Produit par vapocraquage ou comme coproduit du raffinage du pétrole. Marché en forte croissance. Sert principalement à fabriquer le polypropylène (PP).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-128", "section": "6. Étude de cas plastiques", "q": "Butadiène : marché et usage ?", "a": "Marché plus restreint que l'éthylène/propylène. Utilisé dans les copolymères : caoutchoucs synthétiques (SBR — Styrene Butadiene Rubber), ABS (Acrylonitrile Butadiene Styrene).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-129", "section": "6. Étude de cas plastiques", "q": "Que signifie BTX ?", "a": "Benzène, Toluène, Xylènes. Aromatiques obtenus par : 1) essences de pyrolyse (sous-produit du vapocraquage) ou 2) reformage catalytique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-130", "section": "6. Étude de cas plastiques", "q": "Quel xylène est important pour le PET ?", "a": "Le PARAXYLÈNE. Il est oxydé pour donner l'acide téréphtalique, qui réagit avec l'éthylène glycol pour donner le PET.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-131", "section": "6. Étude de cas plastiques", "q": "Utilisations principales des BTX ?", "a": "Benzène → PS, ABS (via styrène). Paraxylène → acide téréphtalique → PET. Toluène : solvants. Aussi : fibres synthétiques, plastiques techniques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-132", "section": "6. Étude de cas plastiques", "q": "Composants des polyuréthanes (PUR) ?", "a": "Réaction entre Diisocyanates (TDI ou MDI) + Polyols.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-133", "section": "6. Étude de cas plastiques", "q": "PUR : mousses souples vs rigides ?", "a": "Mousses souples : matelas, sièges — utilisent CO2 comme agent gonflant. Mousses rigides : isolation — utilisent pentane retenu dans les cellules. Produits durs : roues de rollers — sans agent gonflant.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-134", "section": "6. Étude de cas plastiques", "q": "Cite 5 additifs courants des plastiques.", "a": "1) Plastifiants (souplesse — ex : PVC). 2) Antioxydants (résistance à la chaleur/oxygène). 3) Stabilisants UV / UV blockers. 4) Retardateurs de flamme. 5) Pigments (couleurs).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-135", "section": "6. Étude de cas plastiques", "q": "Cite encore 3 additifs des plastiques.", "a": "6) Antistatiques (évite l'accumulation de charges). 7) Modifiants d'impact (absorption des chocs — casques, sécurité véhicule). 8) Agents gonflants (pour les mousses).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-136", "section": "6. Étude de cas plastiques", "q": "Pourquoi les retardateurs de flamme posent-ils problème en fin de vie ?", "a": "Ils sont souvent halogénés (bromés, chlorés) et toxiques. Compliquent fortement le recyclage et la valorisation énergétique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-137", "section": "6. Étude de cas plastiques", "q": "Cite les 3 grands procédés de plasturgie.", "a": "1) Extrusion : fusion de granulés poussés à travers une filière → tubes, feuilles, films, profilés continus. 2) Moulage par soufflage (blow moulding) : objets creux (bouteilles, flacons). 3) Injection : plastique fondu sous pression dans un moule (jouets, boîtiers).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-138", "section": "6. Étude de cas plastiques", "q": "Quel procédé de plasturgie pour fabriquer une bouteille ?", "a": "Moulage par soufflage (blow moulding). Forme creuse par insufflation d'air dans une préforme fondue.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-139", "section": "6. Étude de cas plastiques", "q": "Quel procédé de plasturgie pour fabriquer un jouet en plastique ?", "a": "Injection. Le plastique fondu est injecté sous pression dans un moule fermé.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-140", "section": "6. Étude de cas plastiques", "q": "Quel procédé de plasturgie pour fabriquer un film plastique ?", "a": "Extrusion. Le plastique fondu est poussé à travers une filière en continu.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-141", "section": "6. Étude de cas plastiques", "q": "Impact économique et social du secteur plastique en Belgique ?", "a": "La Belgique est le 2e producteur EU (14% après l'Allemagne). Forte présence chimique à Anvers. Mais retard sur le recyclage.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-142", "section": "6. Étude de cas plastiques", "q": "Pourquoi le secteur plastique européen souffre-t-il depuis 2023 ?", "a": "Impact du COVID et de la hausse des prix de l'énergie. Problèmes d'approvisionnement en matières premières. Concurrence asiatique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-143", "section": "6. Étude de cas plastiques", "q": "Pourquoi le plastique est-il un défi pour l'ACV ?", "a": "Production très énergivore (vapocraquage à 850°C), origine fossile à 90%, fin de vie problématique (peu recyclé), pollution macro/microplastiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-144", "section": "6. Étude de cas plastiques", "q": "Quelle est la durée typique d'un emballage plastique vs sa durée de production ?", "a": "Production : industrielle, intensive en énergie/matière. Usage : souvent quelques minutes/heures (emballage à usage unique). Énorme déséquilibre durée/impact.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-145", "section": "6. Étude de cas plastiques", "q": "Qu'est-ce qu'un plastique mono-matériau ?", "a": "Plastique composé d'un seul type de polymère, sans additifs problématiques ni couches multiples. Plus facile à recycler que les multicouches.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-146", "section": "6. Étude de cas plastiques", "q": "À quoi servent les emballages multicouches et pourquoi sont-ils problématiques ?", "a": "Combinent plusieurs polymères (ex : PE + PA + PET) pour atteindre des propriétés barrières. Mais leur séparation est très difficile, donc peu recyclables.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-147", "section": "6. Étude de cas plastiques", "q": "Quelle entreprise belge est citée pour la production de PVC et électrolyse du NaCl ?", "a": "Inovyn (groupe INEOS). Acteur majeur du chlorovinyl en Belgique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-148", "section": "6. Étude de cas plastiques", "q": "Pourquoi l'ABS contient-il à la fois du butadiène et du benzène ?", "a": "ABS = Acrylonitrile Butadiene Styrene. Le styrène vient du benzène (via éthylbenzène), le butadiène vient du vapocraquage. Plastique technique résistant aux chocs.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-149", "section": "7. Plastiques biosourcés", "q": "Biosourcé vs biodégradable : sont-ce des synonymes ?", "a": "NON. Biosourcé : fabriqué à partir de ressources renouvelables (végétales, bactériennes). Biodégradable : peut être décomposé naturellement par des micro-organismes. Un plastique peut être l'un, l'autre, les deux ou aucun.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-150", "section": "7. Plastiques biosourcés", "q": "Qu'est-ce qu'un bioplastique ?", "a": "Matériau biosourcé OU biodégradable OU les deux. À distinguer des plastiques conventionnels (fossiles ET non biodégradables).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-151", "section": "7. Plastiques biosourcés", "q": "PLA : que signifient les lettres et quelle est l'origine ?", "a": "Polylactic Acid (Acide PolyLactique). Origine : amidon de maïs, canne à sucre, betterave. C'est un bioplastique à la fois biosourcé ET biodégradable (en compostage industriel).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-152", "section": "7. Plastiques biosourcés", "q": "PLA : étapes de fabrication ?", "a": "1) Extraction des sucres de la biomasse. 2) Fermentation des sucres en acide lactique par des bactéries. 3) Formation du lactide (dimère cyclique). 4) Polymérisation du lactide en PLA.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-153", "section": "7. Plastiques biosourcés", "q": "Le PLA est-il biodégradable en compost domestique ?", "a": "Non. Compostable seulement en compostage INDUSTRIEL (T° élevées >55°C, humidité contrôlée). Dans la nature ou un compost domestique, dégradation très lente.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-154", "section": "7. Plastiques biosourcés", "q": "Applications du PLA ?", "a": "Emballages, objets à usage unique, impression 3D, dispositifs médicaux (sutures résorbables), articles rigides durables, fibres non tissées (textile, hygiène).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-155", "section": "7. Plastiques biosourcés", "q": "Bio-PE : origine et procédé ?", "a": "Polyéthylène biosourcé. Origine : bioéthanol (canne à sucre, betterave). Procédé : déshydratation du bioéthanol → bioéthylène → polymérisation. IDENTIQUE au PE fossile (même usage, même recyclabilité).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-156", "section": "7. Plastiques biosourcés", "q": "Le Bio-PE est-il biodégradable ?", "a": "Non. Il est biosourcé mais chimiquement identique au PE fossile, donc non biodégradable.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-157", "section": "7. Plastiques biosourcés", "q": "Quels autres polymères biosourcés existent à base de biopolymères naturels ?", "a": "Polymères à base d'amidon, de cellulose ou de protéines (caséine, gluten). Souvent compostables, mais propriétés mécaniques inférieures aux plastiques classiques.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-158", "section": "7. Plastiques biosourcés", "q": "Qu'est-ce que le procédé MTO ?", "a": "Methanol-To-Olefins. Méthanol issu de la gazéification de biomasse → transformé en oléfines (éthylène, propylène) par procédé catalytique. Voie émergente pour des plastiques biosourcés.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-159", "section": "7. Plastiques biosourcés", "q": "Avantages des bioplastiques ?", "a": "Réduction de l'empreinte carbone (CO2 absorbé pendant la croissance des plantes). Biodégradabilité (pour certains). Indépendance vis-à-vis du pétrole.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-160", "section": "7. Plastiques biosourcés", "q": "Limites des bioplastiques ?", "a": "Concurrence avec l'alimentation (utilisent des cultures alimentaires). Recyclage difficile (filière dédiée non développée). Biodégradabilité parfois incomplète hors compostage industriel. Coût souvent supérieur.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-161", "section": "7. Plastiques biosourcés", "q": "Pourquoi le recyclage des PLA est-il problématique ?", "a": "Si le PLA est mélangé avec du PET dans les bacs de recyclage, il contamine le flux PET. Il fond à plus basse température et fragilise le PET recyclé.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-162", "section": "7. Plastiques biosourcés", "q": "Pourquoi un plastique biosourcé peut-il avoir une empreinte carbone plus faible ?", "a": "La croissance des plantes utilisées comme matière première absorbe du CO2 atmosphérique. Ce CO2 'pris' réduit le bilan net (par rapport à un plastique fossile).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-163", "section": "7. Plastiques biosourcés", "q": "Quels critiques majeures peut-on faire au PLA ?", "a": "Concurrence alimentaire (maïs, canne à sucre). Compostable uniquement en industriel (T>55°C). Mauvaises propriétés thermiques (déformation à T modérée).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-164", "section": "7. Plastiques biosourcés", "q": "Comment vérifier qu'un plastique est biosourcé ?", "a": "Mesure du 14C (carbone radioactif). Le C biologique 'récent' contient du 14C, contrairement au C fossile qui n'en contient plus. Test ASTM D6866 / EN 16640.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-165", "section": "7. Plastiques biosourcés", "q": "Le PEF (polyethylene furanoate) est-il biosourcé ?", "a": "Oui. Polymère biosourcé candidat au remplacement du PET. Issu de sucres végétaux via le FDCA. Meilleures propriétés barrières que le PET.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-166", "section": "8. Fin de vie plastiques", "q": "Cite les 3 voies principales de fin de vie des plastiques.", "a": "1) Recyclage (transformation pour réutilisation). 2) Valorisation énergétique (incinération avec récupération d'énergie). 3) Mise en décharge (enfouissement).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-167", "section": "8. Fin de vie plastiques", "q": "Quel est le taux réel de recyclage des plastiques en Europe ?", "a": "Sur 32 Mt collectées, seulement ~7 Mt sont effectivement réutilisées sous forme de matériaux recyclés. Cela montre les limites du système.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-168", "section": "8. Fin de vie plastiques", "q": "Que se passe-t-il avec les 25 Mt collectées non recyclées ?", "a": "Pertes lors du tri, contamination, incinération avec valorisation énergétique, exportation, mise en décharge.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-169", "section": "8. Fin de vie plastiques", "q": "Cite 5 technologies de tri des plastiques.", "a": "1) Spectroscopie infrarouge (NIR) — identification spectrale. 2) Tri par densité (bains liquides). 3) Vision artificielle (caméras + IA). 4) Aimants (plastiques avec inserts métalliques). 5) Courants de Foucault (métaux non ferreux).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-170", "section": "8. Fin de vie plastiques", "q": "Comment fonctionne le tri par spectroscopie NIR ?", "a": "Lumière infrarouge proche envoyée sur le déchet. Chaque polymère a une signature spectrale unique. Identification rapide et automatisable (PET, PE, PP, PS séparés en flux purs).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-171", "section": "8. Fin de vie plastiques", "q": "Recyclage mécanique : principe ?", "a": "Broyer, laver, fondre, regranuler. Adapté aux plastiques propres et mono-matériaux. Principalement pour PET, PE, PP.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-172", "section": "8. Fin de vie plastiques", "q": "Limites du recyclage mécanique ?", "a": "Perte progressive de qualité après plusieurs cycles (chaînes polymères raccourcies). Mal adapté aux plastiques complexes, contaminés, multicouches ou avec additifs.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-173", "section": "8. Fin de vie plastiques", "q": "Qu'est-ce que le recyclage chimique ?", "a": "Décompose les polymères en monomères ou molécules de base (dépolymérisation, gazéification, pyrolyse). Permet de recycler les plastiques non compatibles avec le mécanique (mélangés, multicouches).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-174", "section": "8. Fin de vie plastiques", "q": "Avantages et inconvénients du recyclage chimique ?", "a": "Avantages : régénération potentiellement infinie, traite les flux complexes. Inconvénients : plus coûteux et plus énergivore que le mécanique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-175", "section": "8. Fin de vie plastiques", "q": "Pourquoi les thermodurcissables ne sont-ils pas recyclables mécaniquement ?", "a": "Ils ne fondent pas. Leur réseau réticulé est permanent. Seul le recyclage chimique (dépolymérisation) ou la valorisation énergétique est possible.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-176", "section": "8. Fin de vie plastiques", "q": "Qu'est-ce que la valorisation énergétique des plastiques ?", "a": "Incinération des plastiques pour produire de la chaleur ou de l'électricité. Permet de récupérer partiellement l'énergie. Mais engendre des émissions de CO2 et nécessite un traitement des fumées.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-177", "section": "8. Fin de vie plastiques", "q": "Pourquoi la contamination des plastiques est-elle un problème ?", "a": "Résidus alimentaires, mélanges de plastiques différents, additifs (phtalates, retardateurs de flamme) : tous réduisent la qualité du recyclage et la valeur du flux secondaire.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-178", "section": "8. Fin de vie plastiques", "q": "Quelles sont les voies d'amélioration du recyclage des plastiques ?", "a": "1) Améliorer le tri (capteurs avancés). 2) Éco-conception (mono-matériau, sans additifs problématiques). 3) Développer le recyclage chimique. 4) Cadre réglementaire incitatif. 5) Sensibilisation des consommateurs.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-179", "section": "8. Fin de vie plastiques", "q": "Pourquoi le PET est-il le plastique le mieux recyclé ?", "a": "Filière mature (R-PET pour bouteilles), technologie NIR efficace, mono-matériau souvent transparent, valeur économique du flux secondaire.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-180", "section": "8. Fin de vie plastiques", "q": "Qu'est-ce que la pyrolyse des plastiques ?", "a": "Forme de recyclage chimique. Chauffage à 400-800°C en absence d'oxygène. Décompose les polymères en hydrocarbures (huiles, gaz) réutilisables comme matière première chimique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-181", "section": "8. Fin de vie plastiques", "q": "Quelle est la hiérarchie européenne pour les plastiques en fin de vie ?", "a": "Prévention > Réutilisation > Recyclage mécanique > Recyclage chimique > Valorisation énergétique > Mise en décharge (dernière option).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-182", "section": "8. Fin de vie plastiques", "q": "Quelle est la limite physique du recyclage mécanique ?", "a": "Les chaînes polymères sont raccourcies à chaque cycle de fusion. Au bout de 3-5 cycles, les propriétés mécaniques sont trop dégradées pour des applications de qualité.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-183", "section": "9. Ammoniac & Haber-Bosch", "q": "Quel pourcentage de l'ammoniac est utilisé pour les engrais ?", "a": "85% de la production mondiale. Les engrais azotés sont indispensables à l'agriculture moderne.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-184", "section": "9. Ammoniac & Haber-Bosch", "q": "À partir de quoi l'ammoniac est-il produit ?", "a": "Principalement à partir de gaz naturel (méthane CH4) : utilisé à la fois comme matière première (2/3) et comme source d'énergie (1/3).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-185", "section": "9. Ammoniac & Haber-Bosch", "q": "Quelle est la réaction du procédé Haber-Bosch ?", "a": "N2 + 3 H2 ⇌ 2 NH3. ΔH° = -92 kJ/mol (exothermique).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-186", "section": "9. Ammoniac & Haber-Bosch", "q": "Conditions opératoires du Haber-Bosch (P, T, catalyseur) ?", "a": "Pression : 150-300 bar (parfois 200-250). Température : 400-500°C. Catalyseur : à base de fer (Fe).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-187", "section": "9. Ammoniac & Haber-Bosch", "q": "Quel est le principal défi technique du Haber-Bosch ?", "a": "Obtenir suffisamment de dihydrogène (H2), indispensable pour 'fixer' l'azote atmosphérique N2 en NH3.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-188", "section": "9. Ammoniac & Haber-Bosch", "q": "Comment produit-on l'H2 nécessaire au Haber-Bosch ?", "a": "Reformage à la vapeur du méthane (steam reforming). Procédé en plusieurs étapes : reformage primaire + reformage secondaire + water-gas shift.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-189", "section": "9. Ammoniac & Haber-Bosch", "q": "Réaction du reformage primaire (production d'H2) ?", "a": "CH4 + H2O → CO + 3 H2. Sur catalyseur au nickel, à haute température.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-190", "section": "9. Ammoniac & Haber-Bosch", "q": "Que fait le reformage secondaire ?", "a": "Introduit de l'AIR dans le mélange. Permet d'apporter le N2 nécessaire à la synthèse de NH3 et de fournir l'énergie thermique manquante.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-191", "section": "9. Ammoniac & Haber-Bosch", "q": "Qu'est-ce que la réaction de water-gas shift ?", "a": "CO + H2O → CO2 + H2. ΔH° = -41 kJ/mol (exothermique). Augmente le rendement en H2 et réduit la teneur en CO résiduel à moins de 0,5%.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-192", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi doit-on éliminer le CO avant le réacteur Haber-Bosch ?", "a": "Le CO est un poison pour le catalyseur de fer du Haber-Bosch. Sa concentration doit être <0,5% pour préserver l'efficacité du catalyseur.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-193", "section": "9. Ammoniac & Haber-Bosch", "q": "Quelle part des émissions mondiales de CO2 le procédé Haber-Bosch représente-t-il ?", "a": "1,8% des émissions mondiales de CO2. Énorme pour un seul procédé chimique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-194", "section": "9. Ammoniac & Haber-Bosch", "q": "Comment produit-on l'acide nitrique HNO3 à partir de NH3 ?", "a": "Par oxydation catalytique du NH3. Sert ensuite à fabriquer du nitrate d'ammonium (engrais) et d'autres dérivés azotés.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-195", "section": "9. Ammoniac & Haber-Bosch", "q": "Réaction de production du nitrate d'ammonium ?", "a": "NH3 + HNO3 → NH4NO3. Utilisé comme engrais ET comme explosif sous certaines conditions (mélangé à du carburant).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-196", "section": "9. Ammoniac & Haber-Bosch", "q": "Qu'est-ce que l'urée et quelle est sa formule ?", "a": "CO(NH2)2. Fertilisant azoté LE PLUS UTILISÉ au monde. Issue de la réaction du NH3 avec le CO2.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-197", "section": "9. Ammoniac & Haber-Bosch", "q": "Cite 3 usages de l'urée au-delà de l'agriculture.", "a": "1) AdBlue : solution à base d'urée pour la réduction catalytique sélective (SCR) des NOx dans les moteurs diesel. 2) Résines urée-formaldéhyde : colles pour MDF, contreplaqué. 3) Cosmétiques (hydratant).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-198", "section": "9. Ammoniac & Haber-Bosch", "q": "Qu'est-ce qu'un engrais NPK ?", "a": "Engrais combinant azote (N), phosphore (P) et potassium (K). Trois éléments essentiels à la croissance des plantes.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-199", "section": "9. Ammoniac & Haber-Bosch", "q": "Réaction de fabrication d'un engrais phosphate-ammoniac ?", "a": "H3PO4 + 3 NH3 → (NH4)3PO4 (phosphate triammonique). Combine l'azote du NH3 et le phosphore de l'acide phosphorique.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-200", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi envisage-t-on l'ammoniac comme vecteur énergétique ?", "a": "Forte densité énergétique. Plus facile à stocker et transporter que l'H2 pur (liquéfiable à -33°C contre -253°C pour H2). Envisagé pour le transport longue distance d'énergie verte.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-201", "section": "9. Ammoniac & Haber-Bosch", "q": "Cite les 4 voies de décarbonation du Haber-Bosch.", "a": "1) Hydrogène vert (électrolyse de l'eau alimentée par renouvelables). 2) Amélioration de l'efficacité énergétique. 3) Captage et valorisation du CO2 émis (CCUS). 4) Catalyseurs plus efficaces.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-202", "section": "9. Ammoniac & Haber-Bosch", "q": "Qu'est-ce que l'hydrogène vert et pourquoi le préfère-t-on ?", "a": "H2 produit par électrolyse de l'eau (2 H2O → 2 H2 + O2) alimentée par des énergies renouvelables. Pas d'émission de CO2 lors de la production. Remplace le H2 'gris' issu du méthane.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-203", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi le Haber-Bosch est-il aussi appelé un pilier de la civilisation moderne ?", "a": "Sans engrais azotés synthétiques, on ne pourrait nourrir qu'environ la moitié de la population mondiale. Le Haber-Bosch a permis l'explosion démographique du 20e siècle.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-204", "section": "9. Ammoniac & Haber-Bosch", "q": "Quelle proportion du gaz naturel mondial est utilisée pour produire de l'ammoniac ?", "a": "Environ 1-2% du gaz naturel mondial. Pour la synthèse de l'ammoniac (matière première + énergie).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-205", "section": "9. Ammoniac & Haber-Bosch", "q": "Quel est le bilan énergétique du procédé Haber-Bosch ?", "a": "Très énergivore. Consomme environ 1-2% de l'énergie mondiale. Le gaz naturel sert à la fois de matière première (CH4 → H2) et de source d'énergie (chauffage).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-206", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi la haute pression est-elle utilisée dans le Haber-Bosch ?", "a": "Selon Le Chatelier, la haute pression déplace l'équilibre vers la formation de NH3 (4 molécules → 2 molécules). Compensation de la basse température nécessaire à l'équilibre.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-207", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi pas une température plus basse pour Haber-Bosch (Le Chatelier favorable) ?", "a": "À basse T, la cinétique est trop lente même avec catalyseur. Compromis : 400-500°C pour avoir une vitesse industrielle raisonnable.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-208", "section": "9. Ammoniac & Haber-Bosch", "q": "Quel est l'inventeur du procédé Haber-Bosch et quand a-t-il été développé ?", "a": "Fritz Haber (chimie) et Carl Bosch (ingénierie industrielle). Procédé industrialisé vers 1913 chez BASF. Prix Nobel pour les deux.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-209", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi l'urée est-elle préférée comme engrais à NH4NO3 dans certains pays ?", "a": "Plus haute teneur en azote (46% N pour urée vs 35% pour NH4NO3). Moins explosive et plus stable au stockage.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-210", "section": "9. Ammoniac & Haber-Bosch", "q": "Quelles sont les couleurs de l'hydrogène (gris/bleu/vert) ?", "a": "Gris : H2 du méthane sans capture CO2 (le plus courant aujourd'hui). Bleu : H2 du méthane AVEC capture/stockage du CO2 (CCUS). Vert : H2 par électrolyse alimentée par renouvelables.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-211", "section": "9. Ammoniac & Haber-Bosch", "q": "Pourquoi remplacer un H2 'gris' par un H2 vert pour Haber-Bosch ?", "a": "Le H2 gris est responsable de la quasi-totalité des émissions de CO2 du procédé. Le H2 vert élimine cette source d'émissions et décarbone radicalement la synthèse d'ammoniac.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-212", "section": "10. Messages clés", "q": "Quel est le message clé n°1 selon Léonard ?", "a": "L'empreinte carbone seule est INSUFFISANTE pour une évaluation environnementale globale. Elle ne couvre qu'un critère (climat).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-213", "section": "10. Messages clés", "q": "Quel est le message clé n°2 selon Léonard ?", "a": "L'ACV fournit une approche MULTI-CRITÈRES et transparente. C'est l'outil de référence pour évaluer les impacts environnementaux.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-214", "section": "10. Messages clés", "q": "Quel est le message clé n°3 selon Léonard ?", "a": "L'éco-conception doit être intégrée dès le DÉBUT de tout projet technique. C'est à la conception qu'on agit le plus efficacement.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-215", "section": "10. Messages clés", "q": "Quel est le message clé n°4 selon Léonard ?", "a": "L'ingénieur joue un rôle CLÉ dans la transition écologique. Choix techniques + intégration des critères environnementaux dès la conception.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-216", "section": "10. Messages clés", "q": "Quels sont les 4 piliers méthodologiques de Léonard pour évaluer l'environnement ?", "a": "1) Empreinte carbone (mono-critère climat). 2) ACV (multi-critères, normes ISO 14040/44). 3) Éco-conception (préventive, multi-étapes). 4) EPD/écolabels (communication standardisée).", "chapter": "Partie 2 — Léonard"}, {"id": "p2-217", "section": "10. Messages clés", "q": "Quels sont les 4 grands cas d'étude vus avec Léonard ?", "a": "1) Plastiques fossiles (chaîne de l'éthylène). 2) Plastiques biosourcés (PLA, Bio-PE, MTO). 3) Fin de vie des plastiques. 4) Ammoniac et Haber-Bosch.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-218", "section": "10. Messages clés", "q": "Quel rôle particulier joue l'ingénieur dans la conception durable selon Léonard ?", "a": "Il fait les choix techniques qui déterminent l'impact environnemental du produit pour toute sa vie. Doit intégrer les critères environnementaux dès la conception, pas seulement après.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-219", "section": "10. Messages clés", "q": "Quelle différence entre 'corriger en aval' et 'éco-concevoir' ?", "a": "Corriger en aval : filtres, traitement des fumées, recyclage des déchets après production. Éco-concevoir : éviter dès la conception la création des impacts. Beaucoup plus efficace.", "chapter": "Partie 2 — Léonard"}, {"id": "p2-220", "section": "10. Messages clés", "q": "Quel impact a une démarche éco-conception au-delà de l'environnement ?", "a": "Économies de matière/énergie (réduction des coûts), conformité réglementaire anticipée, accès aux marchés publics, image de marque, fidélisation des clients sensibilisés.", "chapter": "Partie 2 — Léonard"}, {"id": "p3-1", "section": "1. Contexte & 3R", "q": "Que signifie l'acronyme 3R ?", "a": "Reduce, Reuse, Recycle (Réduire, Réutiliser, Recycler). C'est la base de la hiérarchie de gestion des déchets.", "chapter": "Partie 3 — Courard"}, {"id": "p3-2", "section": "1. Contexte & 3R", "q": "Que signifie l'acronyme 6R (extension des 3R) ?", "a": "Refuse, Reduce, Repair, Reuse, Recycle, Rot (Refuser, Réduire, Réparer, Réutiliser, Recycler, Composter). Version élargie des 3R intégrant la prévention et le compostage.", "chapter": "Partie 3 — Courard"}, {"id": "p3-3", "section": "1. Contexte & 3R", "q": "Quels sont les 4 grands impacts du secteur de la construction ?", "a": "1) ~40% de la consommation d'énergie. 2) 40-50% de la consommation de ressources primaires. 3) ~40% des émissions de CO2. 4) ~50% de la production de déchets.", "chapter": "Partie 3 — Courard"}, {"id": "p3-4", "section": "1. Contexte & 3R", "q": "Quelle part des matières extraites mondialement est consommée par la construction ?", "a": "35 à 40% des matières extraites. C'est l'un des secteurs les plus gourmands en ressources naturelles.", "chapter": "Partie 3 — Courard"}, {"id": "p3-5", "section": "1. Contexte & 3R", "q": "Quel objectif européen pour le recyclage des CDW ?", "a": "Récupérer 70% des déchets de construction et démolition (CDW) à l'horizon 2020. Imposé par la directive 2008/98/EC.", "chapter": "Partie 3 — Courard"}, {"id": "p3-6", "section": "1. Contexte & 3R", "q": "Que signifie CDW dans le contexte du cours ?", "a": "Construction & Demolition Waste : déchets générés par la construction, la rénovation et la démolition des bâtiments et infrastructures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-7", "section": "1. Contexte & 3R", "q": "Quel volume de CDW est produit annuellement en UE27+UK+EFTA (2022) ?", "a": "Environ 3 milliards de tonnes par an (UEPG 2023). C'est l'un des flux de déchets les plus importants.", "chapter": "Partie 3 — Courard"}, {"id": "p3-8", "section": "1. Contexte & 3R", "q": "Combien de kg de C&DW par habitant en UE28 ?", "a": "Environ 1725 kg/habitant/an. Quantité comparable à celle des matières premières consommées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-9", "section": "2. Réemploi & démantèlement", "q": "Quelle est la différence entre démantèlement et démolition ?", "a": "Démantèlement : démontage soigné pour réemploi des éléments. Démolition : destruction qui détruit les éléments. Le démantèlement permet le réemploi, la démolition seulement le recyclage matière.", "chapter": "Partie 3 — Courard"}, {"id": "p3-10", "section": "2. Réemploi & démantèlement", "q": "Comment l'UE définit-elle le RÉEMPLOI (reuse) ?", "a": "Réemploi = utiliser un produit ou son emballage sans le modifier, après un processus de retour ou de collecte. Pas de transformation du matériau.", "chapter": "Partie 3 — Courard"}, {"id": "p3-11", "section": "2. Réemploi & démantèlement", "q": "Comment l'UE définit-elle la RÉUTILISATION ?", "a": "Réutilisation = utiliser un produit pour un usage différent de celui d'origine, sans modification significative. Ex : transformer un bâtiment industriel en lieu culturel.", "chapter": "Partie 3 — Courard"}, {"id": "p3-12", "section": "2. Réemploi & démantèlement", "q": "Donne un exemple de réemploi d'éléments structurels en construction.", "a": "Projet NEST à Dübendorf (Suisse) ou la passerelle Re:Crete à l'EPFL : structures en béton récupéré. Le réemploi évite la fabrication d'éléments neufs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-13", "section": "2. Réemploi & démantèlement", "q": "Qu'est-ce qu'une 'banque de ponts' ?", "a": "Plateforme regroupant des ponts ou éléments structurels en fin de vie disponibles pour réemploi (ex : Nationale Bruggenbank aux Pays-Bas).", "chapter": "Partie 3 — Courard"}, {"id": "p3-14", "section": "2. Réemploi & démantèlement", "q": "Qu'est-ce que l'économie du partage (sharing economy) ?", "a": "Modèle économique basé sur la fourniture d'un USAGE ou d'une PERFORMANCE d'un bien plutôt que sur sa propriété. Favorise durabilité, réemploi et création de valeur immatérielle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-15", "section": "2. Réemploi & démantèlement", "q": "Définis l'économie de la fonctionnalité.", "a": "Modèle où le vendeur reste PROPRIÉTAIRE du bien tout au long de son cycle de vie. Le client paie pour l'usage ou la performance, pas pour la possession.", "chapter": "Partie 3 — Courard"}, {"id": "p3-16", "section": "2. Réemploi & démantèlement", "q": "Quels sont les 3 principes de l'économie de la fonctionnalité ?", "a": "1) Sobriété matérielle & durabilité (réduire, prolonger, réemployer). 2) Création de valeur immatérielle (compétences, santé, relations). 3) Coopération territoriale (collaboration locale).", "chapter": "Partie 3 — Courard"}, {"id": "p3-17", "section": "2. Réemploi & démantèlement", "q": "Quels sont les 3 leviers majeurs de la transition écologique en construction ?", "a": "1) Sobriété (modération d'usage et immobilière). 2) Efficacité (rénovation et constructions performantes). 3) Décarbonation et circularité (matériaux + énergie).", "chapter": "Partie 3 — Courard"}, {"id": "p3-18", "section": "2. Réemploi & démantèlement", "q": "Que recouvre le levier 'sobriété' en construction ?", "a": "Modération d'usage (consommer moins) et modération immobilière (construire moins, plus petit, mieux). Premier levier dans la hiérarchie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-19", "section": "2. Réemploi & démantèlement", "q": "Que recouvre le levier 'efficacité' en construction ?", "a": "Rénovation énergétique du résidentiel et du tertiaire, construction neuve performante. Améliore les bâtiments existants et nouveaux.", "chapter": "Partie 3 — Courard"}, {"id": "p3-20", "section": "2. Réemploi & démantèlement", "q": "Que recouvre le levier 'décarbonation & circularité' ?", "a": "Matériaux plus performants environnementalement, circularité des produits/matériaux, décarbonation de l'énergie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-21", "section": "3. Pathologies des matériaux", "q": "Que provoque le réchauffement des matériaux sur leurs liaisons chimiques ?", "a": "Il peut entraîner la rupture de liaisons chimiques, causant une dégradation progressive. Vrai pour les polymères et de nombreux autres matériaux.", "chapter": "Partie 3 — Courard"}, {"id": "p3-22", "section": "3. Pathologies des matériaux", "q": "Pourquoi sélectionne-t-on les matériaux selon les conditions environnementales ?", "a": "Parce que l'environnement a un effet DIRECT sur les performances et la durabilité des matériaux, souvent négatif. Le bon choix prolonge la durée de vie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-23", "section": "3. Pathologies des matériaux", "q": "Quels sont les 2 principaux agents biologiques agressant le bois ?", "a": "1) Insectes xylophages (termites, capricornes). 2) Champignons (ex : mérule, qui est un champignon lignivore). Dégradation par consommation biologique du matériau.", "chapter": "Partie 3 — Courard"}, {"id": "p3-24", "section": "3. Pathologies des matériaux", "q": "Quels traitements préventifs pour protéger le bois ?", "a": "Imprégnation par autoclave, huiles naturelles, ventilation des structures (éviter humidité), conception adaptée (éviter stagnation d'eau).", "chapter": "Partie 3 — Courard"}, {"id": "p3-25", "section": "3. Pathologies des matériaux", "q": "Qu'est-ce que la mérule ?", "a": "Champignon lignivore (qui consomme la lignine du bois). Provoque la pourriture cubique du bois. Très destructeur, surtout dans les pièces humides mal ventilées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-26", "section": "3. Pathologies des matériaux", "q": "Comment l'ozone dégrade-t-il les polymères/caoutchouc ?", "a": "L'ozone casse les liaisons chimiques C=C des polymères, créant des microfissures et une perte d'élasticité. Phénomène appelé photovieillissement quand UV+ozone combinés.", "chapter": "Partie 3 — Courard"}, {"id": "p3-27", "section": "3. Pathologies des matériaux", "q": "Quels facteurs dégradent les polymères et caoutchoucs ?", "a": "Ozone, oxygène et rayons UV. Le photovieillissement résulte de leur action combinée. Conséquence : matériaux cassants, fissurés, non recyclables.", "chapter": "Partie 3 — Courard"}, {"id": "p3-28", "section": "3. Pathologies des matériaux", "q": "Qu'est-ce que le fluage d'un bitume ?", "a": "Déformation lente et continue sous charge constante. Accentué à haute température. Crée des ornières (sillons) dans les chaussées à fort trafic.", "chapter": "Partie 3 — Courard"}, {"id": "p3-29", "section": "3. Pathologies des matériaux", "q": "Comment vieillit un bitume par oxydation ?", "a": "Le bitume durcit en surface par oxydation (perte des composés volatils + transformation des chaînes hydrocarbonées). Les enrobés deviennent cassants et fissurés.", "chapter": "Partie 3 — Courard"}, {"id": "p3-30", "section": "3. Pathologies des matériaux", "q": "Pourquoi le béton est-il sensible aux cycles gel/dégel ?", "a": "C'est un matériau POREUX : l'eau s'infiltre dans les pores, gèle et augmente de volume de 9 à 10%. Cela crée des pressions internes qui fissurent et éclatent progressivement le béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-31", "section": "3. Pathologies des matériaux", "q": "Comment les sels de déverglaçage aggravent-ils la dégradation du béton ?", "a": "Le NaCl (et CaCl2) abaisse le point de congélation de l'eau, ce qui multiplie les cycles gel/dégel. Ils augmentent aussi l'agressivité chimique sur les armatures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-32", "section": "3. Pathologies des matériaux", "q": "Quels sont les risques chimiques pour le béton ?", "a": "Effets chimiques des ions sulfates et des sels (NaCl, CaCl2) sur les routes : accélération de la dégradation. Corrosion des armatures par carbonatation ou pénétration des chlorures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-33", "section": "3. Pathologies des matériaux", "q": "Qu'est-ce qu'une efflorescence sur céramique ou pierre ?", "a": "Tache blanche en surface causée par la remontée capillaire d'eau chargée en sels solubles, qui cristallisent à l'évaporation. Provoque taches, décollements, altération esthétique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-34", "section": "3. Pathologies des matériaux", "q": "Pourquoi les céramiques/pierres sont-elles sensibles aux cycles gel/dégel ?", "a": "Comme le béton, elles sont poreuses. L'eau infi
