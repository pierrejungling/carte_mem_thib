ltrée dans les pores gèle et augmente de volume, créant des microfissures par expansion.", "chapter": "Partie 3 — Courard"}, {"id": "p3-35", "section": "3. Pathologies des matériaux", "q": "Qu'est-ce que le 'calcin' (croûte noire) sur la pierre calcaire ?", "a": "Croûte noire de gypse formée à la surface des monuments en pierre calcaire en milieu urbain pollué. Résulte de la réaction entre SOx (gaz d'échappement) et CaCO3.", "chapter": "Partie 3 — Courard"}, {"id": "p3-36", "section": "3. Pathologies des matériaux", "q": "Quelle est la réaction chimique de formation du calcin ?", "a": "CaCO3 + SO3 + H2O → CaSO4·2H2O + CO2. Le calcaire réagit avec les SOx atmosphériques pour former du gypse (CaSO4·2H2O), responsable de la croûte noire.", "chapter": "Partie 3 — Courard"}, {"id": "p3-37", "section": "3. Pathologies des matériaux", "q": "Quels sont les risques principaux des métaux dans l'environnement ?", "a": "La corrosion (oxydation électrochimique en présence d'eau + O2). Aggravée par milieux salins, atmosphères industrielles ou acides.", "chapter": "Partie 3 — Courard"}, {"id": "p3-38", "section": "3. Pathologies des matériaux", "q": "Cite 3 préventions contre la corrosion des métaux.", "a": "1) Galvanisation (revêtement de zinc). 2) Peintures anticorrosion. 3) Anodisation (pour l'aluminium). Aussi : choix d'aciers inox dans les environnements agressifs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-39", "section": "4. Durée de vie des structures", "q": "Comment définit-on la durée de vie d'un matériau ?", "a": "Par la PERTE PROGRESSIVE de propriétés. On l'exprime en termes de propriétés minimales que le matériau doit toujours posséder après x années de service.", "chapter": "Partie 3 — Courard"}, {"id": "p3-40", "section": "4. Durée de vie des structures", "q": "Quelle est la différence entre dégradation continue et choc ?", "a": "Dégradation continue : pertes de performances progressives au cours du temps. Choc (séisme, tornade, surcharge) : perte brutale de performances, événement exceptionnel.", "chapter": "Partie 3 — Courard"}, {"id": "p3-41", "section": "4. Durée de vie des structures", "q": "Comment prolonger la durée de vie d'une structure dès la conception ?", "a": "Améliorer les performances INITIALES (passer de P1 à P2). Ex : augmenter le diamètre d'un élément structurel peut prolonger sa durée de vie de 30 ans.", "chapter": "Partie 3 — Courard"}, {"id": "p3-42", "section": "4. Durée de vie des structures", "q": "Quel est l'effet d'une protection supplémentaire (TV3) ?", "a": "Elle ralentit la dégradation et prolonge la durée de vie totale. Exemple : revêtement protecteur sur acier, hydrofuge sur béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-43", "section": "4. Durée de vie des structures", "q": "Quelle est la différence entre restauration et renforcement ?", "a": "Restauration : on remonte la propriété P' au niveau P''. Renforcement : on remonte P' au niveau P''' supérieur à l'origine. Les deux prolongent la durée de vie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-44", "section": "4. Durée de vie des structures", "q": "Quelle est la hiérarchie d'actions pour une structure dégradée ?", "a": "1) Ne rien faire un temps. 2) Réanalyser la capacité (downgrading). 3) Prévenir/réduire la dégradation future. 4) Améliorer/renforcer. 5) Reconstruire en partie. 6) Démolir. La démolition est la DERNIÈRE option.", "chapter": "Partie 3 — Courard"}, {"id": "p3-45", "section": "4. Durée de vie des structures", "q": "Pourquoi la réparation est-elle préférée à la démolition ?", "a": "Elle prolonge la durée de vie ET économise de la matière première neuve. La démolition génère des déchets et exige de nouveaux matériaux pour reconstruire.", "chapter": "Partie 3 — Courard"}, {"id": "p3-46", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de bois est consommée mondialement par an ?", "a": "Environ 4 milliards de m³ de bois/an, dont 2 milliards de m³ destinés à la construction. Le bois est un matériau RENOUVELABLE, à la différence du béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-47", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de graviers est consommée mondialement par an ?", "a": "Environ 4,7 milliards de tonnes/an. Soit l'équivalent d'environ 670 pyramides de Khéops.", "chapter": "Partie 3 — Courard"}, {"id": "p3-48", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de sable est consommée mondialement par an ?", "a": "Environ 2,2 milliards de tonnes/an. Équivalent à un train de 22 millions de wagons (264 000 km de long).", "chapter": "Partie 3 — Courard"}, {"id": "p3-49", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de ciment est consommée mondialement par an ?", "a": "Environ 1,3 milliard de tonnes/an. C'est le composant le plus énergivore du béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-50", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité d'eau est consommée mondialement par le BTP ?", "a": "Environ 800 milliards de litres/an. Équivalent à 23 fois le débit journalier de la Seine à Paris.", "chapter": "Partie 3 — Courard"}, {"id": "p3-51", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de béton est consommée mondialement par an ?", "a": "Environ 9 milliards de tonnes/an. C'est le matériau le plus utilisé au monde après l'eau.", "chapter": "Partie 3 — Courard"}, {"id": "p3-52", "section": "5. Consommation & déchets BTP", "q": "Quelle est la tendance de consommation des granulats en Europe ?", "a": "Tendance à la baisse : de 3,69 Gt à 2,85 Gt/an. Production basée sur ~26 000 carrières exploitées par ~15 000 entreprises.", "chapter": "Partie 3 — Courard"}, {"id": "p3-53", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité de déchets a chaque habitant UE généré en 2022 ?", "a": "Environ 5 tonnes de déchets par habitant. C'est la moyenne UE, tous types confondus (hors gros déchets minéraux séparés).", "chapter": "Partie 3 — Courard"}, {"id": "p3-54", "section": "5. Consommation & déchets BTP", "q": "Quel taux de recyclage et d'enfouissement en UE en 2022 ?", "a": "40,8% des déchets recyclés et 30,2% enfouis. Le reste est valorisé énergétiquement ou autre.", "chapter": "Partie 3 — Courard"}, {"id": "p3-55", "section": "5. Consommation & déchets BTP", "q": "Quel taux de recyclage des déchets municipaux UE en 2023 ?", "a": "48% des déchets municipaux recyclés en 2023, contre seulement 37% en 2013. Forte amélioration sur 10 ans.", "chapter": "Partie 3 — Courard"}, {"id": "p3-56", "section": "5. Consommation & déchets BTP", "q": "Comparaison déchets ménagers 1995 vs aujourd'hui ?", "a": "1995 : ~530 kg/hab/an, 30% recyclés, 70% enfouis. Aujourd'hui : quantité similaire ~550 kg/hab/an MAIS 70% recyclés, 30% enfouis. Tendance INVERSÉE.", "chapter": "Partie 3 — Courard"}, {"id": "p3-57", "section": "5. Consommation & déchets BTP", "q": "Quelle quantité totale de déchets BTP est produite annuellement dans le monde ?", "a": "Entre 3,4 et 4 milliards de tonnes/an, soit 80 à 126 tonnes/seconde. Chaque jour, l'humanité génère >10 milliards de kg de déchets.", "chapter": "Partie 3 — Courard"}, {"id": "p3-58", "section": "5. Consommation & déchets BTP", "q": "Quel est le lien entre PIB et quantité de déchets ?", "a": "La quantité de déchets est CORRÉLÉE au PIB : plus le PIB augmente, plus les déchets augmentent. Reflet du niveau de consommation matérielle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-59", "section": "5. Consommation & déchets BTP", "q": "Qu'est-ce qu'un déchet ultime ?", "a": "Produit en fin de cycle de vie SANS possibilité de revalorisation. Destiné uniquement à l'enfouissement définitif.", "chapter": "Partie 3 — Courard"}, {"id": "p3-60", "section": "5. Consommation & déchets BTP", "q": "Comment le tri transforme-t-il un déchet ?", "a": "Le tri permet de transformer un déchet en RESSOURCE POTENTIELLE en le séparant en flux homogènes valorisables.", "chapter": "Partie 3 — Courard"}, {"id": "p3-61", "section": "5. Consommation & déchets BTP", "q": "Que représentent 5 tonnes de déchets/habitant/an ?", "a": "C'est la valeur incluant les déchets minéraux (BTP, mines). Sans ces déchets : ~500-550 kg/hab/an. Les minéraux représentent l'essentiel en masse.", "chapter": "Partie 3 — Courard"}, {"id": "p3-62", "section": "5. Consommation & déchets BTP", "q": "Que sont les centres de stockage envisagés comme 'mines secondaires' ?", "a": "Centres où des déchets sont stockés en attendant l'évolution technologique permettant leur revalorisation future. Ex : cendres volantes stockées il y a 30 ans, valorisées aujourd'hui.", "chapter": "Partie 3 — Courard"}, {"id": "p3-63", "section": "5. Consommation & déchets BTP", "q": "Production annuelle mondiale de granulats recyclés (2019) ?", "a": "Environ 278 millions de tonnes. Représente ~9,3% du total des granulats utilisés (UEPG 2021).", "chapter": "Partie 3 — Courard"}, {"id": "p3-64", "section": "6. Granulats & recyclage", "q": "Quelle est la composition typique des granulats utilisés en Europe ?", "a": "46,9% roche concassée, 39,7% sable & gravier, 9,3% granulats recyclés (278 Mt), plus une fraction mixte (béton).", "chapter": "Partie 3 — Courard"}, {"id": "p3-65", "section": "6. Granulats & recyclage", "q": "Quels pays produisent la majorité des granulats recyclés en Europe ?", "a": "Les pays d'Europe du Nord-Ouest : Belgique, Allemagne, France, Pays-Bas, Royaume-Uni. Ensemble : 89% (248,4 Mt) des granulats recyclés européens.", "chapter": "Partie 3 — Courard"}, {"id": "p3-66", "section": "6. Granulats & recyclage", "q": "Quelle part de la production de granulats vierges représentent les pays NWE ?", "a": "Les pays Northwestern Europe (BE, DE, FR, NL, UK) produisent 47% des granulats vierges européens (1417 Mt).", "chapter": "Partie 3 — Courard"}, {"id": "p3-67", "section": "6. Granulats & recyclage", "q": "Quel pourcentage de granulats recyclés en Belgique ?", "a": "Environ 30% des granulats utilisés en Belgique proviennent du recyclage. C'est l'un des taux les plus élevés d'Europe.", "chapter": "Partie 3 — Courard"}, {"id": "p3-68", "section": "6. Granulats & recyclage", "q": "Pourquoi le taux de recyclage est-il plus élevé en Flandre qu'en Wallonie ?", "a": "Wallonie : beaucoup de massifs rocheux → granulats naturels accessibles partout, peu d'intérêt au recyclage. Flandre : peu de carrières, riche en sable, transport coûteux → favorise le recyclage local.", "chapter": "Partie 3 — Courard"}, {"id": "p3-69", "section": "6. Granulats & recyclage", "q": "Sur quel facteur économique repose le recyclage des granulats ?", "a": "Sur la disponibilité locale des matières premières naturelles. Le recyclage devient économiquement intéressant quand les ressources naturelles sont éloignées ou coûteuses à transporter.", "chapter": "Partie 3 — Courard"}, {"id": "p3-70", "section": "6. Granulats & recyclage", "q": "Exemple d'écart régional : Anvers vs Luxembourg en consommation/distance ?", "a": "Anvers : consomme 102 Mt avec distance moyenne de 13,78 km. Luxembourg (province belge) : ne consomme que 38 Mt avec 0,59 km. Reflet de la densité urbaine et des besoins.", "chapter": "Partie 3 — Courard"}, {"id": "p3-71", "section": "6. Granulats & recyclage", "q": "Combien d'années dure le bâti européen en moyenne ?", "a": "En Belgique, environ 70% du bâti est plus ancien que 1970. Beaucoup de bâtiments en fin de vie technique, source potentielle d'urban mining via démolition.", "chapter": "Partie 3 — Courard"}, {"id": "p3-72", "section": "6. Granulats & recyclage", "q": "Évolution de l'extraction de matériaux non métalliques sur 50 ans ?", "a": "Elle a été multipliée par 5 environ. Représente maintenant près de la moitié de l'extraction totale (42,8 Gt).", "chapter": "Partie 3 — Courard"}, {"id": "p3-73", "section": "6. Granulats & recyclage", "q": "Quel est l'enjeu de l'addition vs déplétion du stock de matériaux ?", "a": "En 2018 : 43,6 Gt de matériaux ajoutés (extraction) contre 12 Gt déplétés (recyclage/réemploi). Addition nette : 32,8 Gt. Les stocks de construction ont été multipliés par 23 au 21e siècle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-74", "section": "6. Granulats & recyclage", "q": "Que sont les types A et B de granulats recyclés (NBN EN 206) ?", "a": "Type A : granulats de béton (concrete aggregates). Type B : granulats mixtes (mix aggregates). Définis pour granulométries d > 4 mm.", "chapter": "Partie 3 — Courard"}, {"id": "p3-75", "section": "6. Granulats & recyclage", "q": "Critères pour granulats recyclés A+ (NBN B 15-001) ?", "a": "d ≥ 4 mm et D ≥ 10 mm. Densité min : 2200 kg/m³. Absorption d'eau max : 10% ± 2%. Utilisables en béton ≤ C30/37.", "chapter": "Partie 3 — Courard"}, {"id": "p3-76", "section": "6. Granulats & recyclage", "q": "Critères pour granulats recyclés B+ (NBN B 15-001) ?", "a": "d ≥ 4 mm et D ≥ 10 mm. Densité min : 1700 kg/m³. Absorption d'eau max : 15% ± 2%. Utilisables en béton ≤ C25/30.", "chapter": "Partie 3 — Courard"}, {"id": "p3-77", "section": "6. Granulats & recyclage", "q": "Que veut dire 'CE2+' pour les granulats recyclés ?", "a": "Certification européenne avec statut 'end-of-waste' (fin de statut de déchet). Avec fiche technique + déclaration de performance. Permet l'usage du granulat recyclé comme un granulat classique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-78", "section": "6. Granulats & recyclage", "q": "Quels sont les indices clés pour caractériser un granulat ?", "a": "FI : indice d'aplatissement (flakiness). f : teneur en fines. LA : coefficient Los Angeles (résistance à la fragmentation). SS : sulfates solubles. A : modification du temps de prise. Rc/Ru/Ra/XRg/FL : compositions.", "chapter": "Partie 3 — Courard"}, {"id": "p3-79", "section": "6. Granulats & recyclage", "q": "Que mesure le test Los Angeles (LA) ?", "a": "Résistance d'un granulat à la fragmentation par impact. Plus le coefficient est faible, plus le granulat est résistant. LA35 = max 35% de fragmentation.", "chapter": "Partie 3 — Courard"}, {"id": "p3-80", "section": "6. Granulats & recyclage", "q": "Que mesure le test Micro-Deval (MDE) ?", "a": "Résistance d'un granulat à l'usure et l'abrasion (test sec et humide). Plus la valeur est faible, plus le granulat résiste à l'usure mécanique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-81", "section": "7. Conditions pour le recyclage", "q": "Quelles sont les 4 applications principales des matériaux recyclés ?", "a": "1) Matériaux de remblai (low requirements). 2) Granulats (qualité requise élevée). 3) Liants (propriétés stables, spécifications précises). 4) Activateurs (petites quantités, problèmes de logistique).", "chapter": "Partie 3 — Courard"}, {"id": "p3-82", "section": "7. Conditions pour le recyclage", "q": "Quel est le rôle des matériaux de REMBLAI ?", "a": "Servir de masse de support consommée en grande quantité, avec des exigences techniques basses. Pour talus, embankments. Transportable sur courtes distances seulement (coûts).", "chapter": "Partie 3 — Courard"}, {"id": "p3-83", "section": "7. Conditions pour le recyclage", "q": "Quels matériaux peuvent jouer le rôle de granulat recyclé ?", "a": "Granulats nécessitant une haute qualité pour atteindre des produits finis de qualité identique aux matériaux traditionnels. Ex : béton concassé, briques broyées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-84", "section": "7. Conditions pour le recyclage", "q": "Pourquoi les LIANTS recyclés sont-ils plus exigeants techniquement ?", "a": "Spécifications très précises requises. Les propriétés doivent rester CONSTANTES dans le temps. Sinon, risque de défaillance structurelle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-85", "section": "7. Conditions pour le recyclage", "q": "Quels sont les 5 freins majeurs au recyclage en construction ?", "a": "1) Transport (>30-35 km non rentable). 2) Normes (exigences strictes). 3) Techniques (propriétés constantes requises). 4) Logistique/économie (approvisionnement variable). 5) Impact environnemental (LCA nécessaire).", "chapter": "Partie 3 — Courard"}, {"id": "p3-86", "section": "7. Conditions pour le recyclage", "q": "Pourquoi le transport est-il un frein majeur au recyclage ?", "a": "L'industrie de la construction est LOCALE. Au-delà de 30-35 km, le transport coûte plus que la valeur de la matière. La valeur des granulats recyclés est faible : peu de distance rentable.", "chapter": "Partie 3 — Courard"}, {"id": "p3-87", "section": "7. Conditions pour le recyclage", "q": "Quand le recyclage devient-il économiquement attractif (transport) ?", "a": "1) Quand l'enfouissement est loin. 2) Quand la taxe d'enfouissement est élevée. 3) Quand les matières premières naturelles sont coûteuses ou difficiles à approvisionner.", "chapter": "Partie 3 — Courard"}, {"id": "p3-88", "section": "7. Conditions pour le recyclage", "q": "Pourquoi les normes freinent-elles le recyclage ?", "a": "Conçues pour des matériaux STANDARDS. Les recyclés/alternatifs n'ont pas de référentiels établis. Sans normes, les prescripteurs (architectes, ingénieurs) hésitent à les utiliser, par peur de risques structurels ou juridiques.", "chapter": "Partie 3 — Courard"}, {"id": "p3-89", "section": "7. Conditions pour le recyclage", "q": "Quel est le 'cercle vicieux' des normes en recyclage ?", "a": "Tant que les matériaux recyclés ne sont pas utilisés à grande échelle, les industriels n'investissent pas pour faire évoluer les normes. Mais sans normes, les matériaux ne sont pas utilisés à grande échelle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-90", "section": "7. Conditions pour le recyclage", "q": "Quels critères techniques essentiels pour un matériau recyclé ?", "a": "Propriétés constantes au cours du temps (résistance, performance minimale). Variabilité = risque pour les ouvrages.", "chapter": "Partie 3 — Courard"}, {"id": "p3-91", "section": "7. Conditions pour le recyclage", "q": "Pourquoi la logistique pose-t-elle problème pour les matériaux recyclés ?", "a": "Approvisionnement difficile à garantir constant : contrairement aux carrières, les déchets sont IMPRÉVISIBLES en quantité et qualité.", "chapter": "Partie 3 — Courard"}, {"id": "p3-92", "section": "7. Conditions pour le recyclage", "q": "Pourquoi l'impact environnemental doit-il être analysé (LCA) ?", "a": "Le recyclage n'est pas toujours meilleur que la production primaire : transport, énergie de traitement, qualité dégradée. Une ACV est nécessaire pour valider les bénéfices.", "chapter": "Partie 3 — Courard"}, {"id": "p3-93", "section": "7. Conditions pour le recyclage", "q": "Recommandation pour les marchés publics en recyclage ?", "a": "Introduire des POURCENTAGES OBLIGATOIRES de granulats recyclés dans les grands projets d'ingénierie civile. Aussi : interdire l'enfouissement et améliorer les statistiques de suivi.", "chapter": "Partie 3 — Courard"}, {"id": "p3-94", "section": "8. Matériaux biosourcés", "q": "Qu'est-ce qu'un matériau biosourcé ?", "a": "Matériau composé de BIOMASSE et qui peut être continuellement reconstitué (norme EN 16575:2014). Origine végétale ou animale.", "chapter": "Partie 3 — Courard"}, {"id": "p3-95", "section": "8. Matériaux biosourcés", "q": "Qu'est-ce qu'une ressource renouvelable ?", "a": "Ressource dont le taux de prélèvement est inférieur à son taux de régénération naturelle. Elle se reconstitue à l'échelle humaine (années, décennies).", "chapter": "Partie 3 — Courard"}, {"id": "p3-96", "section": "8. Matériaux biosourcés", "q": "Quel est l'objectif % de biosourcés dans les bâtiments ?", "a": "Objectif : 75% de matériaux biosourcés (hors routes). Situation actuelle : moins de 30%.", "chapter": "Partie 3 — Courard"}, {"id": "p3-97", "section": "8. Matériaux biosourcés", "q": "Évolution de la part de biomasse dans la construction (XXe vs XXIe siècle) ?", "a": "Début XXe : <30% de matières premières issues de biomasse (économie minérale dominante). Début XXIe : objectif >75% (économie biosourcée), facteur x8.", "chapter": "Partie 3 — Courard"}, {"id": "p3-98", "section": "8. Matériaux biosourcés", "q": "Pourquoi les biosourcés captent-ils du CO2 ?", "a": "Pendant leur croissance, les plantes absorbent du CO2 par photosynthèse. Ce carbone reste STOCKÉ dans le matériau tant qu'il n'est pas brûlé ou décomposé.", "chapter": "Partie 3 — Courard"}, {"id": "p3-99", "section": "8. Matériaux biosourcés", "q": "Cite 4 exemples de matériaux biosourcés en construction.", "a": "1) Bois (massif ou lamellé-collé). 2) Terre crue (argile + sable + limon). 3) Paille. 4) Isolants : chanvre, lin, laine de bois, ouate de cellulose, liège.", "chapter": "Partie 3 — Courard"}, {"id": "p3-100", "section": "8. Matériaux biosourcés", "q": "Quels avantages du bois en structure ?", "a": "Renouvelable, faible énergie grise (180 kWh/m³), stocke du CO2. Utilisable en ossature, charpente, parement. Structures durables (ex : Abri 2000 à Rendeux).", "chapter": "Partie 3 — Courard"}, {"id": "p3-101", "section": "8. Matériaux biosourcés", "q": "Quels avantages de la terre crue ?", "a": "Faible impact carbone. Haute capacité hygroscopique : régule naturellement l'humidité ambiante. Technique ancienne remise au goût du jour.", "chapter": "Partie 3 — Courard"}, {"id": "p3-102", "section": "8. Matériaux biosourcés", "q": "Cite 4 isolants biosourcés.", "a": "1) Laine de bois. 2) Ouate de cellulose (papier recyclé). 3) Liège expansé. 4) Chanvre / lin / coton recyclé. Alternatives aux laines minérales énergivores.", "chapter": "Partie 3 — Courard"}, {"id": "p3-103", "section": "8. Matériaux biosourcés", "q": "Énergie grise d'un isolant à base de cellulose de bois ?", "a": "Environ 50 kWh/m³. C'est l'un des isolants les moins énergivores. Comparaison : polystyrène expansé = 450 kWh/m³.", "chapter": "Partie 3 — Courard"}, {"id": "p3-104", "section": "8. Matériaux biosourcés", "q": "Quels sont les 3 codes couleur des isolants (Oliva & Courgey) ?", "a": "VERT : isolants 'puits de carbone' peu transformés ou denses. JAUNE : isolants neutres carbone à base de fibres végétales. ROUGE : isolants à très mauvaise empreinte (minéraux et synthétiques).", "chapter": "Partie 3 — Courard"}, {"id": "p3-105", "section": "8. Matériaux biosourcés", "q": "Pourquoi favoriser des matériaux locaux et biosourcés ?", "a": "1) Réduction des émissions de GES. 2) Renouvellement des ressources. 3) Résilience locale (produire près de chez soi). 4) Stockage de carbone. 5) Faible énergie grise.", "chapter": "Partie 3 — Courard"}, {"id": "p3-106", "section": "9. Énergie grise", "q": "Définition de l'énergie grise.", "a": "Ensemble de l'énergie nécessaire à un matériau : extraction, transformation, transport, mise en œuvre et fin de vie. Exprimée en kWh/m³ ou kWh/tonne.", "chapter": "Partie 3 — Courard"}, {"id": "p3-107", "section": "9. Énergie grise", "q": "Quels facteurs sont pris en compte dans l'énergie grise ?", "a": "1) Machinerie d'extraction. 2) Carburants pour transport. 3) Électricité pour traitement. 4) Pétrole/énergie pour la production. C'est une approche cradle to gate.", "chapter": "Partie 3 — Courard"}, {"id": "p3-108", "section": "9. Énergie grise", "q": "Énergie grise typique : bois d'œuvre ?", "a": "Environ 180 kWh/m³. Très faible. C'est l'un des matériaux de construction les plus économes en énergie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-109", "section": "9. Énergie grise", "q": "Énergie grise typique : brique perforée ?", "a": "Environ 700 kWh/m³. Cuisson dans un four → consommation énergétique modérée à élevée.", "chapter": "Partie 3 — Courard"}, {"id": "p3-110", "section": "9. Énergie grise", "q": "Énergie grise typique : brique silico-calcaire ?", "a": "Environ 350 kWh/m³. Moins énergivore que la brique perforée car cuisson moins poussée.", "chapter": "Partie 3 — Courard"}, {"id": "p3-111", "section": "9. Énergie grise", "q": "Énergie grise typique : profilés en acier ?", "a": "Environ 57 000 kWh/m³. EXTRÊMEMENT énergivore, presque 300 fois plus que le bois d'œuvre. À cause des hauts fourneaux et de la sidérurgie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-112", "section": "9. Énergie grise", "q": "Énergie grise typique : polystyrène expansé ?", "a": "Environ 450 kWh/m³. Modéré pour un isolant. Comparé à la cellulose de bois : 9 fois plus.", "chapter": "Partie 3 — Courard"}, {"id": "p3-113", "section": "9. Énergie grise", "q": "Énergie grise typique : panneaux d'aggloméré ?", "a": "Environ 2000 kWh/m³ (liés avec résine formaldéhyde). Plus énergivore que le bois massif à cause de la résine.", "chapter": "Partie 3 — Courard"}, {"id": "p3-114", "section": "9. Énergie grise", "q": "Énergie grise typique : enduit synthétique ?", "a": "Environ 3300 kWh/m³. Très énergivore comparé à l'enduit ciment (1100 kWh/m³).", "chapter": "Partie 3 — Courard"}, {"id": "p3-115", "section": "9. Énergie grise", "q": "Quelle phase est la plus impactante pour les matériaux de construction ?", "a": "La phase de FABRICATION (extraction + transformation). C'est la plus impactante, donc à cibler pour réduire l'impact global.", "chapter": "Partie 3 — Courard"}, {"id": "p3-116", "section": "9. Énergie grise", "q": "Quelle phase est la plus impactante pour les transports ?", "a": "La phase d'UTILISATION (carburant, émissions sur la durée de service). À l'inverse des matériaux de construction.", "chapter": "Partie 3 — Courard"}, {"id": "p3-117", "section": "9. Énergie grise", "q": "Comment réduire l'impact d'un bâtiment via l'énergie grise ?", "a": "1) Alléger les structures. 2) Privilégier des matériaux à faible énergie grise (bois, biosourcés). 3) Utiliser des matériaux locaux ou recyclés. 4) Réduire la complexité.", "chapter": "Partie 3 — Courard"}, {"id": "p3-118", "section": "10. Industrie cimentière", "q": "Consommation annuelle de ciment en Belgique ?", "a": "Environ 7,3 millions de tonnes/an. Soit 634 kg par habitant/an. C'est l'un des taux les plus élevés d'Europe (source : FEBELCEM rapport annuel 2024).", "chapter": "Partie 3 — Courard"}, {"id": "p3-119", "section": "10. Industrie cimentière", "q": "Production mondiale annuelle de ciment ?", "a": "Chine : 2118 Mt. Europe : 176 Mt. La Chine domine LARGEMENT la production mondiale.", "chapter": "Partie 3 — Courard"}, {"id": "p3-120", "section": "10. Industrie cimentière", "q": "Part du ciment dans les émissions mondiales de CO2 ?", "a": "7 à 9% selon Courard (5 à 8% selon Pirard/Léonard). Émissions liées principalement à la production de clinker.", "chapter": "Partie 3 — Courard"}, {"id": "p3-121", "section": "10. Industrie cimentière", "q": "Quelles sont les 2 sources d'émissions de CO2 dans la production de ciment ?", "a": "1) DÉCARBONATATION du calcaire (CaCO3 → CaO + CO2) : émission inévitable. 2) COMBUSTION fossile pour produire la chaleur (~1450°C) : émission évitable par énergies alternatives.", "chapter": "Partie 3 — Courard"}, {"id": "p3-122", "section": "10. Industrie cimentière", "q": "Émission de CO2 par tonne de clinker ?", "a": "Environ 484 kg de CO2 par tonne de clinker produite. Décarbonatation seule = ~520 kg CO2/t.", "chapter": "Partie 3 — Courard"}, {"id": "p3-123", "section": "10. Industrie cimentière", "q": "Réaction de décarbonatation du calcaire ?", "a": "CaCO3 → CaO + CO2. Réaction à environ 900°C dans un four rotatif. Sources du CaCO3 en Belgique : tuffeau et craie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-124", "section": "10. Industrie cimentière", "q": "Définition d'un ciment (chimie) ?", "a": "Matériau finement broyé qui, mélangé à de l'eau, forme une pâte fluide capable de durcir SOUS L'EAU ou À L'AIR, en améliorant des substances appropriées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-125", "section": "10. Industrie cimentière", "q": "Qu'est-ce que l'hydraulicité d'un liant ?", "a": "Capacité d'un produit à prendre et durcir en présence d'eau, formant des composés stables. Caractéristique principale du ciment Portland.", "chapter": "Partie 3 — Courard"}, {"id": "p3-126", "section": "10. Industrie cimentière", "q": "Qu'est-ce qu'un liant hydraulique ?", "a": "Liant qui durcit en présence d'eau, sous l'eau ou à l'air. Forme une substance INSOLUBLE dans l'eau. Crée la cohésion entre les matériaux inertes (granulats).", "chapter": "Partie 3 — Courard"}, {"id": "p3-127", "section": "10. Industrie cimentière", "q": "Quel est le rôle du ciment dans le béton ?", "a": "Le ciment joue le rôle de LIANT : il induit la cohésion entre les matériaux inertes (sable, granulats) après hydratation.", "chapter": "Partie 3 — Courard"}, {"id": "p3-128", "section": "11. Procédé de fabrication du ciment", "q": "Quelles sont les 4 étapes industrielles de fabrication du ciment ?", "a": "1) Préchauffage et décarbonatation (calcaire → chaux). 2) Cuisson/clinkérisation dans four rotatif à 1450°C. 3) Refroidissement rapide (trempe). 4) Broyage fin (D90 < 80 µm).", "chapter": "Partie 3 — Courard"}, {"id": "p3-129", "section": "11. Procédé de fabrication du ciment", "q": "Pourquoi un refroidissement RAPIDE du clinker ?", "a": "Pour que ses phases restent AMORPHES (non cristallisées). Cela favorise la réactivité avec l'eau lors de l'hydratation ultérieure.", "chapter": "Partie 3 — Courard"}, {"id": "p3-130", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie D50 dans la granulométrie du ciment ?", "a": "Taille de grain telle que 50% du volume cumulé est atteint. C'est la taille médiane des particules.", "chapter": "Partie 3 — Courard"}, {"id": "p3-131", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie D90 dans la granulométrie du ciment ?", "a": "Taille telle que 90% des grains ont un diamètre INFÉRIEUR à cette valeur. Pour le ciment Portland : D90 < 80 µm.", "chapter": "Partie 3 — Courard"}, {"id": "p3-132", "section": "11. Procédé de fabrication du ciment", "q": "Quels sont les 4 oxydes majeurs du ciment ?", "a": "C = CaO (chaux). S = SiO2 (silice). A = Al2O3 (alumine). F = Fe2O3 (oxyde de fer). Notation conventionnelle de la chimie cimentière.", "chapter": "Partie 3 — Courard"}, {"id": "p3-133", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie la phase C3S du ciment ?", "a": "Silicate TRICALCIQUE (3 CaO·SiO2 ou Ca3SiO5). Phase la plus abondante (~50-70%). Donne la résistance précoce du ciment et libère beaucoup de chaleur lors de l'hydratation.", "chapter": "Partie 3 — Courard"}, {"id": "p3-134", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie la phase C2S du ciment ?", "a": "Silicate BICALCIQUE (2 CaO·SiO2 ou Ca2SiO4). Représente ~15-25%. Hydratation LENTE, contribue à la résistance long terme. Libère MOINS de chaleur que C3S.", "chapter": "Partie 3 — Courard"}, {"id": "p3-135", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie la phase C3A du ciment ?", "a": "Aluminate TRICALCIQUE (3 CaO·Al2O3). Hydratation très rapide. Sensible aux attaques sulfatiques. Les ciments à faible C3A résistent mieux aux eaux usées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-136", "section": "11. Procédé de fabrication du ciment", "q": "Que signifie la phase C4AF du ciment ?", "a": "Aluminoferrite TÉTRACALCIQUE (4 CaO·Al2O3·Fe2O3). Donne la couleur grise au ciment. Faible contribution à la résistance.", "chapter": "Partie 3 — Courard"}, {"id": "p3-137", "section": "11. Procédé de fabrication du ciment", "q": "Quelles 2 phases libèrent le plus de chaleur en s'hydratant ?", "a": "C3S (silicate tricalcique) et C3A (aluminate tricalcique). Causes principales de la chaleur d'hydratation, problématique pour les structures massives.", "chapter": "Partie 3 — Courard"}, {"id": "p3-138", "section": "11. Procédé de fabrication du ciment", "q": "Réaction d'hydratation du C3S ?", "a": "C3S + H2O → C-S-H + Ca(OH)2. Formation du gel C-S-H (silicate de calcium hydraté) qui donne la résistance, et libération de chaux Ca(OH)2.", "chapter": "Partie 3 — Courard"}, {"id": "p3-139", "section": "11. Procédé de fabrication du ciment", "q": "Réaction d'hydratation du C2S ?", "a": "C2S + H2O → C-S-H + Ca(OH)2. Même produit final que C3S, mais réaction PLUS LENTE et libérant MOINS de chaleur. Contribue à la résistance long terme.", "chapter": "Partie 3 — Courard"}, {"id": "p3-140", "section": "11. Procédé de fabrication du ciment", "q": "Qu'est-ce que le C-S-H ?", "a": "Gel de silicate de calcium hydraté. Phase principale donnant sa résistance au béton durci. Forme un réseau lié microscopiquement à partir des phases C3S et C2S.", "chapter": "Partie 3 — Courard"}, {"id": "p3-141", "section": "12. Substituts au clinker", "q": "Quels sont les types de ciments selon la norme EN 197-1 ?", "a": "CEM I : 100% clinker (Portland). CEM II : Portland composé (avec ajouts). CEM III : ciment de haut fourneau (laitiers). CEM IV : ciment pouzzolanique. CEM V : ciment composé.", "chapter": "Partie 3 — Courard"}, {"id": "p3-142", "section": "12. Substituts au clinker", "q": "Que contient un CEM III ?", "a": "Ciment principalement composé de clinker + LAITIERS de haut fourneau (S). Forte substitution possible (jusqu'à 95%). Excellent pour environnements agressifs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-143", "section": "12. Substituts au clinker", "q": "Que contient un CEM IV ?", "a": "Ciment pouzzolanique. Clinker + matériaux pouzzolaniques (cendres volantes V, fumée de silice, métakaolin, pouzzolane naturelle).", "chapter": "Partie 3 — Courard"}, {"id": "p3-144", "section": "12. Substituts au clinker", "q": "Cite 4 substituts au clinker.", "a": "1) Laitiers de hauts fourneaux (GGBS, S). 2) Cendres volantes (V) issues de la combustion du charbon. 3) Fines de béton recyclé. 4) Argiles calcinées, pouzzolanes naturelles (D), cendres de balle de riz, calcaire (L/LL).", "chapter": "Partie 3 — Courard"}, {"id": "p3-145", "section": "12. Substituts au clinker", "q": "Propriétés des laitiers de hauts fourneaux comme substitut ?", "a": "Propriétés hydrauliques LATENTES : durcissent en présence d'eau ET d'un activateur (la chaux libérée par l'hydratation du clinker). Très réactifs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-146", "section": "12. Substituts au clinker", "q": "Propriétés des cendres volantes comme substitut ?", "a": "Comportement POUZZOLANIQUE : réagissent avec l'hydroxyde de calcium Ca(OH)2 libéré par le clinker pour former des composés hydraulés stables.", "chapter": "Partie 3 — Courard"}, {"id": "p3-147", "section": "12. Substituts au clinker", "q": "Pourquoi le calcaire comme addition au ciment ?", "a": "Calcaire : ni hydraulique ni pouzzolanique. Mais il améliore la COMPACITÉ du mélange et participe à la formation de composés secondaires. Réduction directe du contenu en clinker.", "chapter": "Partie 3 — Courard"}, {"id": "p3-148", "section": "12. Substituts au clinker", "q": "Origine du terme 'pouzzolane' ?", "a": "Vient de Pouzzoles (près de Naples). Les Romains utilisaient des cendres volcaniques pour obtenir des ciments hydrauliques très résistants (ex : port de Pompéi).", "chapter": "Partie 3 — Courard"}, {"id": "p3-149", "section": "12. Substituts au clinker", "q": "Qu'est-ce qu'une pouzzolane (chimie) ?", "a": "Matériau riche en SiO2 amorphe qui, finement broyé et en présence d'eau, réagit avec la chaux Ca(OH)2 à température ordinaire pour former des composés stables hydraulés.", "chapter": "Partie 3 — Courard"}, {"id": "p3-150", "section": "12. Substituts au clinker", "q": "Qu'est-ce que le métakaolin (MK) ?", "a": "Argile kaolinite calcinée à ~700°C. Pouzzolane artificielle très réactive. Substitut au clinker permettant de réduire l'impact carbone.", "chapter": "Partie 3 — Courard"}, {"id": "p3-151", "section": "12. Substituts au clinker", "q": "Qu'est-ce que la fumée de silice ?", "a": "Microsilice (SiO2 amorphe ultra-fine) issue de la production du silicium. Pouzzolane très réactive. Améliore la résistance et la durabilité des bétons hautes performances.", "chapter": "Partie 3 — Courard"}, {"id": "p3-152", "section": "12. Substituts au clinker", "q": "Quel taux de substitution possible des laitiers dans le ciment ?", "a": "10 à 75% de GGBS en combinaison avec 90 à 25% de CEM I. En préfabrication : ~30% en moyenne. Béton agressif : jusqu'à 80%.", "chapter": "Partie 3 — Courard"}, {"id": "p3-153", "section": "13. Béton & classification", "q": "Différence MORTIER vs BÉTON ?", "a": "Mortier = ciment + eau + sable (<4 mm). Béton = ciment + eau + sable + granulats (>4 mm). La SEULE différence est la taille des grains.", "chapter": "Partie 3 — Courard"}, {"id": "p3-154", "section": "13. Béton & classification", "q": "Usages du mortier ?", "a": "Maçonnerie (joints entre briques/blocs), plâtres, enduits. Mélange à base de sable fin uniquement.", "chapter": "Partie 3 — Courard"}, {"id": "p3-155", "section": "13. Béton & classification", "q": "Usages du béton ?", "a": "Infrastructures (barrages, routes, ponts, ports, aéroports). Bâtiments : poutres, colonnes, dalles, fondations.", "chapter": "Partie 3 — Courard"}, {"id": "p3-156", "section": "13. Béton & classification", "q": "Composition typique d'1 m³ de béton (poids) ?", "a": "Granulats : 1325 kg (50%). Sable : 662 kg (25%). Ciment : 310 kg (10%). Eau : 150 kg (15%). Total : ~2400 kg/m³.", "chapter": "Partie 3 — Courard"}, {"id": "p3-157", "section": "13. Béton & classification", "q": "Part du ciment dans 1 m³ de béton (volume) ?", "a": "Environ 10-15% en VOLUME (~100 L). Mais ce petit volume représente ~70% des émissions de CO2 du béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-158", "section": "13. Béton & classification", "q": "Comment est classé un béton (résistance) ?", "a": "Selon sa résistance à la COMPRESSION à 28 jours, valeur représentative à long terme (~100 ans). Ex : C30/37 = 30 MPa pour cylindre, 37 MPa pour cube.", "chapter": "Partie 3 — Courard"}, {"id": "p3-159", "section": "13. Béton & classification", "q": "Quels échantillons standards pour tester la résistance d'un béton ?", "a": "Cylindre Ø15 cm × H30 cm (test américain/européen). Cube 15×15×15 cm (test européen). La résistance cube est typiquement supérieure à celle du cylindre.", "chapter": "Partie 3 — Courard"}, {"id": "p3-160", "section": "13. Béton & classification", "q": "Que signifie un béton 'à hautes performances' ?", "a": "Béton à résistance élevée (>50 MPa typiquement), souvent obtenu par bas E/C, ajouts pouzzolaniques (fumée de silice), superplastifiants. Plus durable.", "chapter": "Partie 3 — Courard"}, {"id": "p3-161", "section": "13. Béton & classification", "q": "Quels paramètres sont essentiels pour la formulation d'un béton ?", "a": "Quantité de ciment (kg/m³), rapport E/C (eau/ciment), volume de pâte cimentière, taille et nature des granulats, superplastifiants éventuels.", "chapter": "Partie 3 — Courard"}, {"id": "p3-162", "section": "14. Nouveaux liants bas carbone", "q": "Que signifie LC3 ?", "a": "Limestone Calcined Clay Cement. Ciment combinant CLINKER + CALCAIRE non calciné + ARGILE CALCINÉE (métakaolin). Réduit fortement l'empreinte carbone du ciment.", "chapter": "Partie 3 — Courard"}, {"id": "p3-163", "section": "14. Nouveaux liants bas carbone", "q": "Qu'est-ce qu'un AAM (Alkali Activated Material) ?", "a": "Liant sans clinker activé par des solutions alcalines (NaOH, silicate de sodium). Inclut les géopolymères. Réduit massivement l'impact CO2 mais procédé encore en développement.", "chapter": "Partie 3 — Courard"}, {"id": "p3-164", "section": "14. Nouveaux liants bas carbone", "q": "Qu'est-ce que la RCP (Recycled Cement Paste) ?", "a": "Pâte de ciment recyclée : poudre obtenue après séparation de la pâte cimentière dans le béton recyclé. Peut être réutilisée comme matière première dans la fabrication de clinker (économie 5-10%).", "chapter": "Partie 3 — Courard"}, {"id": "p3-165", "section": "14. Nouveaux liants bas carbone", "q": "Que signifient les acronymes GGBS, FA, MK, RHA ?", "a": "GGBS : Ground Granulated Blast Furnace Slag (laitier broyé). FA : Fly Ash (cendres volantes). MK : Metakaolin. RHA : Rice Husk Ash (cendres de balle de riz).", "chapter": "Partie 3 — Courard"}, {"id": "p3-166", "section": "14. Nouveaux liants bas carbone", "q": "Qu'est-ce que la cendre de balle de riz (RHA) ?", "a": "Cendre issue de la combustion de la balle de riz (résidu agricole). Très riche en SiO2 amorphe. Pouzzolane très réactive utilisable en substitut du clinker.", "chapter": "Partie 3 — Courard"}, {"id": "p3-167", "section": "14. Nouveaux liants bas carbone", "q": "Qu'est-ce qu'un géopolymère ?", "a": "Liant formé par activation alcaline d'un précurseur aluminosilicate (métakaolin, laitier, cendres). Réseau 3D Si-O-Al. Bonnes propriétés mécaniques, faible empreinte carbone.", "chapter": "Partie 3 — Courard"}, {"id": "p3-168", "section": "14. Nouveaux liants bas carbone", "q": "Pourquoi les nouveaux liants ne suppriment-ils pas l'impact carbone ?", "a": "Ils le RÉDUISENT mais ne le suppriment pas. Ils nécessitent encore des activateurs (souvent NaOH, énergivore à produire) et certaines matières premières non décarbonatées.", "chapter": "Partie 3 — Courard"}, {"id": "p3-169", "section": "14. Nouveaux liants bas carbone", "q": "Quel projet européen recycle des fines de béton dans le ciment ?", "a": "Projet SeRaMCo (BE, FR, DE, LU, NL) : remplace 5 à 10% des matières premières du clinker par des fines issues du béton recyclé.", "chapter": "Partie 3 — Courard"}, {"id": "p3-170", "section": "15. CCUS", "q": "Que signifie CCUS ?", "a": "Carbon Capture, Use and Storage. Technologie qui capture le CO2 émis, le transporte vers un site de stockage géologique ou de valorisation industrielle.", "chapter": "Partie 3 — Courard"}, {"id": "p3-171", "section": "15. CCUS", "q": "Quels sont les 3 étapes du CCUS ?", "a": "1) CAPTURE (séparation et concentration du CO2). 2) TRANSPORT (pipelines pressurisés). 3) STOCKAGE ou USAGE (géologique, minéralisation, chimie).", "chapter": "Partie 3 — Courard"}, {"id": "p3-172", "section": "15. CCUS", "q": "Quelles sont les exigences pour la capture du CO2 ?", "a": "Efficacité de capture >90%. Pureté du CO2 capturé >95%. À un coût et une consommation énergétique acceptables.", "chapter": "Partie 3 — Courard"}, {"id": "p3-173", "section": "15. CCUS", "q": "Méthode 1 de capture : post-combustion (amines) ?", "a": "Sépare le CO2 des fumées AVANT qu'elles ne sortent par la cheminée. Utilise des amines (composés organiques dérivés de l'ammoniac) pour absorber sélectivement le CO2. La plus mature des techniques.", "chapter": "Partie 3 — Courard"}, {"id": "p3-174", "section": "15. CCUS", "q": "Méthode 2 de capture : oxyfuel combustion ?", "a": "Au lieu d'utiliser de l'air (78% azote), on utilise de l'OXYGÈNE PUR pour la combustion. Les fumées sont alors quasi pures en CO2, facilitant la capture.", "chapter": "Partie 3 — Courard"}, {"id": "p3-175", "section": "15. CCUS", "q": "Méthode 3 de capture : séparation directe ?", "a": "Le procédé cimentier est modifié pour séparer l'étape de décarbonatation du calcaire de l'étape de clinkérisation. Permet d'obtenir un CO2 très pur dès la sortie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-176", "section": "15. CCUS", "q": "Comment transporte-t-on le CO2 dans le cadre du CCUS ?", "a": "Compression à haute pression puis injection dans des PIPELINES. Réseau européen en préparation (ex : Fluxys depuis Zeebrugge).", "chapter": "Partie 3 — Courard"}, {"id": "p3-177", "section": "15. CCUS", "q": "Capacité prévue du réseau Fluxys (Zeebrugge) ?", "a": "20 à 40 millions de tonnes de CO2 par an via pipelines offshore. Préparation d'un réseau européen.", "chapter": "Partie 3 — Courard"}, {"id": "p3-178", "section": "15. CCUS", "q": "Conditions pour un stockage géologique du CO2 ?", "a": "1) POROSITÉ (volume utile). 2) PERMÉABILITÉ (interconnexions des pores). 3) PERMANENCE (couche imperméable étanche au-dessus). Stockage à >1 km de profondeur.", "chapter": "Partie 3 — Courard"}, {"id": "p3-179", "section": "15. CCUS", "q": "Capacité de rétention d'un stockage géologique du CO2 ?", "a": "Très probable (>99%) de retenir >99% du CO2 pendant >100 ans. Probable de retenir 99% pendant >1000 ans (Rapport GIEC 2005).", "chapter": "Partie 3 — Courard"}, {"id": "p3-180", "section": "15. CCUS", "q": "Exemples de stockages géologiques de CO2 en activité ?", "a": "Norvège : Sleipner et Snøhvit (26 Mt CO2 stockées depuis 1996). Total mondial : ~300 Mt depuis 50 ans.", "chapter": "Partie 3 — Courard"}, {"id": "p3-181", "section": "15. CCUS", "q": "Qu'est-ce que le projet FRITCO2T ?", "a": "Projet de valorisation du CO2 : usages directs (solvant, agent moussant), transformation chimique en monomères/polymères, minéralisation, applications en pharmacie/cosmétologie, carburants synthétiques.", "chapter": "Partie 3 — Courard"}, {"id": "p3-182", "section": "15. CCUS", "q": "Pourquoi le CCUS n'est-il pas une solution miracle ?", "a": "Tant que le ciment sera produit par les procédés classiques, les émissions resteront significatives. Le CCUS capture mais ne supprime pas, et coûte cher en énergie et infrastructures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-183", "section": "16. Industrie du fer & de l'acier", "q": "Part de la sidérurgie dans les émissions mondiales de CO2 ?", "a": "Environ 7% (parfois 6-8%). Émissions liées aux combustibles fossiles (coke) et à la réduction chimique du minerai de fer.", "chapter": "Partie 3 — Courard"}, {"id": "p3-184", "section": "16. Industrie du fer & de l'acier", "q": "Quelles sont les 2 étapes principales de la production d'acier ?", "a": "1) HAUT FOURNEAU : minerai → FONTE liquide. 2) CONVERTISSEUR LD : fonte → ACIER. Chaque étape génère des coproduits valorisables (laitiers, scories).", "chapter": "Partie 3 — Courard"}, {"id": "p3-185", "section": "16. Industrie du fer & de l'acier", "q": "Comment fonctionne le haut fourneau ?", "a": "Mélange chargé : minerai de fer + COKE (carbone) + fondants (calcaire). Chauffage à ~1500°C. Produit : fonte liquide (riche en C) + laitier de haut fourneau.", "chapter": "Partie 3 — Courard"}, {"id": "p3-186", "section": "16. Industrie du fer & de l'acier", "q": "Réaction principale de réduction dans le haut fourneau ?", "a": "Fe2O3 + 3 CO → 2 Fe + 3 CO2. Le coke génère le CO réducteur. Réaction à très haute température.", "chapter": "Partie 3 — Courard"}, {"id": "p3-187", "section": "16. Industrie du fer & de l'acier", "q": "Décarbonatation dans le haut fourneau ?", "a": "CaCO3 → CaO + CO2. Le calcaire ajouté comme fondant se décompose. Le CaO formé absorbe les impuretés (Si, Al, Mn) du minerai pour former le laitier.", "chapter": "Partie 3 — Courard"}, {"id": "p3-188", "section": "16. Industrie du fer & de l'acier", "q": "Qu'est-ce que le coke utilisé dans le haut fourneau ?", "a": "Charbon distillé (sans O2, à ~1000°C) pour éliminer les matières volatiles. Riche en carbone pur. Sert à la fois de réducteur (CO) et de source d'énergie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-189", "section": "16. Industrie du fer & de l'acier", "q": "Qu'est-ce que la fonte (cast iron) ?", "a": "Alliage Fe-C avec 2 à 6% de carbone. Issue du haut fourneau. FRAGILE (haute teneur en C). Doit être convertie en acier par décarburation.", "chapter": "Partie 3 — Courard"}, {"id": "p3-190", "section": "16. Industrie du fer & de l'acier", "q": "Comment fonctionne le convertisseur LD ?", "a": "Convertisseur Linz-Donawitz : injection d'OXYGÈNE PUR à travers une lance dans la fonte liquide. L'oxygène oxyde les impuretés (C, Si, Mn, P), transformant la fonte en acier.", "chapter": "Partie 3 — Courard"}, {"id": "p3-191", "section": "16. Industrie du fer & de l'acier", "q": "Quelles sont les principales réactions dans le convertisseur LD ?", "a": "Si + O2 → SiO2. 2 Mn + O2 → 2 MnO. 2 P + 5/2 O2 → P2O5. P2O5 + 4 CaO → 4CaO·P2O5. CaO + FeS → CaS + FeO. Décarburation : C + 1/2 O2 → CO.", "chapter": "Partie 3 — Courard"}, {"id": "p3-192", "section": "16. Industrie du fer & de l'acier", "q": "Pourquoi ajoute-t-on du CaO dans le convertisseur ?", "a": "Pour fixer les impuretés acides (Si, P, S) sous forme d'oxydes et de sulfures dans la scorie. Le CaO joue le rôle de fondant basique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-193", "section": "16. Industrie du fer & de l'acier", "q": "Qu'est-ce qui distingue la SCORIE D'ACIÉRIE du LAITIER de haut fourneau ?", "a": "Compositions chimiques différentes. Scorie d'aciérie : riche en FeO (18-21%) et MnO (5-7%). Laitier de haut fourneau : riche en Al2O3 (11-12%) et MgO (7,5-10%). Caractéristiques mécaniques aussi différentes.", "chapter": "Partie 3 — Courard"}, {"id": "p3-194", "section": "16. Industrie du fer & de l'acier", "q": "Quel produit donne une scorie en se solidifiant ?", "a": "La scorie solidifie LENTEMENT à l'air, surtout sous l'action de la pluie. Cela nécessite un stockage soigné pour éviter une réactivité chimique progressive.", "chapter": "Partie 3 — Courard"}, {"id": "p3-195", "section": "17. Laitiers & scories", "q": "Composition chimique typique du laitier de haut fourneau (GBFS) ?", "a": "SiO2 : 31-35%. Al2O3 : 13-16%. CaO : 37-40%. MgO : 8-10%. Fe2O3 : 0,2-0,4%. Composition proche du clinker mais en proportions différentes.", "chapter": "Partie 3 — Courard"}, {"id": "p3-196", "section": "17. Laitiers & scories", "q": "Composition chimique typique de la scorie LD (steelworks slag) ?", "a": "CaO : 42-46%. SiO2 : 12-18%. Al2O3 : ~1%. MgO : 2-6%. FeO : 18-21%. MnO : 5-7%. P2O5 : 1,5-3,5%. Bien plus de fer/manganèse, beaucoup moins d'alumine.", "chapter": "Partie 3 — Courard"}, {"id": "p3-197", "section": "17. Laitiers & scories", "q": "Pourquoi le ratio (CaO+MgO)/SiO2 doit-il être >1 pour le laitier ?", "a": "Pour que le laitier soit suffisamment BASIQUE et présente une bonne réactivité hydraulique latente. Vérification via le diagramme de Kiel (S + A + C = 100%).", "chapter": "Partie 3 — Courard"}, {"id": "p3-198", "section": "17. Laitiers & scories", "q": "Pourquoi le MgO du GBFS participe-t-il à la résistance ?", "a": "À la différence du clinker, le MgO du GBFS amorphe participe à la formation des hydrates. Important pour le développement de la résistance.", "chapter": "Partie 3 — Courard"}, {"id": "p3-199", "section": "17. Laitiers & scories", "q": "Pourquoi le Al2O3 détermine-t-il la réactivité du GBFS ?", "a": "L'alumine influence la cinétique d'hydratation : plus d'Al2O3 = plus de réactivité (formation accélérée des phases CASH).", "chapter": "Partie 3 — Courard"}, {"id": "p3-200", "section": "17. Laitiers & scories", "q": "Densité spécifique du GBFS ?", "a": "Entre 2,8 et 3,0 g/cm³. Légèrement inférieure au clinker (3,1 g/cm³).", "chapter": "Partie 3 — Courard"}, {"id": "p3-201", "section": "17. Laitiers & scories", "q": "Absorption d'eau du GBFS ?", "a": "Inférieure à 4%. Matériau peu poreux malgré son apparence sableuse.", "chapter": "Partie 3 — Courard"}, {"id": "p3-202", "section": "17. Laitiers & scories", "q": "Comment se présente visuellement un GBFS ?", "a": "Sable jaune paille (forme granulée). Granulométrie 0/8 mm typique. Si concassé : couleur grise. Si refroidissement lent : compact. Si refroidissement par eau : poreux.", "chapter": "Partie 3 — Courard"}, {"id": "p3-203", "section": "17. Laitiers & scories", "q": "Qu'est-ce que la ghélénite (C2SA) ?", "a": "Phase cristalline pouvant être présente dans le GBFS : Ca2Al[AlSiO7]. Sa présence (laitier cristallisé) diminue la réactivité hydraulique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-204", "section": "17. Laitiers & scories", "q": "Qu'est-ce que la bélite (C2S) ?", "a": "Silicate bicalcique (Ca2SiO4). Phase du ciment (hydratation lente). Aussi présente dans certains GBFS partiellement cristallisés.", "chapter": "Partie 3 — Courard"}, {"id": "p3-205", "section": "17. Laitiers & scories", "q": "Comportement du GBFS dans le béton : résistance ?", "a": "Résistance INFÉRIEURE au jeune âge (réaction lente). Équivalente ou SUPÉRIEURE à moyen/long terme. Excellent pour les bétons agressifs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-206", "section": "17. Laitiers & scories", "q": "Pourquoi le GBFS dégage moins de chaleur que le ciment Portland ?", "a": "L'hydratation est plus LENTE et moins exothermique. Avantage pour les bétons massifs (barrages, fondations épaisses) où la chaleur d'hydratation crée des fissures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-207", "section": "17. Laitiers & scories", "q": "Pourquoi le GBFS résiste mieux aux environnements agressifs ?", "a": "Faible teneur en C3A et chaux libre dans les hydrates. Donc moins sensible aux attaques sulfatiques et chimiques. Idéal pour stations d'épuration, égouts.", "chapter": "Partie 3 — Courard"}, {"id": "p3-208", "section": "17. Laitiers & scories", "q": "Quelles applications du GBFS dans les ciments ?", "a": "CEM II (Portland composé) : substitution modérée. CEM III (ciment de haut fourneau) : jusqu'à 95% de GBFS. Préfabrication, BPE, pipes d'assainissement, bétons agressifs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-209", "section": "17. Laitiers & scories", "q": "Qu'est-ce qu'une brique de laitier ?", "a": "Brique fabriquée par compression à chaud (autoclave) d'un mélange : 1 part de ciment + 15 parts de GBFS + sable. Utilisée près des eaux usées, cheminées, agriculture.", "chapter": "Partie 3 — Courard"}, {"id": "p3-210", "section": "17. Laitiers & scories", "q": "Propriétés des briques de laitier ?", "a": "Densité 1,4-2,2. Résistance 5-30 MPa (augmente avec le temps). Très dure (non clouable). Conductivité thermique faible (~0,6-0,75 W/m·K). Résistance au gel et aux agents chimiques excellente.", "chapter": "Partie 3 — Courard"}, {"id": "p3-211", "section": "17. Laitiers & scories", "q": "Que sont les Grave-laitier et Sable-laitier en construction routière ?", "a": "Mélanges utilisés en couches de fondation/base routière. Grave-laitier : 0/20 mm + 10-20% laitier vitrifié + activateur. Sable-laitier : analogue avec sable. Très durables avec activation calcique ou sulfo-calcique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-212", "section": "17. Laitiers & scories", "q": "Quel pourcentage de laitier vitrifié dans le Grave-laitier ?", "a": "10 à 20% (granulés ou en boules). Si laitier hautement réactif (broyé ou activé) : 8 à 13%. Plus la réactivité augmente, moins on en met.", "chapter": "Partie 3 — Courard"}, {"id": "p3-213", "section": "17. Laitiers & scories", "q": "Quel activateur basique est utilisé pour le laitier en route ?", "a": "Calcique (chaux). Sulfo-calcique (chaux + gypse). Ou cendres volantes. Ou ciment. Permet l'attaque de la structure vitreuse du laitier → formation de C-S-H.", "chapter": "Partie 3 — Courard"}, {"id": "p3-214", "section": "17. Laitiers & scories", "q": "Pourquoi le laitier cristallisé n'a-t-il pas de propriétés hydrauliques ?", "a": "Refroidi à l'air, il cristallise → perd la phase amorphe réactive. Il devient alors un simple agrégat (sable de substitution), sans pouvoir liant.", "chapter": "Partie 3 — Courard"}, {"id": "p3-215", "section": "18. DRI & décarbonation", "q": "Que signifie DRI ?", "a": "Direct Reduced Iron. Procédé de production de fer SANS haut fourneau classique. Le minerai de fer est réduit en fer spongieux par des gaz réducteurs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-216", "section": "18. DRI & décarbonation", "q": "Comment fonctionne le procédé DRI ?", "a": "Le minerai de fer (sous forme de pellets) entre dans un réacteur. Il est exposé à un mélange de gaz réducteurs (H2 + CO). L'oxygène est arraché, formant du fer métallique presque pur (sponge iron).", "chapter": "Partie 3 — Courard"}, {"id": "p3-217", "section": "18. DRI & décarbonation", "q": "Qu'est-ce que le 'sponge iron' (fer spongieux) ?", "a": "Fer presque pur produit par DRI, de texture poreuse (d'où 'spongieux'). Utilisé directement ou compressé en briquettes. Sert ensuite dans les fours à arc électrique (EAF).", "chapter": "Partie 3 — Courard"}, {"id": "p3-218", "section": "18. DRI & décarbonation", "q": "Pourquoi le DRI est-il une voie de décarbonation ?", "a": "1) Pas de haut fourneau → moins de coke et donc moins de CO2. 2) Flexibilité énergétique : gaz naturel (moins polluant que coke) ou hydrogène vert (carbone-free). 3) Ne produit PAS de laitier.", "chapter": "Partie 3 — Courard"}, {"id": "p3-219", "section": "18. DRI & décarbonation", "q": "Qu'est-ce qu'un EAF ?", "a": "Electric Arc Furnace : four à arc électrique. Utilise l'énergie électrique pour faire fondre le fer spongieux et/ou de la ferraille, et produire de l'acier. Faible empreinte CO2 si électricité décarbonée.", "chapter": "Partie 3 — Courard"}, {"id": "p3-220", "section": "18. DRI & décarbonation", "q": "DRI au gaz naturel vs DRI à l'hydrogène ?", "a": "Au gaz naturel : émissions CO2 réduites mais non nulles. À l'hydrogène vert (issu d'électrolyse renouvelable) : émissions QUASI NULLES. C'est l'horizon de la sidérurgie décarbonée.", "chapter": "Partie 3 — Courard"}, {"id": "p3-221", "section": "18. DRI & décarbonation", "q": "Quel est l'inconvénient du DRI sans laitier ?", "a": "Le laitier de haut fourneau est un sous-produit valorisable dans la cimenterie. Avec le DRI, cette source disparaît, posant question pour l'approvisionnement en substituts au clinker.", "chapter": "Partie 3 — Courard"}, {"id": "p3-222", "section": "18. DRI & décarbonation", "q": "Énergie nécessaire pour l'électrolyse directe du minerai de fer ?", "a": "Environ 3,6 MWh par tonne de fer en électricité verte. Réaction théorique : ½ Fe2O3 → Fe + ¾ O2. Voie d'avenir mais à grande échelle commerciale pas encore mature.", "chapter": "Partie 3 — Courard"}, {"id": "p3-223", "section": "18. DRI & décarbonation", "q": "Quels sont les acteurs européens du DRI ?", "a": "Notamment ArcelorMittal en Belgique/France/Allemagne. Plusieurs projets pilotes (HYBRIT en Suède) visent l'acier vert à l'hydrogène.", "chapter": "Partie 3 — Courard"}, {"id": "p3-224", "section": "19. MSWI (mâchefers)", "q": "Que signifie MSWI ?", "a": "Municipal Solid Waste Incinerated. Incinération des déchets ménagers solides après tri préalable (recyclage des fractions valorisables).", "chapter": "Partie 3 — Courard"}, {"id": "p3-225", "section": "19. MSWI (mâchefers)", "q": "Pourquoi incinérer les déchets ménagers résiduels ?", "a": "1) Réduire le volume (5% restant). 2) Éliminer les nuisances (odeurs, vermines, incendies, explosions de méthane). 3) Récupérer de l'énergie (chaleur, électricité).", "chapter": "Partie 3 — Courard"}, {"id": "p3-226", "section": "19. MSWI (mâchefers)", "q": "Quels nuisances l'enfouissement de déchets crée-t-il ?", "a": "1) Environnementales : odeurs, pollution visuelle. 2) Sanitaires : bactéries pathogènes, rongeurs, oiseaux. 3) Risques : incendies, explosions de méthane.", "chapter": "Partie 3 — Courard"}, {"id": "p3-227", "section": "19. MSWI (mâchefers)", "q": "Quels sont les 3 produits issus de l'incinération de 1 t de déchets ?", "a": "1) FUMÉES (CO2, NOx, dioxines, particules fines, gaz acides). 2) CENDRES VOLANTES (capturées par filtres à manches/électrofiltres). 3) ~200 kg de MÂCHEFERS (bottom ash).", "chapter": "Partie 3 — Courard"}, {"id": "p3-228", "section": "19. MSWI (mâchefers)", "q": "Qu'est-ce que la bottom ash (mâchefer) ?", "a": "Résidu solide non volatil de l'incinération. Représente 20-30% du poids et environ 5% du volume des déchets initiaux. Sortie du four à 250-750°C.", "chapter": "Partie 3 — Courard"}, {"id": "p3-229", "section": "19. MSWI (mâchefers)", "q": "Composition typique des mâchefers ?", "a": "1) Résidus métalliques : Fe, Cu, Zn, Al. 2) Minéraux issus de la combustion : oxydes, silicates, verre fondu. 3) Parfois CaO libre (chaux vive) encore réactif.", "chapter": "Partie 3 — Courard"}, {"id": "p3-230", "section": "19. MSWI (mâchefers)", "q": "Pourquoi refroidir immédiatement les mâchefers ?", "a": "Sortent du four à 250-750°C. Refroidissement par immersion dans un bac d'eau pour : sécurité (incendies, brûlures), gestion des poussières, étanchéité hydraulique du four.", "chapter": "Partie 3 — Courard"}, {"id": "p3-231", "section": "19. MSWI (mâchefers)", "q": "Quels systèmes d'extraction des mâchefers ?", "a": "Systèmes à chaînes à barreaux (bar chains) ou poussoirs mécaniques. L'objectif est de maintenir une étanchéité hydraulique (garde d'eau) pour éviter émission de fumées/poussières.", "chapter": "Partie 3 — Courard"}, {"id": "p3-232", "section": "19. MSWI (mâchefers)", "q": "Aspect, granulométrie et densité des mâchefers ?", "a": "Aspect : matériau gris. Granulométrie : variable. Teneur en eau : jusqu'à 20% (refroidissement) → 10% (drainage). Densité : ~1000 kg/m³ (cooling) → 1100-1200 kg/m³ (après déferraillage et drainage).", "chapter": "Partie 3 — Courard"}, {"id": "p3-233", "section": "19. MSWI (mâchefers)", "q": "Pourquoi la MATURATION des mâchefers est-elle nécessaire ?", "a": "À la sortie du four, contiennent encore CaO libre (chaux vive) réactif. Risques : gonflement, lixiviation de métaux lourds, efflorescences. Sans maturation, le matériau est dangereux à utiliser.", "chapter": "Partie 3 — Courard"}, {"id": "p3-234", "section": "19. MSWI (mâchefers)", "q": "Durée typique de la maturation des mâchefers ?", "a": "18 semaines à 6 mois en plein air. Pendant cette période, des prélèvements réguliers contrôlent la qualité (teneur en métaux lourds, pH, réactivité).", "chapter": "Partie 3 — Courard"}, {"id": "p3-235", "section": "19. MSWI (mâchefers)", "q": "Que se passe-t-il chimiquement durant la maturation des mâchefers ?", "a": "1) CaO + H2O → Ca(OH)2 (hydratation). 2) Ca(OH)2 + CO2 → CaCO3 + H2O (carbonatation naturelle). 3) Stabilisation des autres composés réactifs (ettringite, aluminates).", "chapter": "Partie 3 — Courard"}, {"id": "p3-236", "section": "19. MSWI (mâchefers)", "q": "Quelles sont les principales applications des mâchefers stabilisés ?", "a": "Infrastructure : remblais, fondations de routes et dalles. Pour les routes : sous-couches selon le trafic (T5 faible → couches inférieures, T3-T1 moyenne/forte → couches de base).", "chapter": "Partie 3 — Courard"}, {"id": "p3-237", "section": "19. MSWI (mâchefers)", "q": "Limites de la maturation classique des mâchefers ?", "a": "1) Durée longue (semaines à mois). 2) Inefficace dans certains cas. 3) Dépendante des conditions météorologiques (T°, humidité). 4) Espace de stockage important nécessaire.", "chapter": "Partie 3 — Courard"}, {"id": "p3-238", "section": "19. MSWI (mâchefers)", "q": "Pourquoi le pH des mâchefers est-il élevé ?", "a": "pH proche de 12 à cause de la chaux libérée. Avantage : limite l'activité biologique et la lixiviation. Inconvénient : empêche l'usage direct dans certains contextes.", "chapter": "Partie 3 — Courard"}, {"id": "p3-239", "section": "19. MSWI (mâchefers)", "q": "Quels avantages des mâchefers comme matériau de remplissage ?", "a": "1) Faibles échanges d'eau. 2) Faible activité biologique. 3) Presque pas d'air. 4) pH élevé (~12) limitant la lixiviation. 5) Bonne compacité. 6) Stabilisation des polluants intrinsèques.", "chapter": "Partie 3 — Courard"}, {"id": "p3-240", "section": "20. Carbonatation accélérée", "q": "Principe de la carbonatation accélérée des mâchefers ?", "a": "Remplacer la maturation lente naturelle par un traitement forcé : utiliser du CO2 capté (d'autres industries) pour transformer rapidement le CaO réactif en CaCO3 stable.", "chapter": "Partie 3 — Courard"}, {"id": "p3-241", "section": "20. Carbonatation accélérée", "q": "Réactions chimiques de la carbonatation accélérée ?", "a": "1) CO2 + H2O → H2CO3. 2) H2CO3 + OH- → HCO3- + H2O. 3) HCO3- + OH- → CO3²- + H2O. 4) Ca(OH)2 → Ca²+ + 2 OH-. 5) Ca²+ + CO3²- → CaCO3.", "chapter": "Partie 3 — Courard"}, {"id": "p3-242", "section": "20. Carbonatation accélérée", "q": "Conditions optimales pour carbonater les mâchefers ?", "a": "Humidité contrôlée (~20%), température modérée (~30°C), pression de CO2 accrue (atmosphères enrichies, ex : [CO2] = 12% vol). Durée : 1-168 heures selon paramètres.", "chapter": "Partie 3 — Courard"}, {"id": "p3-243", "section": "20. Carbonatation accélérée", "q": "Quels paramètres ont été étudiés pour la carbonatation ?", "a": "1) Taille des particules : 0/2 mm et 0/20 mm. 2) Durée d'exposition : 1, 2, 4, 8, 24, 48, 168 h. 3) Teneur en eau (WC) : 2%, 20%, 45%.", "chapter": "Partie 3 — Courard"}, {"id": "p3-244", "section": "20. Carbonatation accélérée", "q": "Effet de la durée sur la teneur en CaCO3 ?", "a": "La teneur en CaCO3 augmente avec la durée d'exposition au CO2, jusqu'à un plateau. Granulométrie fine (0/2 mm) atteint un plateau plus rapidement que 0/20 mm.", "chapter": "Partie 3 — Courard"}, {"id": "p3-245", "section": "20. Carbonatation accélérée", "q": "Effet du taux d'humidité sur la carbonatation ?", "a": "L'humidité ACTIVE la réaction (le CO2 doit se dissoudre en H2CO3). Mais excès d'eau bloque le CO2. Optimum vers 20%. Approche 'moisty' (B) plus efficace que sèche.", "chapter": "Partie 3 — Courard"}, {"id": "p3-246", "section": "20. Carbonatation accélérée", "q": "Effet de la carbonatation sur le pH des mâchefers ?", "a": "Le pH diminue (de ~12 à ~9-10). Stabilisation du pH grâce à la transformation du Ca(OH)2 (très basique) en CaCO3 (proche neutre).", "chapter": "Partie 3 — Courard"}, {"id": "p3-247", "section": "20. Carbonatation accélérée", "q": "Quels sont les 3 intérêts majeurs de la carbonatation accélérée ?", "a": "1) Valorisation RAPIDE des mâchefers (heures vs semaines). 2) Réduction des risques environnementaux (lixiviation, gonflements). 3) FERMETURE du cycle du calcaire (CO2 industriel réutilisé).", "chapter": "Partie 3 — Courard"}, {"id": "p3-248", "section": "20. Carbonatation accélérée", "q": "Propriétés physiques après carbonatation (densité) ?", "a": "Augmentation de la densité : ~1840 → 2145 kg/m³ pour fines. Devient plus stable et compactable. Approche les densités des granulats naturels.", "chapter": "Partie 3 — Courard"}, {"id": "p3-249", "section": "20. Carbonatation accélérée", "q": "Effet de la carbonatation sur l'absorption d'eau ?", "a": "Légère augmentation pour les fines (~6,9% → 7,3%). Pour grosses fractions : 2 → 2,4%. La porosité reste mais est moins réactive.", "chapter": "Partie 3 — Courard"}, {"id": "p3-250", "section": "20. Carbonatation accélérée", "q": "Effet du remplacement à 25% par mâchefer dans le béton ?", "a": "1) Réduit la résistance à la compression (par rapport au béton de référence). 2) Réduit la résistance à la carbonatation. 3) AMÉLIORE la résistance au gel/dégel.", "chapter": "Partie 3 — Courard"}, {"id": "p3-251", "section": "20. Carbonatation accélérée", "q": "Tests pour valider l'usage des mâchefers en pavés bétons ?", "a": "1) Résistance au fendage (NBN B 21-311). 2) Absorption d'eau par immersion (NBN B 15-215). 3) Résistance à l'usure (NBN B 15-223, test Amsler). 4) Lixiviation des ETM (DIN 38414-54).", "chapter": "Partie 3 — Courard"}, {"id": "p3-252", "section": "20. Carbonatation accélérée", "q": "Résultats : pavés en béton à 10% de mâchefers ?", "a": "Résistance au fendage : 4,05 ± 0,53 N/mm². Absorption d'eau : 6,29-6,61%. Abrasion : 0,98-1,36 mm. Conformes aux normes pour usage en pavés extérieurs.", "chapter": "Partie 3 — Courard"}, {"id": "p3-253", "section": "20. Carbonatation accélérée", "q": "Production de mâchefers en Europe ?", "a": "Sur ~230 Mt de déchets ménagers/an, environ 18 Mt de mâchefers (MSWI BA) sont produits. Potentiel énorme de valorisation comme substitut au sable et granulats (~2,2 Gt utilisés/an).", "chapter": "Partie 3 — Courard"}, {"id": "p3-254", "section": "21. Recyclage des pneus", "q": "Origine du caoutchouc naturel ?", "a": "Extrait du latex naturel de l'hévéa (et autres arbres). Émulsion de polymères dans l'eau (30-45% solides). Récupéré par évaporation ou coagulation acide.", "chapter": "Partie 3 — Courard"}, {"id": "p3-255", "section": "21. Recyclage des pneus", "q": "Quel monomère compose le caoutchouc naturel ?", "a": "L'isoprène (un hydrocarbure aliphatique). Le caoutchouc est un polymère linéaire d'isoprène, avec chaînes de 4000-6000 monomères.", "chapter": "Partie 3 — Courard"}, {"id": "p3-256", "section": "21. Recyclage des pneus", "q": "Pourquoi le caoutchouc est-il élastique ?", "a": "1) Chaînes macromoléculaires FLEXIBLES. 2) Réticulation à grande distance (~100 atomes C entre points de réticulation). 3) Tg (température vitreuse) < -20°C → comportement rubbery à T ambiante.", "chapter": "Partie 3 — Courard"}, {"id": "p3-257", "section": "21. Recyclage des pneus", "q": "Qu'est-ce que la vulcanisation ?", "a": "Réticulation du caoutchouc par du soufre. Mélange à 100-140°C avec soufre (~1%) + additifs (plastifiants, accélérateurs, antioxydants). Durée : 40 min à 2 h. Crée un réseau réticulé permanent (élastomère vulcanisé).", "chapter": "Partie 3 — Courard"}, {"id": "p3-258", "section": "21. Recyclage des pneus", "q": "Pourquoi les pneus vulcanisés sont-ils peu recyclables mécaniquement ?", "a": "La vulcanisation crée des LIAISONS PERMANENTES entre chaînes. On ne peut plus refondre le matériau. Le réseau est irréversible — comme un thermodurcissable.", "chapter": "Partie 3 — Courard"}, {"id": "p3-259", "section": "21. Recyclage des pneus", "q": "Quelles sont les 3 sources principales de déchets de caoutchouc ?", "a": "1) Déchets de fabrication (chutes). 2) Déchets autres que pneus. 3) Pneus usagés (la majorité). Recytyre Belgique : 92 596 tonnes collectées en 2024.", "chapter": "Partie 3 — Courard"}, {"id": "p3-260", "section": "21. Recyclage des pneus", "q": "Taux de recyclage des pneus usagés (Recytyre 2024) ?", "a": "100% des pneus collectés sont recyclés en matières (granulats, poudres) ou valorisés énergétiquement.", "chapter": "Partie 3 — Courard"}, {"id": "p3-261", "section": "21. Recyclage des pneus", "q": "Qu'est-ce que le rechapage d'un pneu ?", "a": "Remplacement de la bande de roulement usée par une bande neuve, en réutilisant la carcasse. 90% des pneus de camions sont rechapés au moins 1 fois, 70% au moins 2 fois.", "chapter": "Partie 3 — Courard"}, {"id": "p3-262", "section": "21. Recyclage des pneus", "q": "Qu'est-ce que la régénération du caoutchouc ?", "a": "Procédé à haute pression permettant de récupérer le caoutchouc vulcanisé (même en gros morceaux). Le produit est un ingrédient actif pour revêtements, chaussures, tuyaux, courroies industrielles.", "chapter": "Partie 3 — Courard"}, {"id": "p3-263", "section": "21. Recyclage des pneus", "q": "Quels sont les 3 procédés de production de poudrette de caoutchouc ?", "a": "1) Grattage-brossage : récupération de la gomme de surface (rapes, couteaux). 2) Broyage conventionnel : marteaux, broyeurs à cylindres, tamis. 3) Cryobroyage : refroidissement à -80°C dans l'azote liquide puis broyage.", "chapter": "Partie 3 — Courard"}, {"id": "p3-264", "section": "21. Recyclage des pneus", "q": "Tailles typiques de poudrette de caoutchouc ?", "a": "Fine : <300 µm. Moyenne : 500 µm à 2 mm. Grossière : >2 mm. Différents grades pour différentes applications (revêtements, mélanges, asphaltes).", "chapter": "Partie 3 — Courard"}, {"id": "p3-265", "section": "21. Recyclage des pneus", "q": "Cite 3 applications de la poudrette de caoutchouc.", "a": "1) Barrières acoustiques (mur antibruit). 2) Addition au béton/mortier/pâte cimentière. 3) Addition aux enrobés routiers. Aussi : terrains de sport, toitures.", "chapter": "Partie 3 — Courard"}, {"id": "p3-266", "section": "21. Recyclage des pneus", "q": "Pouvoir calorifique d'un pneu en incinération ?", "a": "Supérieur à 7000 kcal/kg. Comparable au charbon. 14 tonnes de pneus ≈ 10 tonnes de fioul lourd. Utilisé en cimenterie, briqueterie.", "chapter": "Partie 3 — Courard"}, {"id": "p3-267", "section": "21. Recyclage des pneus", "q": "Quel exemple belge d'incinération de pneus en cimenterie ?", "a": "Lixhe (années 1990) : consommation quotidienne de 50 tonnes de pneus, soit 15% des besoins énergétiques totaux de l'usine.", "chapter": "Partie 3 — Courard"}, {"id": "p3-268", "section": "21. Recyclage des pneus", "q": "Qu'est-ce qu'une membrane froide en réparation routière ?", "a": "Procédé : interposition d'une membrane froide pour réparer routes fissurées. Composition : 1/3 poudrette caoutchouc (0/1 mm) + 1/3 sable + 1/3 émulsion bitumineuse.", "chapter": "Partie 3 — Courard"}, {"id": "p3-269", "section": "21. Recyclage des pneus", "q": "Composition d'une membrane chaude routière ?", "a": "Application à 190-210°C. Composition : 75-80% bitume + 3% huile + 18-22% caoutchouc (0/1 et 0/2 mm). Membrane étanche et élastique sous l'enrobé.", "chapter": "Partie 3 — Courard"}, {"id": "p3-270", "section": "21. Recyclage des pneus", "q": "Qu'est-ce que le Pneusol ?", "a": "Procédé technique combinant des pneus et du sol. Renforce le sol et lui donne de meilleures caractéristiques géotechniques. Anisotrope ou isotrope selon la disposition des pneus.", "chapter": "Partie 3 — Courard"}, {"id": "p3-271", "section": "21. Recyclage des pneus", "q": "Applications du Pneusol ?", "a": "1) Remblais légers (zones compressibles). 2) Murs de soutènement. 3) Protection de conduites enterrées. 4) Absorbeurs d'énergie (chutes de blocs, avalanches). 5) Fondations anti-sismiques.", "chapter": "Partie 3 — Courard"}, {"id": "p3-272", "section": "21. Recyclage des pneus", "q": "Avantages mécaniques du Pneusol ?", "a": "1) Amélioration significative de la résistance mécanique. 2) Matériau déformable (structures flexibles). 3) Mise en œuvre rapide. 4) Durable (retrouvé intact après 40 ans). 5) Non corrosif, non polluant.", "chapter": "Partie 3 — Courard"}, {"id": "p3-273", "section": "21. Recyclage des pneus", "q": "Pneusol en fondation anti-sismique ?", "a": "Plusieurs couches de Pneusol léger ou de couches de bandes de roulement bondées. Dalle au-dessus permettant à la structure de coulisser horizontalement face aux séismes.", "chapter": "Partie 3 — Courard"}, {"id": "p3-274", "section": "22. Granulats recyclés (BTP)", "q": "Comment fabriquer des granulats recyclés (RCA) ?", "a": "Démantèlement → tri → concassage (jaw crusher pour blocs, impact crusher pour fines) → criblage/séparation en classes granulométriques (0/2, 2/6.3, 6.3/14, 14/20 mm).", "chapter": "Partie 3 — Courard"}, {"id": "p3-275", "section": "22. Granulats recyclés (BTP)", "q": "Différence entre concasseur à mâchoires (jaw) et à impact ?", "a": "JAW CRUSHER : traite les déchets volumineux (dalles béton), ne produit pas de très fines particules, souvent suivi d'un broyage secondaire. IMPACT CRUSHER : produit des fractions fines, usure plus rapide, limité par la taille initiale.", "chapter": "Partie 3 — Courard"}, {"id": "p3-276", "section": "22. Granulats recyclés (BTP)", "q": "Effet du concasseur sur l'aplatissement (FI) des granulats ?", "a": "Le concasseur à mâchoires produit des granulats plus APLATIS (FI plus élevé) que le concasseur à impact. L'aplatissement diminue avec la fraction granulaire.", "chapter": "Partie 3 — Courard"}, {"id": "p3-277", "section": "22. Granulats recyclés (BTP)", "q": "Pourquoi laver les granulats recyclés ?", "a": "Le lavage RÉDUIT significativement la fraction sable (0/4) et les fines (<63 µm). Permet de respecter les normes dans la plupart des pays.", "chapter": "Partie 3 — Courard"}, {"id": "p3-278", "section": "22. Granulats recyclés (BTP)", "q": "Taux d'absorption d'eau des RCA fines (0/2) ?", "a": "Plus élevé que celui des fractions grossières. La pâte cimentaire ancienne adhérée aux granulats explique cette plus haute absorption d'eau.", "chapter": "Partie 3 — Courard"}, {"id": "p3-279", "section": "22. Granulats recyclés (BTP)", "q": "Résistance à la compression d'un béton avec 100% RCA à 28 jours ?", "a": "Environ 8 MPa de moins que le béton de référence (diminution de ~14,4%). Le béton avec RCA reste utilisable, mais sa résistance est plus faible.", "chapter": "Partie 3 — Courard"}, {"id": "p3-280", "section": "22. Granulats recyclés (BTP)", "q": "Quel est l'effet de la composition du béton d'origine sur les RCA ?", "a": "Peu d'influence sur l'aplatissement (qui est essentiellement lié au mode de concassage). Les paramètres ciment, E/C influent plus sur la qualité globale du granulat recyclé.", "chapter": "Partie 3 — Courard"}, {"id": "p3-281", "section": "22. Granulats recyclés (BTP)", "q": "Qu'est-ce que le projet SeRaMCo ?", "a": "INTERREG SeRaMCo (BE, FR, DE, LU, NL) : valorisation des matériaux secondaires (granulats et fines de béton) pour produits préfabriqués. Site Tradecowall en Belgique.", "chapter": "Partie 3 — Courard"}, {"id": "p3-282", "section": "22. Granulats recyclés (BTP)", "q": "Qu'est-ce que le projet PN Recybeton ?", "a": "Programme national français à grande échelle. Programme industrie-orienté visant à incorporer largement les granulats recyclés dans la production de béton.", "chapter": "Partie 3 — Courard"}, {"id": "p3-283", "section": "22. Granulats recyclés (BTP)", "q": "Cite 3 produits préfabriqués SeRaMCo.", "a": "1) Hollow Core Floor Slab (planchers alvéolés). 2) Sound Absorbing L-Wall (murs antibruit). 3) Façade Cladding (parements). Autres : pisé recyclé, foam concrete, salty concrete.", "chapter": "Partie 3 — Courard"}, {"id": "p3-284", "section": "22. Granulats recyclés (BTP)", "q": "Qu'est-ce que le pisé en RCA ?", "a": "Pisé (rammed concrete) à base de granulats fins recyclés (RFA). Composition : 15% ciment + 10% eau + 75% RFA (0/4). Construction low-tech, économique, faible maintenance.", "chapter": "Partie 3 — Courard"}, {"id": "p3-285", "section": "22. Granulats recyclés (BTP)", "q": "Quelles classes granulométriques typiques de RCA ?", "a": "0/2 mm, 2/6.3 mm, 6.3/14 mm, 14/20 mm. La fraction 0/2 représente environ 50% du produit brut (non lavé).", "chapter": "Partie 3 — Courard"}, {"id": "p3-286", "section": "23. Innovation : 3D printing & autres", "q": "Qu'est-ce que l'impression 3D en construction ?", "a": "Fabrication additive de bâtiments ou éléments par dépose successive de couches d'un matériau (béton, mortier). Permet la fabrication automatisée et hautement personnalisée.", "chapter": "Partie 3 — Courard"}, {"id": "p3-287", "section": "23. Innovation : 3D printing & autres", "q": "Cite 2 exemples concrets de bâtiments imprimés en 3D.", "a": "1) Maison Kamp C (Belgique) : maison 2 étages imprimée en un bloc en 2020. 2) ICON aux USA (Texas) : flotte de robots imprimant des communautés entières de maisons.", "chapter": "Partie 3 — Courard"}, {"id": "p3-288", "section": "23. Innovation : 3D printing & autres", "q": "Quels sont les 3 avantages principaux de l'impression 3D en construction ?", "a": "1) CUSTOMISATION (formes uniques impossibles avant). 2) ÉCONOMIES temps & argent (20× plus rapide, ~20% de réduction des coûts par moins de déchets). 3) HAUTE PERFORMANCE (ICON > 350% des exigences structurelles).", "chapter": "Partie 3 — Courard"}, {"id": "p3-289", "section": "23. Innovation : 3D printing & autres", "q": "Qu'est-ce que l'impression 3D au sable recyclé ?", "a": "Technique imprimant des éléments à base d'un squelette granulaire 100% recyclé (RFA). Réduit l'impact environnemental (alternative aux sables naturels en pénurie).", "chapter": "Partie 3 — Courard"}, {"id": "p3-290", "section": "23. Innovation : 3D printing & autres", "q": "Composition pour impression 3D au sable recyclé ?", "a": "100% sable recyclé (béton concassé) comme squelette granulaire + liant cimentaire. Testé pour résistance compression, flexion 3 points, absorption capillaire.", "chapter": "Partie 3 — Courard"}, {"id": "p3-291", "section": "23. Innovation : 3D printing & autres", "q": "Pourquoi le sable est-il une ressource critique mondialement ?", "a": "Marché énorme : 2,2 Gt/an. Beaucoup de pays exportateurs : Top 10 entre 2010-2014 dominé par USA, Hollande, Singapour... Risque d'épuisement des sables exploitables (granulométrie fine).", "chapter": "Partie 3 — Courard"}, {"id": "p3-292", "section": "23. Innovation : 3D printing & autres", "q": "Quelle innovation pour les briques en fin de vie ?", "a": "Recyclage des fines de briques (1-2% du CDW en BE/Nord France). 2 voies de valorisation : 1) Supplementary cementitious material (addition au ciment). 2) Alkali-activated material (sans clinker).", "chapter": "Partie 3 — Courard"}, {"id": "p3-293", "section": "23. Innovation : 3D printing & autres", "q": "Commen
